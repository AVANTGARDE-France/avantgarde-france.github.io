<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avant-gardE — Capture</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07152d}
#capture-root{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#07152d}
#capture-root>.project-card{position:absolute!important;min-height:0!important;backface-visibility:visible!important;display:flex!important;overflow:hidden!important;transform-origin:top left!important}
</style></head><body><main id="capture-root"></main>
<script>
(function(){
 const root=document.getElementById("capture-root");
 window.opener?.postMessage({type:"AVANTGARDE_CAPTURE_READY"},"*");
 window.addEventListener("message",async function receive(event){
  if(event.source!==window.opener||event.data?.type!=="AVANTGARDE_CAPTURE_CARD")return;
  window.removeEventListener("message",receive);
  const d=event.data;
  try{
   for(const href of d.links||[]){const l=document.createElement("link");l.rel="stylesheet";l.href=href;document.head.appendChild(l)}
   for(const css of d.styles||[]){const s=document.createElement("style");s.textContent=css;document.head.appendChild(s)}
   const card=document.createElement("div");card.innerHTML=d.html;
   const source=card.firstElementChild;if(!source)throw new Error("Le recto transmis est vide.");
   root.appendChild(source);
   const vw=window.innerWidth,vh=window.innerHeight,w=Number(d.width),h=Number(d.height);
   if(!vw||!vh||!w||!h)throw new Error("Dimensions de capture invalides.");
   const scale=Math.min(vw/w,vh/h),rw=w*scale,rh=h*scale;
   source.style.setProperty("position","absolute","important");source.style.setProperty("inset","auto","important");
   source.style.setProperty("left",((vw-rw)/2)+"px","important");source.style.setProperty("top",((vh-rh)/2)+"px","important");
   source.style.setProperty("width",w+"px","important");source.style.setProperty("height",h+"px","important");
   source.style.setProperty("min-height",h+"px","important");source.style.setProperty("transform","scale("+scale+")","important");
   source.style.setProperty("transform-origin","top left","important");source.style.setProperty("display","flex","important");
   await Promise.all([...root.querySelectorAll("img")].map(img=>img.decode?.().catch(()=>{})||Promise.resolve()));
   if(document.fonts?.ready)await document.fonts.ready;
   await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   window.opener.postMessage({type:"AVANTGARDE_CAPTURE_RENDERED"},"*");
  }catch(error){window.opener.postMessage({type:"AVANTGARDE_CAPTURE_RENDERED",error:error.message||String(error)},"*")}
 });
})();
</script></body></html>
