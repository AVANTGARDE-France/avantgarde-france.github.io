<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avant-gardE — La France libre</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --navy: #07152d;
    --navy2: #0d2344;
    --gold: #d6ad55;
    --gold-light: #f0d58a;
    --white: #f5f3ed;
    --muted: #b8c0cd;

    --blue-france: #0055A4;
    --red: #EF4135;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--navy);
    color: var(--white);
    font-family: Georgia, "Times New Roman", serif;
}


/* =====================================================
   ÉVÉNEMENTS
===================================================== */

.events-bar {
    height: 36px;
    background: #050f20;
    border-bottom: 1px solid rgba(214,173,85,.35);

    display: flex;
    align-items: center;

    overflow: hidden;

    font-family: Arial, sans-serif;
    font-size: 12px;
}

.events-label {
    flex-shrink: 0;

    height: 100%;

    display: flex;
    align-items: center;

    padding: 0 17px;

    color: var(--gold-light);

    font-weight: bold;

    letter-spacing: 1px;

    border-right: 1px solid rgba(214,173,85,.3);

    position: relative;
    z-index: 5;

    background: #050f20;
}

.events-window {
    flex: 1;

    height: 100%;

    overflow: hidden;

    position: relative;
}

.events-track {
    position: absolute;

    left: 0;
    top: 0;

    height: 100%;

    display: inline-flex;
    align-items: center;

    white-space: nowrap;

    will-change: transform;
}

.event {
    display: inline-flex;
    align-items: center;

    height: 100%;

    padding: 0 35px;

    color: #e3e5e8;

    cursor: pointer;

    transition:
        background .2s,
        color .2s;
}

.event:hover {
    background: rgba(214,173,85,.08);
    color: white;
}

.event strong {
    color: var(--gold-light);
    margin-right: 0;
}

.event-separator {
    color: rgba(214,173,85,.5);
    margin: 0 7px;
}

.events-empty {
    height: 100%;

    display: flex;
    align-items: center;

    padding-left: 18px;

    color: #8e98a6;
}


/* =====================================================
   HEADER
===================================================== */

header {
    height: 82px;

    padding: 0 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid rgba(214,173,85,.25);

    background: rgba(7,21,45,.97);

    position: relative;
}


/* =====================================================
   LOGO
===================================================== */

.logo {
    color: var(--white);

    text-decoration: none;

    display: flex;
    align-items: center;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 28px;

    font-weight: bold;

    letter-spacing: -1.2px;

    line-height: 1;

    font-kerning: normal;

    text-rendering: optimizeLegibility;

    white-space: nowrap;
}

.logo-a,
.logo-e {
    display: inline;

    width: auto;
    height: auto;

    background: transparent;

    border-radius: 0;

    font-family: Georgia, "Times New Roman", serif;

    font-size: inherit;

    font-weight: bold;

    line-height: inherit;
}

.logo-a {
    color: var(--blue-france);
}

.logo-e {
    color: var(--red);
}


/* =====================================================
   ROUE ADMIN
===================================================== */

.admin-gear {

    position: absolute;

    right: 14px;
    top: 7px;

    width: 23px;
    height: 23px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,.42);

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 14px;

    border-radius: 50%;

    transition:
        color .2s,
        background .2s,
        transform .2s;
}

.admin-gear:hover {

    color: var(--gold-light);

    background: rgba(255,255,255,.06);

    transform: rotate(20deg);
}


/* =====================================================
   NAVIGATION
===================================================== */

nav {

    display: flex;

    gap: 28px;

    align-items: center;
}

nav a {

    color: #e7e7e7;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;

    transition: color .2s;
}

nav a:hover {
    color: var(--gold);
}


/* =====================================================
   ZONE CENTRALE
===================================================== */

#accueilContent {
    min-height: 1px;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    padding: 25px;

    text-align: center;

    color: #7e8999;

    font-family: Arial, sans-serif;

    font-size: 11px;

    border-top: 1px solid rgba(255,255,255,.07);
}


/* =====================================================
   MODALE RENDEZ-VOUS
===================================================== */

.rdv-modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.72);

    z-index: 99999;
}

.rdv-modal.active {
    display: flex;
}

.rdv-modal-box {

    position: relative;

    width: min(600px, 100%);

    max-height: 85vh;

    overflow-y: auto;

    background: var(--navy2);

    border: 1px solid rgba(214,173,85,.45);

    box-shadow: 0 25px 80px rgba(0,0,0,.55);

    padding: 35px;

    animation: modalAppear .2s ease-out;
}

@keyframes modalAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.rdv-modal-close {

    position: absolute;

    right: 15px;
    top: 12px;

    width: 30px;
    height: 30px;

    border: 0;

    background: transparent;

    color: #c5ccd5;

    font-size: 25px;

    cursor: pointer;
}

.rdv-modal-close:hover {
    color: white;
}

.rdv-modal-kicker {

    color: var(--gold);

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 2px;

    font-weight: bold;

    margin-bottom: 12px;
}

.rdv-modal-title {

    font-size: 30px;

    line-height: 1.2;

    margin-bottom: 20px;
}

.rdv-modal-info {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 22px;
}

.rdv-modal-info span {

    padding: 7px 10px;

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.08);

    color: #d6dce3;

    font-family: Arial, sans-serif;

    font-size: 11px;
}

.rdv-modal-description {

    color: #c4ccd6;

    font-family: Arial, sans-serif;

    font-size: 14px;

    line-height: 1.7;

    white-space: pre-line;
}

.rdv-modal-link {

    display: inline-block;

    margin-top: 22px;

    padding: 10px 17px;

    background: var(--gold);

    color: var(--navy);

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 11px;

    font-weight: bold;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 800px) {

    header {

        height: auto;

        padding: 20px;

        flex-direction: column;

        gap: 18px;
    }

    nav {

        gap: 15px;

        flex-wrap: wrap;

        justify-content: center;
    }

    nav a {

        font-size: 10px;
    }

    .logo {
        font-size: 27px;
    }

    .rdv-modal-box {

        padding: 28px 22px;
    }

}

@media (max-width: 420px) {

    .logo {
        font-size: 24px;
        letter-spacing: -1px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     ÉVÉNEMENTS
===================================================== -->

<div class="events-bar">

    <div class="events-label">
        EVENEMENT
    </div>

    <div class="events-window">

        <div id="eventsTrack" class="events-track">

            <div class="events-empty">
                Chargement...

</div>


<!-- =====================================================

===================================================== -->

<header>

    <a
        href="admin.html"
        class="admin-gear"
        title="Administration"
        aria-label="Administration"
    >
        ⚙
    </a>


    <a href="index.html" class="logo">

        <span class="logo-a">A</span>vant-gard<span class="logo-e">E</span>

    </a>


    <nav>

        <a href="index.html">

        </a>

        <a href="manifeste.html">

        <a href="projet.html">

        <a href="inspirations.html">

        </a>

        <a href="equipe.html">

        </a>

    </nav>

</header>


<!-- =====================================================

===================================================== -->

<main id="accueilContent">

    <div class="events-empty">
        Chargement...
    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    © 2026 Avant-gardE
    — Liberté · Souveraineté · Patrie · Justice

</footer>


<!-- =====================================================
     MODALE RENDEZ-VOUS
===================================================== -->

<div
    id="rdvModal"
    class="rdv-modal"
>

    <div class="rdv-modal-box">

        <button
            id="rdvModalClose"
            class="rdv-modal-close"
            aria-label="Fermer"
        >
            ×
        </button>

        <div class="rdv-modal-kicker">
            NOS RENDEZ-VOUS
        </div>

        <div
            id="rdvModalTitle"
            class="rdv-modal-title"
        >
        </div>

        <div class="rdv-modal-info">

            <span id="rdvModalDate"></span>

            <span id="rdvModalTime"></span>

            <span id="rdvModalLocation"></span>

        </div>

        <div
            id="rdvModalDescription"
            class="rdv-modal-description"
        >
        </div>

        <a
            id="rdvModalLink"
            class="rdv-modal-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            style="display:none;"
        >
            EN SAVOIR PLUS →
        </a>

    </div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://wlhtegrciehmtxqecopv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_eBPx2UZFdHbLzxSgoBor-Q_FJobVvjs";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let rendezVous = [];

let tickerAnimation = null;


/* =====================================================
   CHARGEMENT DU CONTENU CENTRAL
===================================================== */

async function chargerAccueil() {

    const container =
        document.getElementById(
            "accueilContent"
        );

    try {

        const response =
            await fetch(
                "accueil.html"
            );

        if(!response.ok){

            throw new Error(
                "Impossible de charger accueil.html"
            );

        }

        const html =
            await response.text();

        const parser =
            new DOMParser();

        const documentAccueil =
            parser.parseFromString(
                html,
                "text/html"
            );


        /* =========================
           STYLES DU CONTENU CENTRAL
        ========================= */

        documentAccueil
            .querySelectorAll("style")
            .forEach(
                style => {

                    document.head.appendChild(
                        document.importNode(
                            style,
                            true
                        )
                    );

                }
            );


        /* =========================
           CONTENU CENTRAL
        ========================= */

        const contenu =
            documentAccueil
                .querySelector(
                    "#accueil-page"
                );

        if(!contenu){

            throw new Error(
                "Contenu #accueil-page introuvable dans accueil.html"
            );

        }

        container.innerHTML =
            contenu.innerHTML;


        /* =========================
           SCRIPTS
        ========================= */

        documentAccueil
            .querySelectorAll(
                "script"
            )
            .forEach(
                ancienScript => {

                    const nouveauScript =
                        document.createElement(
                            "script"
                        );

                    if(
                        ancienScript.src
                    ){

                        nouveauScript.src =
                            ancienScript.src;

                    }else{

                        nouveauScript.textContent =
                            ancienScript.textContent;

                    }

                    document.body.appendChild(
                        nouveauScript
                    );

                }
            );


    }catch(error){

        console.error(
            "Erreur chargement accueil :",
            error
        );

        container.innerHTML = `
            <div
                class="events-empty"
                style="
                    min-height:300px;
                    justify-content:center;
                "
            >
                Impossible de charger la page d'accueil.
            </div>
        `;

    }

}


/* =====================================================
   CHARGEMENT DES RENDEZ-VOUS
===================================================== */

async function chargerRendezVous() {

    const track =
        document.getElementById(
            "eventsTrack"
        );


    const {
        data,
        error
    } = await supabaseClient

        .from("rendezvous")

        .select("*")

        .eq("actif", true)

        .order(
            "date_evenement",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        track.innerHTML = `
            <div class="events-empty">
                Aucun rendez-vous actuellement.
            </div>
        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        track.innerHTML = `
            <div class="events-empty">
                Aucun rendez-vous actuellement.
            </div>
        `;

        return;
    }


    rendezVous = data;

    track.innerHTML = "";


    data.forEach(
        (rdv) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "event";

            element.dataset.id =
                rdv.id;


            const date =
                formaterDateCourte(
                    rdv.date_evenement
                );


            let contenu = "";


            if (date) {

                contenu +=
                    `<strong>${escapeHtml(date)}</strong>`;

            }


            if (rdv.titre) {

                if (contenu) {

                    contenu +=
                        `<span class="event-separator">—</span>`;

                }

                contenu +=
                    `<strong>${escapeHtml(rdv.titre)}</strong>`;

            }


            if (rdv.lieu) {

                contenu +=
                    `<span class="event-separator">—</span>`;

                contenu +=
                    escapeHtml(rdv.lieu);

            }


            element.innerHTML =
                contenu;


            element.addEventListener(
                "click",
                function() {

                    ouvrirRendezVous(
                        rdv
                    );

                }
            );


            track.appendChild(
                element
            );

        }
    );


    demarrerDefilement();

}


/* =====================================================
   DÉFILEMENT
===================================================== */

function demarrerDefilement() {

    const track =
        document.getElementById(
            "eventsTrack"
        );

    const windowElement =
        document.querySelector(
            ".events-window"
        );


    if (!track || !windowElement) {
        return;
    }


    if (tickerAnimation) {

        cancelAnimationFrame(
            tickerAnimation
        );

        tickerAnimation = null;

    }


    const largeurContenu =
        track.scrollWidth;

    const largeurFenetre =
        windowElement.clientWidth;


    if (!largeurContenu) {
        return;
    }


    const vitesse = 180;


    let position =
        largeurFenetre;

    let dernierTemps =
        performance.now();


    track.style.transform =
        `translateX(${position}px)`;


    function animation(
        temps
    ) {

        const delta =
            (temps - dernierTemps) /
            1000;


        dernierTemps =
            temps;


        position -=
            vitesse * delta;


        if (
            position <=
            -largeurContenu
        ) {

            position =
                largeurFenetre;

        }


        track.style.transform =
            `translateX(${position}px)`;


        tickerAnimation =
            requestAnimationFrame(
                animation
            );

    }


    tickerAnimation =
        requestAnimationFrame(
            animation
        );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formaterDateCourte(
    dateString
) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleDateString(
        "fr-FR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* =====================================================
   MODALE
===================================================== */

function ouvrirRendezVous(
    rdv
) {

    const modal =
        document.getElementById(
            "rdvModal"
        );

    const title =
        document.getElementById(
            "rdvModalTitle"
        );

    const date =
        document.getElementById(
            "rdvModalDate"
        );

    const time =
        document.getElementById(
            "rdvModalTime"
        );

    const location =
        document.getElementById(
            "rdvModalLocation"
        );

    const description =
        document.getElementById(
            "rdvModalDescription"
        );

    const link =
        document.getElementById(
            "rdvModalLink"
        );


    title.textContent =
        rdv.titre ||
        "Rendez-vous";


    if (
        rdv.date_evenement
    ) {

        const dateLongue =
            new Date(
                rdv.date_evenement +
                "T00:00:00"
            ).toLocaleDateString(
                "fr-FR",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );


        date.textContent =
            dateLongue;

        date.style.display =
            "inline-block";

    } else {

        date.style.display =
            "none";

    }


    if (rdv.heure) {

        time.textContent =
            "Heure : " +
            rdv.heure;

        time.style.display =
            "inline-block";

    } else {

        time.style.display =
            "none";

    }


    if (rdv.lieu) {

        location.textContent =
            "Lieu : " +
            rdv.lieu;

        location.style.display =
            "inline-block";

    } else {

        location.style.display =
            "none";

    }


    description.textContent =
        rdv.description ||
        rdv.texte ||
        "Aucune description disponible.";


    if (rdv.lien) {

        link.href =
            rdv.lien;

        link.style.display =
            "inline-block";

    } else {

        link.style.display =
            "none";

    }


    modal.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   FERMER MODALE
===================================================== */

function fermerRendezVous() {

    const modal =
        document.getElementById(
            "rdvModal"
        );


    modal.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}


document
    .getElementById(
        "rdvModalClose"
    )
    .addEventListener(
        "click",
        fermerRendezVous
    );


document
    .getElementById(
        "rdvModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                fermerRendezVous();

            }

        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            fermerRendezVous();

        }

    }
);


/* =====================================================
   PROTECTION HTML
===================================================== */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   DÉMARRAGE
===================================================== */

chargerAccueil();

chargerRendezVous();


/* =====================================================
   REDIMENSIONNEMENT
===================================================== */

window.addEventListener(
    "resize",
    function() {

        demarrerDefilement();

    }
);


</script>


</body>
