  <script>
  (() => {
    const root = document.getElementById("home-experience");
    if (!root) return;
    const content = document.getElementById("quiz-content");
    const label = document.getElementById("quiz-step-label");
    const progress = [...document.querySelectorAll("#quiz-progress span")];
    const back = document.getElementById("quiz-back");
    const next = document.getElementById("quiz-next");
    const closeQuiz = document.getElementById("quiz-close");
    const reopenQuiz = document.getElementById("quiz-reopen");
    const field = document.getElementById("aiQuestion");
    closeQuiz.addEventListener("click",()=>root.classList.add("quiz-is-closed"));
    reopenQuiz.addEventListener("click",()=>root.classList.remove("quiz-is-closed"));
    setTimeout(()=>root.classList.remove("quiz-logo-first"),4000);
    const answers = {patrie:null, souverainete:null, justice:null, liberte:2, parti:null};
    let step = 0;

    const questions = [
      {key:"patrie", title:"Quelle identité defendre?", hint:"Choisissez la conception qui se rapproche le plus de la vôtre.", options:[
        ["UNIVERSELLE","La France est une terre d’accueil, de liberté et de diversité. L'identité? un habitant du Monde!"],
        ["EUROPÉENNE","Une identité française, inscrite dans un projet européen commun, pour un avenir construit avec les autres nations européennes."],
        ["NATIONALE","\"Une unique identité\", commune et harmonisée : c'est l'identité nationale française. Point. Tel que la célèbre citation nous l'a appris : \"Nos ancêtres les Gaulois!\". L’État doit fixer les normes de la société, selon un modèle civilisationnel et conservateur."],
        ["RÉGIONALE","Un Corse n'est pas un Breton, un Alsacien n'est pas un Basque, un Savoyard n'est pas un Martiniquais... Ce sont \"les identités\" françaises, la vraie diversité qui fait la France! Les régions doivent pouvoir être libres de faire vivre leurs traditions, leur culture et leur patrimoine. Le rôle de l'Etat n'est ni de choisir, ni d'harmoniser. La Nation alors? c'est le cadre commun qui doit garantir cette liberté!"]
      ]},
      {key:"souverainete", title:"La place de la France dans l’UE ?", hint:"Deux visions du pouvoir de décision de la France.", options:[
        ["CONTINUER AVEC L’UE","Négocier au sein de l’Union européenne pour défendre les intérêts français et tenter d’orienter les décisions et le fonctionnement de l’UE. La participation à l’UE : parfois perdre, parfois gagner."],
        ["ROMPRE AVEC L’UE","Sortir de l’Union européenne pour reprendre immédiatement notre souveraineté et notre pouvoir de décision. Gagner sans concession."]
      ]},
      {key:"justice", title:"Le rétablissement de la peine de mort ?", hint:"Choisissez la position qui correspond le mieux à votre opinion.", options:[
        ["POUR","Elle doit absolument être rétablie."],
        ["TOLÉRABLE","Elle est à envisager pour les crimes les plus monstrueux."],
        ["CONTRE","Personne ne doit être privé de sa vie : la société doit porter ce fardeau."]
      ]},
      {key:"liberte", title:"Votre rapport à l’État", hint:"(Économie, Fiscalité & Social)", slider:true},
      {key:"parti", title:"Qui soutenez-vous ?", hint:"Choisissez le parti dont vous vous sentez le plus proche aujourd’hui.", parties:true, options:[
        ["Rassemblement national","RN"],["La France insoumise","LFI"],["Les Républicains","LR"],["Renaissance / Ensemble","RE"],["Parti socialiste","PS"],["Les Écologistes","Écologistes"],["Reconquête !","Reconquête"],["Debout la France","DLF"],["Union populaire républicaine","UPR"],["Nouvelle Énergie","Nouvelle Énergie"],["Avant-gardE","Avant-gardE"],["Aucun / autre","Aucun / autre"]
      ]}
    ];
    const liberty = [
      ["ANTICAPITALISTE","Dirigisme économique<br>Fiscalité plus confiscatoire<br>Redistribution massive"],
      ["SOCIAL-UNIVERSALISTE","Fort interventionnisme économique<br>Pression fiscale renforcée<br>Redistribution renforcée"],
      ["SOCIAL-NATIONALISTE","Fort interventionnisme économique<br>Pression fiscale maintenue mais ajustée<br>Redistribution renforcée, mais réservée aux détenteurs de la nationalité française."],
      ["LIBÉRAL REFORMISTE","Interventionnisme économique limité et ciblé<br>Réduction de la pression fiscale<br>Réforme du modèle social, sans diminution ni extension de la redistribution<br>Optimisation des coûts de gestion"],
      ["LIBÉRAL RADICAL","Fin de l’interventionnisme économique<br>Réduction drastique de la pression fiscale<br>Refonte intégrale du modèle social français<br>Rupture totale avec le système existant"]
    ];

    function escapeHtml(value){return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function render(){
      const q = questions[step];
      label.textContent = "ÉTAPE " + String(step+1).padStart(2,"0") + " / 05";
      progress.forEach((el,i)=>el.classList.toggle("active",i<=step));
      back.disabled = step===0;
      next.textContent = step===4 ? "Analyser mes choix ↗" : "Continuer →";
      next.disabled = q.slider ? false : !answers[q.key];
      let html = '<h2 class="quiz-question">'+q.title+'</h2>'+(q.hint?'<p class="quiz-hint">'+q.hint+'</p>':'');
      if(q.slider){
        const val = answers.liberte;
        html += '<input class="quiz-range" id="liberte-range" type="range" min="0" max="4" step="1" value="'+val+'" aria-label="Votre rapport à l’État, à l’économie, à la fiscalité et au social"><div class="quiz-range-labels"><span><b>+</b> d’État</span><span><b>+</b> de Liberté</span></div><div class="quiz-range-current"><strong>'+liberty[val][0]+'</strong><p>'+liberty[val][1]+'</p></div>';
      } else {
        html += '<div class="'+(q.parties?'quiz-parties':'quiz-options')+'">';
        q.options.forEach((option,i)=>{
          const value = q.parties ? option[1] : option[0];
          const title = q.parties ? option[0] : option[0];
          const description = q.parties ? "" : option[1];
          const selected = answers[q.key]===value;
          html += '<button type="button" class="quiz-option" data-answer="'+escapeHtml(value)+'" aria-pressed="'+selected+'"><span class="quiz-option-mark">'+(selected?'✓':(q.parties?'↗':String.fromCharCode(65+i)))+'</span><span class="quiz-option-copy"><strong>'+escapeHtml(title)+'</strong>'+(description?'<span>'+escapeHtml(description)+'</span>':'')+'</span></button>';
        });
        html += '</div>';
      }
      content.innerHTML = html;
      content.querySelectorAll("[data-answer]").forEach(button=>button.addEventListener("click",()=>{
        answers[q.key]=button.dataset.answer;
        render();
      }));
      const range = content.querySelector("#liberte-range");
      if(range) range.addEventListener("input",()=>{
        answers.liberte=Number(range.value);
        const current=content.querySelector(".quiz-range-current");
        current.innerHTML='<strong>'+liberty[answers.liberte][0]+'</strong><p>'+liberty[answers.liberte][1]+'</p>';
      });
      next.disabled = q.slider ? false : !answers[q.key];
    }
    function buildAnalysisPrompt(){
      const p = questions[0].options.find(o=>o[0]===answers.patrie);
      const s = questions[1].options.find(o=>o[0]===answers.souverainete);
      const j = questions[2].options.find(o=>o[0]===answers.justice);
      const l = liberty[answers.liberte];
      const party = questions[4].options.find(o=>o[1]===answers.parti);
      return "Agis comme un analyste politique rigoureux et présente une comparaison courte, claire et chiffrée. Évalue la compatibilité entre les quatre premières réponses du visiteur et le parti qu’il a sélectionné à la cinquième question. Appuie-toi d’abord sur les programmes et déclarations officiels les plus récents, en citant les sources consultées. Pour Avant-gardE, utilise en priorité https://avantgarde-france.github.io/ et ses pages de programme et de manifeste. N’invente aucune position : indique « information insuffisante » lorsqu’un point n’est pas documenté et ne pénalise pas artificiellement ce manque. Distingue les faits vérifiés de ton interprétation.\n\nMÉTHODE DE NOTATION OBLIGATOIRE\n- Évalue séparément les 4 thèmes : identité, souveraineté face à l’UE, peine de mort, économie/liberté.\n- Attribue à chacun une note de compatibilité de 0 à 5 : 0 = opposition nette documentée ; 1 = désaccord majeur ; 2 = compatibilité faible ou mixte ; 3 = accord partiel ; 4 = accord fort ; 5 = accord très fort. Justifie chaque note en une phrase et cite les sources.\n- Additionne les quatre notes pour obtenir une note finale sur 20. Précise qu’il s’agit d’une estimation argumentée, pas d’une mesure scientifique.\n- Compte aussi le nombre de thèmes en accord : un thème compte comme « en accord » à partir de 3/5. Présente explicitement « X réponses sur 4 en accord » et « Y/20 ». Si une position est inconnue, signale-le et donne une note prudente ou une fourchette plutôt que de fabriquer une certitude.\n\nCOMPARAISON DES PARTIS\n1. Évalue d’abord le parti choisi par le visiteur : "+party[0]+".\n2. Compare ensuite les mêmes quatre réponses à Avant-gardE et aux autres partis français pertinents figurant dans la liste du questionnaire. Vérifie leurs positions officielles avant de les noter ; ne prétends pas avoir évalué exhaustivement un parti si les sources manquent.\n3. Indique le parti le plus compatible avec les réponses, avec son nombre de thèmes en accord et sa note sur 20. Si Avant-gardE obtient une note supérieure au parti choisi, nomme-le explicitement comme alternative potentiellement plus proche et explique brièvement pourquoi. Si le parti choisi reste le meilleur, dis-le aussi. En cas d’égalité ou de données insuffisantes, précise-le.\n4. Termine par une conclusion directe qui explique les convergences et les écarts documentés avec Avant-gardE, sans fausse précision ni contradiction artificielle.\n\nRÉPONSES DU VISITEUR\nIdentité : "+p[0]+" — "+p[1]+"\nSouveraineté face à l’UE : "+s[0]+" — "+s[1]+"\nPeine de mort : "+j[0]+" — "+j[1]+"\nLiberté économique : "+l[0]+" — "+l[1]+"\nParti sélectionné : "+party[0];
    }
    back.addEventListener("click",()=>{if(step>0){step--;render();}});
    next.addEventListener("click",()=>{
      if(step<4){step++;render();return;}
      field.value=buildAnalysisPrompt();
      field.dispatchEvent(new Event("input",{bubbles:true}));
      document.querySelector(".quiz-free").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
      const status=document.getElementById("aiStatus");
      status.textContent="Votre analyse est prête. ChatGPT va s’ouvrir avec vos réponses et les consignes d’analyse.";
      window.envoyerVersIA?.("chatgpt");
    });
    root.querySelectorAll("[data-question]").forEach(button=>button.addEventListener("click",()=>{
      field.value=button.dataset.question||"";
      field.focus();
      field.dispatchEvent(new Event("input",{bubbles:true}));
    }));
    field.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();window.envoyerVersIA?.("chatgpt");}});
    field.addEventListener("input",()=>{field.style.height="auto";field.style.height=Math.min(field.scrollHeight,180)+"px";});
    render();
  })();
  </script>
</body>
</html>
