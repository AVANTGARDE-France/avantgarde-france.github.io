<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Découvrez les propositions et orientations du projet politique d’Avant-gardE.">
<meta name="robots" content="noindex, follow"><link rel="canonical" href="https://avantgarde-france.github.io/projet.html">
<title>Notre projet — Avant-gardE</title><link rel="stylesheet" href="css/style.css?v=sticky-compact-20261106">
<meta name="theme-color" content="#07152d"><link rel="icon" href="/favicon.ico?v=4" sizes="any">
<style>
.project-page{max-width:1580px;margin:auto;padding:38px 28px 76px}.project-heading{text-align:center;margin:0 auto 28px}.project-heading h1{font-size:clamp(32px,4vw,48px);font-weight:400;margin:0}.project-heading p{color:var(--muted);font:14px/1.6 Arial,sans-serif;margin:10px auto}
.project-toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:24px;border:1px solid rgba(214,173,85,.55);border-radius:18px;background:linear-gradient(110deg,#0d2344,#07152d);box-shadow:0 8px 28px #0003}
.project-toolbar-label{font:700 11px Arial,sans-serif;letter-spacing:1.2px;color:var(--gold-light);white-space:nowrap}.project-filters{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
.project-filter{border:1px solid rgba(214,173,85,.4);background:transparent;color:white;border-radius:999px;padding:9px 15px;font:12px Arial,sans-serif;cursor:pointer}.project-filter:hover,.project-filter.active{background:linear-gradient(135deg,#f2d17d,#c89537);color:#07152d}
.project-sort{display:flex;align-items:center;gap:10px;border-left:1px solid #d6ad5555;padding-left:16px}.project-sort select{background:#07152d;color:white;border:1px solid var(--gold);border-radius:999px;padding:9px 13px;font:12px Arial,sans-serif}
.project-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}.project-card{position:relative;isolation:isolate;display:flex;flex-direction:column;min-width:0;aspect-ratio:2/3;overflow:hidden;border:2px solid #c99b45;border-radius:15px;background:#0d2344;box-shadow:0 7px 22px #0005;cursor:pointer;transition:.22s}.project-card:hover{transform:translateY(-5px);box-shadow:0 14px 30px #0008;border-color:#ffe09a}
.project-card-image{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#030d1d99,transparent 35%,#030d1d18 58%,#030d1dcc),linear-gradient(135deg,#193d65,#07152d);background-size:cover;background-position:center}.project-card:before{content:"";position:absolute;inset:4px;z-index:-1;border:1px solid #ffe091a6;border-radius:10px;pointer-events:none}
.project-card-top{display:flex;justify-content:center;align-items:center;position:relative;padding:12px 58px 0 12px;min-height:78px}.project-card-title{margin:0;color:#ffe09a;text-align:center;font:700 clamp(17px,1.45vw,24px)/1.12 Georgia,serif;text-shadow:0 2px 5px #000,0 0 12px #000}
.project-priority{position:absolute;right:0;top:0;min-width:58px;padding:8px 6px 10px;text-align:center;color:#fff2d5;background:linear-gradient(145deg,#9b6425,#432b17);border-left:1px solid #f4d184;border-bottom:1px solid #f4d184;border-radius:0 10px 0 13px;font:700 9px Arial,sans-serif;text-transform:uppercase}.project-priority strong{display:block;font:700 13px Georgia,serif;margin-top:3px;color:#ffe09a}
.project-card-center{display:flex;flex:1;align-items:center;justify-content:center;padding:8px 15px;text-align:center}.project-card-tagline{max-width:95%;margin:0;color:white;text-shadow:0 2px 5px #000,0 0 10px #000;font:italic 600 clamp(12px,1.1vw,16px)/1.3 Georgia,serif}
.project-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px 9px}.project-stat{min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 3px;border:1px solid #f0d58acc;border-radius:10px;background:#030d1dbb;color:white;font:700 10px Arial,sans-serif}.project-stat img{width:22px;height:22px;object-fit:contain}.project-stat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px}
.project-synergies{min-height:34px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:7px 8px;background:#051226f2;border-top:1px solid #f0d58acc;color:#ffe09a;text-align:center;font:600 10px/1.3 Arial,sans-serif}
.project-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(2,8,19,.82);backdrop-filter:blur(7px)}.project-modal.open{display:flex}.project-modal-panel{position:relative;width:min(900px,100%);max-height:88vh;overflow:auto;padding:34px 38px;background:#0d2344;border:1px solid #d6ad55;border-radius:16px;box-shadow:0 20px 70px #0009;color:#f5f3ed}.project-modal-close{position:sticky;top:0;float:right;border:1px solid #d6ad55;border-radius:50%;width:36px;height:36px;background:#07152d;color:#f0d58a;font-size:22px;cursor:pointer}.project-modal h2{color:#f0d58a;text-align:center;font:700 30px Georgia,serif;margin:8px 44px 24px}.project-modal-content{font:15px/1.8 Arial,sans-serif}.project-modal-content img{max-width:100%;height:auto}@media(max-width:620px){.project-modal{padding:10px}.project-modal-panel{padding:24px 18px}.project-modal h2{font-size:24px}}
.project-empty,.project-loading,.project-error{grid-column:1/-1;padding:36px 18px;text-align:center;color:var(--muted);font:14px Arial,sans-serif;border:1px dashed #d6ad5555;border-radius:12px}
@media(max-width:1250px){.project-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}}@media(max-width:900px){.project-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.project-sort{border:0;padding:0}}
@media(max-width:620px){.project-page{padding:30px 13px 55px}.project-toolbar{padding:11px;border-radius:13px}.project-toolbar-label{font-size:10px}.project-filters{gap:6px}.project-filter{padding:8px 11px;font-size:11px}.project-sort{width:100%;justify-content:space-between}.project-sort select{flex:1}.project-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.project-card-top{min-height:62px;padding:10px 44px 0 8px}.project-priority{min-width:46px;padding:6px 4px 8px;font-size:8px}.project-priority strong{font-size:11px}.project-card-title{font-size:clamp(14px,4vw,19px)}.project-card-tagline{font-size:12px}.project-stats{gap:4px;padding:0 6px 7px}.project-stat{min-height:36px;font-size:9px}.project-stat img{width:17px;height:17px}.project-stat-name{font-size:8px}.project-synergies{font-size:8px;min-height:30px;padding:6px 4px}}

/* Cartes recto-verso */
.project-card{perspective:1200px;transform-style:preserve-3d;overflow:visible;border:0;background:transparent;box-shadow:none}
.project-card:hover{transform:translateY(-4px);box-shadow:none}
.project-card.is-flipped,.project-card.is-flipped:hover{transform:rotateY(180deg)}
.project-card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.75,.25,1);border:2px solid #c99b45;border-radius:15px;background:#0d2344;box-shadow:0 7px 22px #0005}
.project-card.is-flipped .project-card-inner{transform:rotateY(180deg)}
.project-card-face{position:absolute;inset:0;overflow:hidden;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.project-card-front{display:flex;flex-direction:column;isolation:isolate;background:#0d2344}
.project-card-back{transform:rotateY(180deg);display:flex;flex-direction:column;padding:22px 17px 16px;background:radial-gradient(ellipse at top,#173b63,#07152d 75%);border:5px solid #c99b45;color:#f5f3ed}
.project-card-back h2{margin:12px 0 15px;color:#ffe09a;text-align:center;font:700 21px/1.2 Georgia,serif}
.project-back-hint,.project-back-return{text-align:center;color:#f0d58a;font:700 9px Arial,sans-serif;letter-spacing:1.2px}
.project-back-content{flex:1;overflow:auto;font:12px/1.6 Arial,sans-serif;scrollbar-width:thin;scrollbar-color:#c99b45 #07152d}
.project-back-content img{max-width:100%;height:auto}
.project-back-return{padding-top:12px}
.project-stats{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:nowrap;min-height:0}
.project-stat{flex:0 1 auto;max-width:33%;justify-content:center}
.project-synergies:empty{display:none}
@media(max-width:620px){.project-card-inner{border-radius:12px}.project-card-face{border-radius:10px}.project-card-back{padding:15px 10px 12px;border-width:4px}.project-card-back h2{font-size:16px;margin:8px 0 10px}.project-back-content{font-size:10px}.project-back-hint,.project-back-return{font-size:8px}.project-stats{gap:4px}}
@media(prefers-reduced-motion:reduce){.project-card-inner{transition:none}}

</style></head><body>
<div id="site-header"></div>
<main class="project-page">
<header class="project-heading"><div class="section-kicker">AVANT-GARDE</div><h1>Notre projet</h1><div class="project-line"></div><p>Nos propositions et orientations, présentées en cartes.</p></header>
<section class="project-toolbar" aria-label="Filtres et tri"><span class="project-toolbar-label">FILTRER PAR</span><div id="projectFilters" class="project-filters"><button type="button" class="project-filter active" data-filter="all">Tout</button></div><div class="project-sort"><label class="project-toolbar-label" for="projectSort">TRIER PAR</label><select id="projectSort"><option value="position">Ordre du projet</option><option value="priority">Priorité</option><option value="title">Ordre alphabétique</option></select></div></section>
<section id="projectGrid" class="project-grid" aria-live="polite"><div class="project-loading">Chargement des contenus…</div></section>
<div id="projectModal" class="project-modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle"><div class="project-modal-panel"><button id="projectModalClose" class="project-modal-close" type="button" aria-label="Fermer">×</button><h2 id="projectModalTitle"></h2><div id="projectModalContent" class="project-modal-content"></div></div></div>
</main><div id="site-footer"></div><div id="site-rdv-modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/supabase.js"></script><script type="module" src="js/components.js"></script>
<script type="module">
import {supabase} from "./js/supabase.js";
const grid=document.getElementById("projectGrid"),filters=document.getElementById("projectFilters"),sort=document.getElementById("projectSort");
let menus=[],subs=[],items=[],stats=[],active="all";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ids(v){if(Array.isArray(v))return v.map(x=>typeof x==="object"?(x.id||x.uuid||x.content_id):x).filter(Boolean).map(String);if(typeof v==="string"){try{return ids(JSON.parse(v))}catch{return v.replace(/[{}"]/g,"").split(",").map(x=>x.trim()).filter(Boolean)}}if(v&&Array.isArray(v.synergies))return ids(v.synergies);return []}
function parent(item){const sub=subs.find(x=>String(x.id)===String(item.sous_menu_id));return menus.find(x=>sub&&String(x.id)===String(sub.menu_id))}
function priority(v){return ({prioritaire:"Prioritaire",secondaire:"Secondaire",tertiaire:"Tertiaire"})[String(v||"").toLowerCase()]||v||"—"}
function stat(id){if(!id)return "";const s=stats.find(x=>String(x.id)===String(id));if(!s)return "";const image=s.image_url||s.photo_url||s.icone_url||s.image||s.icone||"";return '<span class="project-stat">'+(image?'<img src="'+esc(image)+'" alt="">':'<span>◆</span>')+'<span class="project-stat-name">'+esc(s.nom||s.titre||"Stat")+'</span></span>'}
function card(x){const photo=x.photo_url?'background-image:linear-gradient(180deg,#030d1d88,transparent 40%,#030d1dcc),url('+JSON.stringify(x.photo_url)+');':'';const sy=ids(x.synergies).map(id=>items.find(y=>String(y.id)===id)).filter(Boolean).map(y=>y.titre);const statMarkup=[stat(x.stat_1),stat(x.stat_2),stat(x.stat_3)].filter(Boolean).join('');return '<article class="project-card" tabindex="0" role="button" aria-label="Retourner la carte : '+esc(x.titre)+'" aria-pressed="false" data-id="'+esc(x.id)+'"><div class="project-card-inner"><div class="project-card-face project-card-front"><div class="project-card-image" style="'+photo+'"></div><div class="project-card-top"><h2 class="project-card-title">'+esc(x.titre)+'</h2><div class="project-priority">Priorité<strong>'+esc(priority(x.priorite))+'</strong></div></div><div class="project-card-center"><p class="project-card-tagline">'+esc(x.accroche||"")+'</p></div><div class="project-stats">'+statMarkup+'</div><footer class="project-synergies">'+(sy.length?'Synergies : '+sy.map(esc).join(' · '):'')+'</footer></div><div class="project-card-face project-card-back"><span class="project-back-hint">AVANT-GARDE · NOTRE PROJET</span><h2>'+esc(x.titre)+'</h2><div class="project-back-content">'+(x.html||'<p>Le contenu détaillé sera prochainement disponible.</p>')+'</div><span class="project-back-return">Cliquer pour retourner</span></div></div></article>'}
function renderFilters(){filters.innerHTML='<button type="button" class="project-filter '+(active==="all"?"active":"")+'" data-filter="all">Tout</button>'+menus.map(m=>'<button type="button" class="project-filter '+(active===String(m.id)?"active":"")+'" data-filter="'+esc(m.id)+'">'+esc(m.titre)+'</button>').join("")}
function render(){let list=items.filter(x=>active==="all"||String((parent(x)||{}).id)===String(active));if(sort.value==="title")list.sort((a,b)=>String(a.titre).localeCompare(String(b.titre),"fr"));else if(sort.value==="priority"){const rank={prioritaire:0,secondaire:1,tertiaire:2};list.sort((a,b)=>(rank[String(a.priorite).toLowerCase()]??3)-(rank[String(b.priorite).toLowerCase()]??3)||(a.position||0)-(b.position||0))}else list.sort((a,b)=>(a.position||0)-(b.position||0));grid.innerHTML=list.length?list.map(card).join(""):'<div class="project-empty">Aucun contenu dans ce filtre pour le moment.</div>'}
filters.addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;active=b.dataset.filter;renderFilters();render()});sort.addEventListener("change",render);
function flipCard(c){c.classList.toggle("is-flipped");c.setAttribute("aria-pressed",c.classList.contains("is-flipped")?"true":"false")}
grid.addEventListener("click",e=>{const c=e.target.closest(".project-card");if(c)flipCard(c)});
const modal=document.getElementById("projectModal"),modalTitle=document.getElementById("projectModalTitle"),modalContent=document.getElementById("projectModalContent");
function closeProjectModal(){modal.classList.remove("open");document.body.style.overflow=""}
document.getElementById("projectModalClose")?.addEventListener("click",closeProjectModal);
modal?.addEventListener("click",e=>{if(e.target===modal)closeProjectModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeProjectModal()});
window.addEventListener("avantgarde:project-card-open",e=>{if(!modal)return;modalTitle.textContent=e.detail.titre||"";modalContent.innerHTML=e.detail.html||"<p>Le contenu détaillé sera prochainement disponible.</p>";modal.classList.add("open");document.body.style.overflow="hidden"});

grid.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("project-card")){e.preventDefault();flipCard(e.target)}});
async function load(){try{const [m,s,c,st]=await Promise.all([supabase.from("menus").select("*").eq("valide",true).order("position"),supabase.from("sous_menus").select("*").eq("valide",true).order("position"),supabase.from("contenus").select("*").eq("valide",true).order("position"),supabase.from("stats").select("*").order("nom")]);for(const r of [m,s,c,st])if(r.error)throw r.error;menus=m.data||[];subs=s.data||[];items=c.data||[];stats=st.data||[];renderFilters();render()}catch(e){console.error("Erreur chargement projet",e);grid.innerHTML='<div class="project-error">Impossible de charger les contenus du projet.</div>'}}
load();
</script></body></html>
