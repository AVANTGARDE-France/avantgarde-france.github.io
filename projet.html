<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Avant-gardE — Notre projet</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =====================================================
           AVANT-GARDE — PAGE PROJET
        ====================================================== */

        .project-page {
            max-width: 1200px;
            margin: auto;
            padding: 55px 25px 70px;
        }


        /* =====================================================
           EN-TÊTE DE PAGE
        ====================================================== */

        .project-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .project-header h1 {
            margin: 0 0 15px;
            font-size: clamp(34px, 5vw, 52px);
            font-weight: normal;
        }

        .project-header p {
            max-width: 720px;
            margin: auto;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.7;
        }

        .project-line {
            width: 80px;
            height: 2px;
            margin: 22px auto;
            background: var(--gold);
        }


        /* =====================================================
           STRUCTURE PRINCIPALE
        ====================================================== */

        .project-layout {
            display: grid;
            grid-template-columns: 290px minmax(0, 1fr);
            gap: 35px;
            align-items: start;
        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        .project-navigation {
            position: sticky;
            top: 25px;

            border: 1px solid rgba(214,173,85,.25);

            background:
                rgba(13,35,68,.32);
        }

        .project-navigation-title {
            padding: 17px 20px;

            border-bottom:
                1px solid rgba(214,173,85,.25);

            color: var(--gold-light);

            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .project-tree {
            padding: 10px 0 12px;
        }


        /* =====================================================
           MENU
        ====================================================== */

        .project-menu {
            border-bottom:
                1px solid rgba(214,173,85,.10);
        }

        .project-menu:last-child {
            border-bottom: 0;
        }

        .project-menu-title {
            display: block;

            width: 100%;

            padding: 14px 18px;

            border: 0;

            background: transparent;

            color: var(--white);

            text-align: left;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;
            font-weight: normal;

            cursor: default;
        }


        /* =====================================================
           SOUS-MENUS
        ====================================================== */

        .project-submenus {
            padding: 0 10px 10px 20px;
        }

        .project-submenu {
            margin-bottom: 12px;
        }

        .project-submenu:last-child {
            margin-bottom: 0;
        }

        .project-submenu-title {
            margin-bottom: 4px;

            color: var(--gold);

            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }


        /* =====================================================
           CONTENUS
        ====================================================== */

        .project-content-list {
            display: flex;
            flex-direction: column;
        }

        .project-content-button {
            display: block;

            width: 100%;

            padding: 7px 10px;

            border: 0;

            background: transparent;

            color: #aeb7c5;

            text-align: left;

            font-family: Arial, sans-serif;
            font-size: 12px;

            line-height: 1.4;

            cursor: pointer;

            transition:
                color .2s,
                background .2s;
        }

        .project-content-button:hover {
            background:
                rgba(214,173,85,.05);

            color: var(--white);
        }

        .project-content-button.active {
            background:
                rgba(214,173,85,.08);

            color: var(--gold-light);
        }


        /* =====================================================
           LECTEUR
        ====================================================== */

        .project-reader {
            min-width: 0;

            padding: 42px 45px;

            border:
                1px solid rgba(214,173,85,.25);

            background:
                linear-gradient(
                    145deg,
                    rgba(13,35,68,.55),
                    rgba(5,15,32,.72)
                );
        }

        .project-reader-kicker {
            margin-bottom: 12px;

            color: var(--gold);

            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2.5px;
        }

        .project-reader h2 {
            margin: 0 0 25px;

            color: var(--white);

            font-size:
                clamp(
                    28px,
                    4vw,
                    40px
                );

            font-weight: normal;
            line-height: 1.15;
        }

        .project-reader-line {
            width: 65px;
            height: 2px;

            margin-bottom: 30px;

            background: var(--gold);
        }


        /* =====================================================
           CONTENU HTML DU CMS
        ====================================================== */

        .project-content {
            color: #d0d5dd;

            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.8;

            overflow-wrap: break-word;
        }

        .project-content h1,
        .project-content h2,
        .project-content h3,
        .project-content h4 {
            color: var(--white);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-weight: normal;
            line-height: 1.25;
        }

        .project-content h1 {
            font-size: 32px;
        }

        .project-content h2 {
            margin-top: 35px;
            font-size: 27px;
        }

        .project-content h3 {
            margin-top: 30px;
            font-size: 22px;
        }

        .project-content h4 {
            margin-top: 25px;
            font-size: 18px;
        }

        .project-content p {
            margin: 0 0 20px;
        }

        .project-content strong {
            color: var(--white);
        }

        .project-content em {
            color: #dce1e8;
        }

        .project-content a {
            color: var(--gold-light);
        }

        .project-content ul,
        .project-content ol {
            margin: 0 0 22px;
            padding-left: 25px;
        }

        .project-content li {
            margin-bottom: 7px;
        }

        .project-content blockquote {
            margin: 28px 0;
            padding: 15px 20px;

            border-left:
                2px solid var(--gold);

            background:
                rgba(214,173,85,.05);

            color: #c4ccd7;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;
            font-style: italic;
        }

        .project-content hr {
            margin: 35px 0;

            border: 0;

            border-top:
                1px solid rgba(214,173,85,.25);
        }

        .project-content img {
            display: block;

            max-width: 100%;
            height: auto;

            margin: 25px auto;

            border:
                1px solid rgba(214,173,85,.2);
        }

        .project-content video {
            display: block;

            max-width: 100%;

            margin: 25px auto;
        }


        /* =====================================================
           ÉTATS
        ====================================================== */

        .project-loading,
        .project-empty,
        .project-error {
            padding: 45px 25px;

            text-align: center;

            color: var(--muted);

            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.6;
        }

        .project-error {
            color: #d99b9b;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 850px) {

            .project-layout {
                grid-template-columns: 1fr;
            }

            .project-navigation {
                position: static;
            }

            .project-reader {
                padding: 35px 28px;
            }

        }


        @media (max-width: 520px) {

            .project-page {
                padding: 40px 15px 55px;
            }

            .project-reader {
                padding: 28px 20px;
            }

            .project-reader h2 {
                font-size: 28px;
            }

            .project-content {
                font-size: 14px;
                line-height: 1.7;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div id="site-header"></div>


    <!-- =====================================================
         CONTENU PRINCIPAL
    ====================================================== -->

    <main class="project-page">


        <!-- =================================================
             EN-TÊTE
        ================================================== -->

        <section class="project-header">

            <div class="section-kicker">
                AVANT-GARDE
            </div>

            <h1>
                Notre projet
            </h1>

            <div class="project-line"></div>

            <p>
                Découvrez les propositions et orientations
                d'Avant-gardE à travers notre projet politique.
            </p>

        </section>


        <!-- =================================================
             LECTEUR
        ================================================== -->

        <div class="project-layout">


            <!-- =============================================
                 NAVIGATION DU PROJET
            ============================================== -->

            <aside class="project-navigation">

                <div class="project-navigation-title">
                    NOTRE PROJET
                </div>

                <div
                    id="projectTree"
                    class="project-tree"
                >

                    <div class="project-loading">
                        Chargement...
                    </div>

                </div>

            </aside>


            <!-- =============================================
                 ZONE DE LECTURE
            ============================================== -->

            <article
                id="projectReader"
                class="project-reader"
            >

                <div class="project-loading">
                    Chargement du projet...
                </div>

            </article>


        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="site-footer"></div>


    <!-- =====================================================
         MODALE RENDEZ-VOUS
    ====================================================== -->

    <div id="site-rdv-modal"></div>


    <!-- =====================================================
         SUPABASE CDN
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        type="module"
        src="js/supabase.js"
    ></script>


    <!-- =====================================================
         COMPOSANTS COMMUNS
    ====================================================== -->

    <script
        type="module"
        src="js/components.js"
    ></script>


    <!-- =====================================================
         LECTEUR DU PROJET
    ====================================================== -->

    <script type="module">

        import {
            supabase
        } from "./js/supabase.js";


        /* =================================================
           DONNÉES
        ================================================= */

        let menus = [];
        let sousMenus = [];
        let contenus = [];


        /* =================================================
           RÉFÉRENCES DOM
        ================================================= */

        const tree =
            document.getElementById(
                "projectTree"
            );

        const reader =
            document.getElementById(
                "projectReader"
            );


        /* =================================================
           CHARGEMENT DES DONNÉES
        ================================================= */

        async function chargerProjet() {

            try {

                /*
                 * Les trois requêtes ne récupèrent
                 * que les éléments validés.
                 */

                const [
                    menusResult,
                    sousMenusResult,
                    contenusResult
                ] = await Promise.all([

                    supabase
                        .from("menus")
                        .select("*")
                        .eq("valide", true)
                        .order(
                            "position",
                            {
                                ascending: true
                            }
                        ),

                    supabase
                        .from("sous_menus")
                        .select("*")
                        .eq("valide", true)
                        .order(
                            "position",
                            {
                                ascending: true
                            }
                        ),

                    supabase
                        .from("contenus")
                        .select("*")
                        .eq("valide", true)
                        .order(
                            "position",
                            {
                                ascending: true
                            }
                        )

                ]);


                if (menusResult.error) {
                    throw menusResult.error;
                }

                if (sousMenusResult.error) {
                    throw sousMenusResult.error;
                }

                if (contenusResult.error) {
                    throw contenusResult.error;
                }


                menus =
                    menusResult.data || [];

                sousMenus =
                    sousMenusResult.data || [];

                contenus =
                    contenusResult.data || [];


                construireArbre();


            } catch (error) {

                console.error(
                    "Erreur chargement projet :",
                    error
                );


                tree.innerHTML = `
                    <div class="project-error">
                        Impossible de charger le projet.
                    </div>
                `;


                reader.innerHTML = `
                    <div class="project-error">
                        Une erreur est survenue lors du
                        chargement du projet.
                    </div>
                `;

            }

        }


        /* =================================================
           CONSTRUCTION DE L'ARBRE PUBLIC
        ================================================= */

        function construireArbre() {

            tree.innerHTML = "";


            /*
             * Aucun menu validé.
             */

            if (!menus.length) {

                afficherAucunContenu();

                return;
            }


            let premierContenu = null;


            /*
             * On parcourt uniquement les menus validés.
             */

            menus.forEach(
                menu => {

                    /*
                     * Sous-menus dont le menu parent
                     * est celui-ci.
                     *
                     * La liste "sousMenus" contient déjà
                     * uniquement les sous-menus validés.
                     */

                    const menuSousMenus =
                        sousMenus.filter(
                            sousMenu =>
                                sousMenu.menu_id ===
                                menu.id
                        );


                    /*
                     * On ne conserve que les sous-menus
                     * qui possèdent au moins un contenu
                     * validé.
                     */

                    const sousMenusVisibles =
                        menuSousMenus.filter(
                            sousMenu =>
                                contenus.some(
                                    contenu =>
                                        contenu.sous_menu_id ===
                                        sousMenu.id
                                )
                        );


                    /*
                     * Un menu vide n'est pas affiché.
                     */

                    if (
                        !sousMenusVisibles.length
                    ) {

                        return;
                    }


                    const menuElement =
                        document.createElement(
                            "section"
                        );

                    menuElement.className =
                        "project-menu";


                    const menuTitle =
                        document.createElement(
                            "div"
                        );

                    menuTitle.className =
                        "project-menu-title";

                    menuTitle.textContent =
                        menu.titre;


                    menuElement.appendChild(
                        menuTitle
                    );


                    const submenusElement =
                        document.createElement(
                            "div"
                        );

                    submenusElement.className =
                        "project-submenus";


                    sousMenusVisibles.forEach(
                        sousMenu => {

                            /*
                             * Seuls les contenus validés
                             * ayant ce sous-menu comme parent
                             * sont affichés.
                             */

                            const sousMenuContenus =
                                contenus.filter(
                                    contenu =>
                                        contenu.sous_menu_id ===
                                        sousMenu.id
                                );


                            if (
                                !sousMenuContenus.length
                            ) {

                                return;
                            }


                            const sousMenuElement =
                                document.createElement(
                                    "div"
                                );

                            sousMenuElement.className =
                                "project-submenu";


                            const sousMenuTitle =
                                document.createElement(
                                    "div"
                                );

                            sousMenuTitle.className =
                                "project-submenu-title";

                            sousMenuTitle.textContent =
                                sousMenu.titre;


                            const contentList =
                                document.createElement(
                                    "div"
                                );

                            contentList.className =
                                "project-content-list";


                            sousMenuContenus.forEach(
                                contenu => {

                                    const button =
                                        document.createElement(
                                            "button"
                                        );

                                    button.type =
                                        "button";

                                    button.className =
                                        "project-content-button";

                                    button.textContent =
                                        contenu.titre;


                                    button.addEventListener(
                                        "click",
                                        () => {

                                            afficherContenu(
                                                contenu,
                                                menu,
                                                sousMenu,
                                                button
                                            );

                                        }
                                    );


                                    contentList.appendChild(
                                        button
                                    );


                                    /*
                                     * Premier contenu
                                     * disponible.
                                     */

                                    if (
                                        !premierContenu
                                    ) {

                                        premierContenu = {
                                            contenu,
                                            menu,
                                            sousMenu,
                                            button
                                        };

                                    }

                                }
                            );


                            sousMenuElement.appendChild(
                                sousMenuTitle
                            );

                            sousMenuElement.appendChild(
                                contentList
                            );

                            submenusElement.appendChild(
                                sousMenuElement
                            );

                        }
                    );


                    menuElement.appendChild(
                        submenusElement
                    );


                    tree.appendChild(
                        menuElement
                    );

                }
            );


            /*
             * Aucun contenu réellement visible.
             */

            if (
                !tree.children.length ||
                !premierContenu
            ) {

                afficherAucunContenu();

                return;
            }


            /*
             * Affiche automatiquement
             * le premier contenu.
             */

            afficherContenu(
                premierContenu.contenu,
                premierContenu.menu,
                premierContenu.sousMenu,
                premierContenu.button
            );

        }


        /* =================================================
           AFFICHAGE ABSENCE DE CONTENU
        ================================================= */

        function afficherAucunContenu() {

            tree.innerHTML = `
                <div class="project-empty">
                    Aucun contenu disponible.
                </div>
            `;


            reader.innerHTML = `
                <div class="project-empty">
                    Le projet sera prochainement disponible.
                </div>
            `;

        }


        /* =================================================
           AFFICHAGE D'UN CONTENU
        ================================================= */

        function afficherContenu(
            contenu,
            menu,
            sousMenu,
            bouton
        ) {

            /*
             * Retire l'état actif de tous les boutons.
             */

            document
                .querySelectorAll(
                    ".project-content-button.active"
                )
                .forEach(
                    element => {

                        element.classList.remove(
                            "active"
                        );

                    }
                );


            /*
             * Active le bouton sélectionné.
             */

            if (bouton) {

                bouton.classList.add(
                    "active"
                );

            }


            /*
             * Réinitialise le lecteur.
             */

            reader.innerHTML = "";


            /*
             * Kicker.
             */

            const kicker =
                document.createElement(
                    "div"
                );

            kicker.className =
                "project-reader-kicker";

            kicker.textContent =
                `${menu.titre} · ${sousMenu.titre}`;


            /*
             * Titre.
             */

            const title =
                document.createElement(
                    "h2"
                );

            title.textContent =
                contenu.titre;


            /*
             * Ligne décorative.
             */

            const line =
                document.createElement(
                    "div"
                );

            line.className =
                "project-reader-line";


            /*
             * Contenu HTML provenant du CMS.
             */

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "project-content";

            content.innerHTML =
                contenu.html || "";


            /*
             * Assemblage.
             */

            reader.appendChild(
                kicker
            );

            reader.appendChild(
                title
            );

            reader.appendChild(
                line
            );

            reader.appendChild(
                content
            );


            /*
             * Sur mobile, le lecteur devient
             * la zone immédiatement visible.
             */

            if (
                window.innerWidth <= 850
            ) {

                reader.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }

        }


        /* =================================================
           INITIALISATION
        ================================================= */

        chargerProjet();

    </script>

</body>

</html>
