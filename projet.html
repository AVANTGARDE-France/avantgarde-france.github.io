<section class="project-toolbar" aria-label="Recherche, filtres et tri"><label class="project-search-wrap" aria-label="Rechercher une carte par son titre"><span class="project-search-icon" aria-hidden="true">⌕</span><input id="projectSearch" class="project-search" type="search" placeholder="Rechercher une carte…" autocomplete="off" spellcheck="false"></label><span class="project-toolbar-label">FILTRER PAR</span><div id="projectFilters" class="project-filters"><button type="button" class="project-filter active" data-filter="all">Tout</button></div><div class="project-vote-filter" id="projectVoteFilterWrap" hidden><label class="project-toolbar-label" for="projectVoteFilter">ÉVALUATION</label><select id="projectVoteFilter" aria-label="Filtrer par évaluation" title="Filtrer par évaluation"><option value="all" aria-label="Toutes les évaluations" title="Toutes">☷</option><option value="positive" aria-label="Évaluation favorable" title="Favorable">👍</option><option value="neutral" aria-label="Évaluation neutre" title="Neutre">✋🏻</option><option value="negative" aria-label="Évaluation défavorable" title="Défavorable">👎</option><option value="unrated" aria-label="À évaluer" title="À évaluer">📝</option></select></div><div class="project-sort"><label class="project-toolbar-label" for="projectSort">TRIER PAR</label><select id="projectSort"><option value="position">Ordre du projet</option><option value="priority">Priorité</option><option value="title">Ordre alphabétique</option><option value="popularity">Popularité</option></select></div></section>
<section id="projectGrid" class="project-grid" aria-live="polite"><div class="project-loading">Chargement des contenus…</div></section>
<div id="projectModal" class="project-modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle"><div class="project-modal-panel"><button id="projectModalClose" class="project-modal-close" type="button" aria-label="Fermer">×</button><div class="project-modal-card" id="projectModalCard"><div class="project-modal-card-inner"><div class="project-modal-face project-modal-front" id="projectModalFront"></div><div class="project-modal-face project-modal-back"><div id="projectVotePanel" class="project-vote-panel"></div><h2 id="projectModalTitle"></h2><div id="projectModalContent" class="project-modal-content"></div></div></div></div></div></div>
</main><div id="site-footer"></div><div id="site-rdv-modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/supabase.js"></script><script type="module" src="js/components.js?v=public-return-flow-20261106-1"></script>
<script type="module">
import {supabase} from "./js/supabase.js";
const grid=document.getElementById("projectGrid"),filters=document.getElementById("projectFilters"),sort=document.getElementById("projectSort"),search=document.getElementById("projectSearch"),voteFilter=document.getElementById("projectVoteFilter"),voteFilterWrap=document.getElementById("projectVoteFilterWrap");
let menus=[],subs=[],items=[],stats=[],active="all",searchTerm="",currentUser=null,voteStats=new Map(),myVotes=new Map();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ids(v){if(Array.isArray(v))return v.map(x=>typeof x==="object"?(x.id||x.uuid||x.content_id):x).filter(Boolean).map(String);if(typeof v==="string"){try{return ids(JSON.parse(v))}catch{return v.replace(/[{}"]/g,"").split(",").map(x=>x.trim()).filter(Boolean)}}if(v&&Array.isArray(v.synergies))return ids(v.synergies);return []}
function parent(item){const sub=subs.find(x=>String(x.id)===String(item.sous_menu_id));return menus.find(x=>sub&&String(x.id)===String(sub.menu_id))}
function priority(v){return ({prioritaire:"Prioritaire",secondaire:"Secondaire",tertiaire:"Tertiaire"})[String(v||"").toLowerCase()]||v||"—"}
function stat(id){if(!id)return "";const s=stats.find(x=>String(x.id)===String(id));if(!s)return "";const image=s.image_url||s.photo_url||s.icone_url||s.image||s.icone||"";return '<span class="project-stat">'+(image?'<img src="'+esc(image)+'" alt="">':'<span>◆</span>')+'<span class="project-stat-name">'+esc(s.nom||s.titre||"Stat")+'</span></span>'}
function voteIcon(v){return v===1?'<span class="project-card-my-vote positive" title="Votre note : favorable"><span class="vote-symbol positive-symbol">👍</span></span>':v===0?'<span class="project-card-my-vote neutral" title="Votre note : neutre">✋🏻</span>':v===-1?'<span class="project-card-my-vote negative" title="Votre note : défavorable"><span class="vote-symbol negative-symbol">👎</span></span>':""}
function popularity(id){return voteStats.get(String(id))||{pouces_positifs:0,pouces_negatifs:0,votes_neutres:0,votes_exprimes:0,popularite:null}}
function ratingMarkup(item){const s=popularity(item.id);const pct=s.popularite===null?"—":s.popularite+" %";const details="👍 "+s.pouces_positifs+" · ✋🏻 "+s.votes_neutres+" · 👎 "+s.pouces_negatifs;return '<div class="project-card-rating" title="'+details+'" aria-label="Popularité : '+pct+'. Avis : '+s.pouces_positifs+' favorables, '+s.votes_neutres+' neutres, '+s.pouces_negatifs+' défavorables"><strong><span class="project-popularity-star" aria-hidden="true">★</span></strong> '+pct+(currentUser?voteIcon(myVotes.get(String(item.id))):"")+'</div>'}
function card(x){const photo=x.photo_url?'<img class="project-card-image" src="'+esc(x.photo_url)+'" alt="" aria-hidden="true" loading="lazy" decoding="async" referrerpolicy="no-referrer">':'';const sy=ids(x.synergies).map(id=>items.find(y=>String(y.id)===id)).filter(Boolean).map(y=>y.titre);const statMarkup=[stat(x.stat_1),stat(x.stat_2),stat(x.stat_3)].filter(Boolean).join('');return '<article class="project-card" tabindex="0" role="button" aria-label="Ouvrir la carte : '+esc(x.titre)+'" data-id="'+esc(x.id)+'"><div class="project-card-image-wrap" aria-hidden="true">'+photo+'</div><div class="project-card-top">'+ratingMarkup(x)+'<h2 class="project-card-title">'+esc(x.titre)+'</h2><div class="project-priority"><strong>'+esc(priority(x.priorite))+'</strong></div></div><div class="project-card-center"><p class="project-card-tagline">'+esc(x.accroche||"")+'</p></div><div class="project-stats">'+statMarkup+'</div><footer class="project-synergies">'+(sy.length?'Synergies : '+sy.map(esc).join(' · '):'')+'</footer></article>'}
function renderFilters(){filters.innerHTML='<button type="button" class="project-filter '+(active==="all"?"active":"")+'" data-filter="all">Tout</button>'+menus.map(m=>'<button type="button" class="project-filter '+(active===String(m.id)?"active":"")+'" data-filter="'+esc(m.id)+'">'+esc(m.titre)+'</button>').join("")}
function normalizeTitle(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("fr").trim()}
function render(){let list=items.filter(x=>{const own=myVotes.get(String(x.id));const voteOk=!currentUser||!voteFilter||voteFilter.value==="all"||(voteFilter.value==="unrated"?own===undefined:voteFilter.value==="positive"?own===1:voteFilter.value==="neutral"?own===0:own===-1);return (active==="all"||String((parent(x)||{}).id)===String(active))&&(!searchTerm||normalizeTitle(x.titre).includes(normalizeTitle(searchTerm)))&&voteOk});if(sort.value==="title")list.sort((a,b)=>String(a.titre).localeCompare(String(b.titre),"fr"));else if(sort.value==="priority"){const rank={absolue:0,prioritaire:1,secondaire:2,tertiaire:3};list.sort((a,b)=>(rank[String(a.priorite).toLowerCase()]??4)-(rank[String(b.priorite).toLowerCase()]??4)||(a.position||0)-(b.position||0))}else if(sort.value==="popularity")list.sort((a,b)=>{const sa=popularity(a.id),sb=popularity(b.id);return (sb.popularite??-1)-(sa.popularite??-1)||sb.pouces_positifs-sa.pouces_positifs||(a.position||0)-(b.position||0)});else list.sort((a,b)=>(a.position||0)-(b.position||0));grid.innerHTML=list.length?list.map(card).join(""):'<div class="project-empty">Aucune carte ne correspond à votre recherche ou à ce filtre.</div>'}
filters.addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;active=b.dataset.filter;renderFilters();render()});search.addEventListener("input",()=>{searchTerm=search.value;render()});sort.addEventListener("change",render);voteFilter?.addEventListener("change",render);
const modal=document.getElementById("projectModal"),modalTitle=document.getElementById("projectModalTitle"),modalContent=document.getElementById("projectModalContent"),votePanel=document.getElementById("projectVotePanel");
function voteControls(item){const value=myVotes.get(String(item.id));return '<div class="project-vote-message" aria-live="polite"></div><button type="button" class="project-vote-button positive '+(value===1?"selected":"")+'" data-vote="1" aria-label="Pouce vers le haut" aria-pressed="'+(value===1)+'"><span class="vote-symbol positive-symbol">👍</span></button><button type="button" class="project-vote-button neutral '+(value===0?"selected":"")+'" data-vote="0" aria-label="Note neutre" aria-pressed="'+(value===0)+'">✋🏻</button><button type="button" class="project-vote-button negative '+(value===-1?"selected":"")+'" data-vote="-1" aria-label="Pouce vers le bas" aria-pressed="'+(value===-1)+'"><span class="vote-symbol negative-symbol">👎</span></button>'}
function openProjectCard(c){const item=items.find(x=>String(x.id)===c.dataset.id);if(!item||!modal)return;const front=document.getElementById("projectModalFront"),card=document.querySelector("#projectModalCard .project-modal-card-inner");front.innerHTML=c.innerHTML;front.querySelector(".project-card-image")?.setAttribute("aria-hidden","true");modalTitle.textContent=item.titre||"";modalContent.dataset.itemId=String(item.id);modalContent.innerHTML=item.html||"<p>Ce contenu ne comporte pas encore de verso.</p>";votePanel.innerHTML=voteControls(item);card.classList.remove("is-flipped");modal.classList.add("open");document.body.style.overflow="hidden";requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add("is-flipped")));document.getElementById("projectModalClose")?.focus()}
function closeProjectModal(){modal?.classList.remove("open");document.body.style.overflow=""}
grid.addEventListener("click",e=>{const c=e.target.closest(".project-card");if(c)openProjectCard(c)});
votePanel?.addEventListener("click",async e=>{const b=e.target.closest("[data-vote]");if(!b)return;const msg=votePanel.querySelector(".project-vote-message");if(!currentUser){if(msg)msg.textContent="Vote impossible — vous devez être connecté.";return}const value=Number(b.dataset.vote);const contenuId=modalContent.dataset.itemId||document.querySelector("#projectModalFront .project-card")?.dataset.id;if(!contenuId)return;const currentValue=myVotes.get(String(contenuId));const removing=currentValue===value;b.disabled=true;if(msg)msg.textContent=removing?"Retrait de votre évaluation…":"Enregistrement de votre note…";const result=removing?await supabase.from("contenus_votes").delete().eq("user_id",currentUser.id).eq("contenu_id",contenuId):await supabase.from("contenus_votes").upsert({user_id:currentUser.id,contenu_id:contenuId,vote:value,updated_at:new Date().toISOString()},{onConflict:"user_id,contenu_id"});b.disabled=false;if(result.error){console.error("Erreur vote proposition",result.error);if(msg)msg.textContent="Impossible de modifier votre note. Réessayez.";return}if(removing)myVotes.delete(String(contenuId));else myVotes.set(String(contenuId),value);await loadVoteData();render();const updated=items.find(x=>String(x.id)===String(contenuId));if(updated){votePanel.innerHTML=voteControls(updated);const freshCard=grid.querySelector('[data-id="'+CSS.escape(String(contenuId))+'"]');if(freshCard)document.getElementById("projectModalFront").innerHTML=freshCard.innerHTML}});
document.getElementById("projectModalClose")?.addEventListener("click",closeProjectModal);
modal?.addEventListener("click",e=>{if(e.target===modal)closeProjectModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeProjectModal()});
grid.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("project-card")){e.preventDefault();openProjectCard(e.target)}});
async function loadVoteData(){const statsResult=await supabase.from("contenus_vote_stats").select("*");if(statsResult.error)throw statsResult.error;voteStats=new Map((statsResult.data||[]).map(x=>[String(x.contenu_id),x]));myVotes=new Map();if(currentUser){const own=await supabase.from("contenus_votes").select("contenu_id,vote").eq("user_id",currentUser.id);if(own.error)throw own.error;for(const v of own.data||[])myVotes.set(String(v.contenu_id),Number(v.vote))}}
async function load(){try{const auth=await supabase.auth.getSession().catch(e=>({data:{session:null},error:e}));currentUser=auth?.data?.session?.user||null;const [m,s,c,st]=await Promise.all([supabase.from("menus").select("*").eq("valide",true).order("position"),supabase.from("sous_menus").select("*").eq("valide",true).order("position"),supabase.from("contenus").select("*").eq("valide",true).order("position"),supabase.from("stats").select("*").order("nom")]);for(const r of [m,s,c,st])if(r.error)throw r.error;menus=m.data||[];subs=s.data||[];items=c.data||[];stats=st.data||[];if(voteFilterWrap)voteFilterWrap.hidden=!currentUser;renderFilters();render();try{await loadVoteData()}catch(voteError){console.warn("Statistiques/notes indisponibles : les cartes restent accessibles.",voteError);voteStats=new Map();myVotes=new Map()}render()}catch(e){console.error("Erreur chargement contenus publics du projet",e);grid.innerHTML='<div class="project-error">Impossible de charger les contenus du projet. Réessayez dans quelques instants.</div>'}}
load();
</script></body></html>
