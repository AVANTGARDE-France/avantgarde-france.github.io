<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Avant-gardE — Gestion du contenu</title>

  <style>
    :root {
      --navy: #07152d;
      --navy2: #0d2344;
      --gold: #d6ad55;
      --gold-light: #f0d58a;
      --white: #f5f3ed;
      --blue-france: #0055A4;
      --red: #EF4135;
      --border: rgba(214, 173, 85, .28);
      --muted: rgba(245, 243, 237, .62);
      --danger: #d9534f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       STRUCTURE
    ========================================================= */

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* =========================================================
       BANDEAU VERTICAL
    ========================================================= */

    .sidebar {
      width: 240px;
      flex: 0 0 240px;
      min-height: 100vh;
      background: #050f20;
      border-right: 1px solid var(--border);
      padding: 28px 18px;
    }

    .brand {
      margin: 0 0 36px;
      padding: 0 12px;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .brand span:first-child {
      color: var(--blue-france);
    }

    .brand span:last-child {
      color: var(--red);
    }

    .sidebar-title {
      padding: 0 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--white);
      text-align: left;
      padding: 12px;
      margin-bottom: 4px;
      border-radius: 4px;
    }

    .nav-button:hover,
    .nav-button.active {
      background: var(--navy2);
      border-color: var(--border);
      color: var(--gold-light);
    }

    /* =========================================================
       CONTENU PRINCIPAL
    ========================================================= */

    .main {
      flex: 1;
      min-width: 0;
      padding: 36px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 29px;
      font-weight: 600;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================================================
       BOUTONS
    ========================================================= */

    .btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--white);
      padding: 9px 14px;
      border-radius: 4px;
      transition: .15s ease;
    }

    .btn:hover {
      background: var(--navy2);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .btn-primary {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      color: var(--navy);
    }

    .btn-danger:hover {
      border-color: var(--danger);
      color: #ff8b86;
    }

    /* =========================================================
       ARBORESCENCE
    ========================================================= */

    .tree {
      max-width: 1100px;
    }

    .tree-section {
      margin-bottom: 18px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      border: 1px solid var(--border);
      background: rgba(13, 35, 68, .55);
      padding: 7px 10px;
      border-radius: 4px;
    }

    .tree-row.menu {
      background: var(--navy2);
    }

    .tree-row.submenu {
      margin-left: 32px;
      background: rgba(13, 35, 68, .38);
    }

    .tree-row.content {
      margin-left: 64px;
      background: rgba(13, 35, 68, .20);
    }

    .tree-title {
      flex: 1;
      min-width: 0;
    }

    .tree-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-kind {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    /* =========================================================
       CONTROLES
    ========================================================= */

    .tree-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(214, 173, 85, .18);
      background: transparent;
      color: var(--white);
      border-radius: 3px;
      font-size: 16px;
      line-height: 1;
    }

    .icon-button:hover {
      background: var(--navy);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .delete-button:hover {
      border-color: var(--danger);
      color: #ff8b86;
    }

    .status {
      min-width: 92px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--gold-light);
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }

    .status.draft {
      color: var(--muted);
      border-color: rgba(245, 243, 237, .20);
    }

    /* =========================================================
       AJOUT
    ========================================================= */

    .add-area {
      margin: 28px 0 50px 32px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* =========================================================
       EDITEUR
    ========================================================= */

    .editor-panel {
      display: none;
      max-width: 1100px;
      margin-top: 36px;
      border-top: 1px solid var(--border);
      padding-top: 28px;
    }

    .editor-panel.visible {
      display: block;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .editor-header h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--gold-light);
      font-size: 12px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #050f20;
      color: var(--white);
      border-radius: 4px;
      padding: 11px 12px;
      outline: none;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--gold);
    }

    .field textarea {
      min-height: 300px;
      resize: vertical;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px;
      background: #050f20;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
    }

    .editor-toolbar button {
      min-width: 36px;
      height: 34px;
      border: 1px solid rgba(214, 173, 85, .20);
      background: transparent;
      color: var(--white);
      border-radius: 3px;
    }

    .editor-toolbar button:hover {
      background: var(--navy2);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .wysiwyg {
      min-height: 420px;
      padding: 24px;
      background: var(--white);
      color: #171717;
      border: 1px solid var(--border);
      border-radius: 0 0 4px 4px;
      outline: none;
      line-height: 1.65;
    }

    .wysiwyg:focus {
      border-color: var(--gold);
    }

    .wysiwyg img {
      max-width: 100%;
      height: auto;
    }

    .editor-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .72);
      z-index: 100;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal {
      width: min(520px, 100%);
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 25px;
    }

    .modal h2 {
      margin: 0 0 20px;
      font-size: 20px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 800px) {
      .sidebar {
        width: 190px;
        flex-basis: 190px;
      }

      .main {
        padding: 24px 18px;
      }

      .tree-row.submenu {
        margin-left: 18px;
      }

      .tree-row.content {
        margin-left: 36px;
      }

      .status {
        min-width: auto;
      }
    }

    @media (max-width: 620px) {
      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 15px;
      }

      .brand {
        margin-bottom: 15px;
      }

      .sidebar-nav {
        display: flex;
        gap: 5px;
        overflow-x: auto;
      }

      .nav-button {
        width: auto;
        white-space: nowrap;
      }

      .main {
        padding: 20px 12px;
      }

      .tree-row {
        flex-wrap: wrap;
      }

      .tree-title {
        min-width: calc(100% - 50px);
      }

      .tree-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .add-area {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <div class="layout">

    <!-- =======================================================
         NAVIGATION
    ======================================================== -->

    <aside class="sidebar">

      <div class="brand">
        Avant-gard<span>e</span>
      </div>

      <div class="sidebar-title">
        Administration
      </div>

      <nav class="sidebar-nav">

        <button
          type="button"
          class="nav-button"
          onclick="window.location.href='admin.html'"
        >
          Tableau de bord
        </button>

        <button
          type="button"
          class="nav-button active"
        >
          Contenu
        </button>

      </nav>

    </aside>


    <!-- =======================================================
         CONTENU
    ======================================================== -->

    <main class="main">

      <header class="page-header">

        <div>
          <h1>Gestion du contenu</h1>

          <p>
            Menus, sous-menus et contenus du site.
          </p>
        </div>

        <button
          type="button"
          class="btn btn-primary"
          onclick="createMenu()"
        >
          + Nouveau menu
        </button>

      </header>


      <!-- =====================================================
           ARBORESCENCE
      ====================================================== -->

      <section
        id="tree"
        class="tree"
      ></section>


      <!-- =====================================================
           EDITEUR
      ====================================================== -->

      <section
        id="editorPanel"
        class="editor-panel"
      >

        <div class="editor-header">

          <h2 id="editorTitle">
            Modifier le contenu
          </h2>

          <button
            type="button"
            class="btn"
            onclick="closeEditor()"
          >
            Fermer
          </button>

        </div>


        <div class="field">

          <label for="contentTitle">
            Titre
          </label>

          <input
            id="contentTitle"
            type="text"
            maxlength="200"
          >

        </div>


        <div class="field">

          <label>
            Contenu
          </label>

          <div class="editor-toolbar">

            <button type="button" onclick="formatText('bold')" title="Gras">
              <strong>B</strong>
            </button>

            <button type="button" onclick="formatText('italic')" title="Italique">
              <em>I</em>
            </button>

            <button type="button" onclick="formatText('underline')" title="Souligné">
              <u>U</u>
            </button>

            <button type="button" onclick="formatText('formatBlock', 'h2')" title="Titre 2">
              H2
            </button>

            <button type="button" onclick="formatText('formatBlock', 'h3')" title="Titre 3">
              H3
            </button>

            <button type="button" onclick="formatText('insertUnorderedList')" title="Liste">
              •
            </button>

            <button type="button" onclick="formatText('insertOrderedList')" title="Liste numérotée">
              1.
            </button>

            <button type="button" onclick="insertLink()" title="Lien">
              🔗
            </button>

            <button type="button" onclick="insertImage()" title="Image">
              🖼
            </button>

            <button type="button" onclick="insertVideo()" title="Vidéo">
              ▶
            </button>

            <button type="button" onclick="formatText('formatBlock', 'blockquote')" title="Citation">
              “
            </button>

            <button type="button" onclick="formatText('insertHorizontalRule')" title="Séparateur">
              ─
            </button>

          </div>


          <div
            id="wysiwyg"
            class="wysiwyg"
            contenteditable="true"
            spellcheck="true"
          >
            Commencez à rédiger votre contenu...
          </div>

        </div>


        <div class="editor-footer">

          <button
            type="button"
            class="btn"
            onclick="closeEditor()"
          >
            Annuler
          </button>

          <button
            type="button"
            class="btn btn-primary"
            onclick="saveEditor()"
          >
            Enregistrer
          </button>

        </div>

      </section>

    </main>

  </div>


  <!-- =========================================================
       MODAL
  ========================================================== -->

  <div
    id="modalBackdrop"
    class="modal-backdrop"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Nouveau menu
      </h2>

      <div class="field">

        <label for="modalInput">
          Titre
        </label>

        <input
          id="modalInput"
          type="text"
          maxlength="200"
        >

      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="btn"
          onclick="closeModal()"
        >
          Annuler
        </button>

        <button
          type="button"
          class="btn btn-primary"
          onclick="confirmModal()"
        >
          Créer
        </button>

      </div>

    </div>

  </div>


  <script>
    /* =========================================================
       DONNÉES TEMPORAIRES
       
       Cette structure sera remplacée par Supabase.
    ========================================================= */

    let data = [
      {
        id: 1,
        type: "menu",
        title: "Notre projet",
        valid: true,
        children: [
          {
            id: 2,
            type: "submenu",
            title: "Économie",
            valid: true,
            children: [
              {
                id: 3,
                type: "content",
                title: "Libérer l'économie",
                valid: true,
                html: "<h2>Libérer l'économie</h2><p>Contenu de démonstration.</p>"
              },
              {
                id: 4,
                type: "content",
                title: "Fiscalité",
                valid: false,
                html: "<p>Contenu en brouillon.</p>"
              }
            ]
          },
          {
            id: 5,
            type: "submenu",
            title: "Souveraineté",
            valid: true,
            children: [
              {
                id: 6,
                type: "content",
                title: "Le Frexit",
                valid: true,
                html: "<p>Contenu de démonstration.</p>"
              }
            ]
          }
        ]
      },
      {
        id: 7,
        type: "menu",
        title: "Nos inspirations",
        valid: true,
        children: [
          {
            id: 8,
            type: "submenu",
            title: "Économistes",
            valid: true,
            children: []
          }
        ]
      }
    ];


    let nextId = 100;

    let modalAction = null;

    let editingContentId = null;


    /* =========================================================
       UTILITAIRES
    ========================================================= */

    function findItem(id, collection = data) {

      for (const item of collection) {

        if (item.id === id) {
          return item;
        }

        if (item.children) {

          const found = findItem(id, item.children);

          if (found) {
            return found;
          }

        }

      }

      return null;
    }


    function findParent(id, collection = data, parent = null) {

      for (const item of collection) {

        if (item.id === id) {
          return parent;
        }

        if (item.children) {

          const found = findParent(
            id,
            item.children,
            item
          );

          if (found !== null) {
            return found;
          }

        }

      }

      return null;
    }


    function getCollection(itemId) {

      const parent = findParent(itemId);

      return parent
        ? parent.children
        : data;

    }


    /* =========================================================
       AFFICHAGE
    ========================================================= */

    function render() {

      const tree = document.getElementById("tree");

      tree.innerHTML = "";

      data.forEach(menu => {

        tree.appendChild(
          renderItem(menu, 0)
        );

      });

    }


    function renderItem(item, level) {

      const section = document.createElement("div");

      section.className = "tree-section";


      const row = document.createElement("div");

      row.className =
        "tree-row " +
        item.type;


      const title = document.createElement("div");

      title.className = "tree-title";

      title.innerHTML =
        "<div class=\"tree-kind\">" +
        getTypeLabel(item.type) +
        "</div>" +
        "<strong>" +
        escapeHtml(item.title) +
        "</strong>";


      row.appendChild(title);


      const actions = document.createElement("div");

      actions.className = "tree-actions";


      const up = createIconButton(
        "↑",
        "Remonter",
        () => moveItem(item.id, -1)
      );

      const down = createIconButton(
        "↓",
        "Descendre",
        () => moveItem(item.id, 1)
      );


      actions.appendChild(up);
      actions.appendChild(down);


      const status = document.createElement("button");

      status.type = "button";

      status.className =
        "status " +
        (item.valid ? "" : "draft");

      status.textContent =
        item.valid
          ? "✓ VALIDÉ"
          : "○ BROUILLON";

      status.title =
        "Changer l'état";

      status.addEventListener(
        "click",
        () => toggleStatus(item.id)
      );

      actions.appendChild(status);


      const edit = createIconButton(
        "✎",
        "Modifier",
        () => editItem(item.id)
      );

      actions.appendChild(edit);


      const deleteButton = createIconButton(
        "×",
        "Supprimer",
        () => deleteItem(item.id)
      );

      deleteButton.classList.add(
        "delete-button"
      );

      actions.appendChild(deleteButton);


      row.appendChild(actions);

      section.appendChild(row);


      if (item.type === "menu") {

        const addSubmenu = document.createElement("div");

        addSubmenu.className = "add-area";

        addSubmenu.innerHTML =
          "<button type=\"button\" class=\"btn\">" +
          "+ Sous-menu" +
          "</button>";

        addSubmenu
          .querySelector("button")
          .addEventListener(
            "click",
            () => createSubmenu(item.id)
          );

        section.appendChild(addSubmenu);

      }


      if (item.type === "submenu") {

        const addContent = document.createElement("div");

        addContent.className = "add-area";

        addContent.innerHTML =
          "<button type=\"button\" class=\"btn\">" +
          "+ Contenu" +
          "</button>";

        addContent
          .querySelector("button")
          .addEventListener(
            "click",
            () => createContent(item.id)
          );

        section.appendChild(addContent);

      }


      if (item.children) {

        item.children.forEach(child => {

          section.appendChild(
            renderItem(child, level + 1)
          );

        });

      }


      return section;
    }


    function createIconButton(
      text,
      title,
      callback
    ) {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "icon-button";

      button.textContent = text;

      button.title = title;

      button.addEventListener(
        "click",
        callback
      );

      return button;
    }


    function getTypeLabel(type) {

      if (type === "menu") {
        return "Menu";
      }

      if (type === "submenu") {
        return "Sous-menu";
      }

      return "Contenu";
    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================================================
       DÉPLACEMENT
    ========================================================= */

    function moveItem(id, direction) {

      const collection =
        getCollection(id);

      const index =
        collection.findIndex(
          item => item.id === id
        );

      if (index === -1) {
        return;
      }

      const newIndex =
        index + direction;

      if (
        newIndex < 0 ||
        newIndex >= collection.length
      ) {
        return;
      }

      [
        collection[index],
        collection[newIndex]
      ] = [
        collection[newIndex],
        collection[index]
      ];

      render();
    }


    /* =========================================================
       ÉTAT
    ========================================================= */

    function toggleStatus(id) {

      const item = findItem(id);

      if (!item) {
        return;
      }

      item.valid = !item.valid;

      render();
    }


    /* =========================================================
       SUPPRESSION
    ========================================================= */

    function deleteItem(id) {

      const item = findItem(id);

      if (!item) {
        return;
      }

      const message =
        item.children &&
        item.children.length
          ? "Cet élément contient des éléments enfants. Les supprimer également ?"
          : "Supprimer cet élément ?";

      if (!confirm(message)) {
        return;
      }

      const collection =
        getCollection(id);

      const index =
        collection.findIndex(
          child => child.id === id
        );

      if (index !== -1) {

        collection.splice(
          index,
          1
        );

      }

      closeEditor();

      render();
    }


    /* =========================================================
       CRÉATION
    ========================================================= */

    function createMenu() {

      openModal(
        "Nouveau menu",
        "menu",
        null
      );

    }


    function createSubmenu(menuId) {

      openModal(
        "Nouveau sous-menu",
        "submenu",
        menuId
      );

    }


    function createContent(submenuId) {

      const item = {
        id: nextId++,
        type: "content",
        title: "Nouveau contenu",
        valid: false,
        html: "<p></p>"
      };

      const submenu =
        findItem(submenuId);

      if (!submenu) {
        return;
      }

      submenu.children.push(item);

      render();

      editItem(item.id);
    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openModal(
      title,
      type,
      parentId
    ) {

      modalAction = {
        type,
        parentId
      };

      document.getElementById(
        "modalTitle"
      ).textContent = title;

      document.getElementById(
        "modalInput"
      ).value = "";

      document.getElementById(
        "modalBackdrop"
      ).classList.add("visible");

      setTimeout(
        () => document
          .getElementById("modalInput")
          .focus(),
        50
      );

    }


    function closeModal() {

      document.getElementById(
        "modalBackdrop"
      ).classList.remove("visible");

      modalAction = null;

    }


    function confirmModal() {

      const input =
        document.getElementById(
          "modalInput"
        );

      const title =
        input.value.trim();

      if (!title) {
        input.focus();
        return;
      }

      if (!modalAction) {
        return;
      }


      if (modalAction.type === "menu") {

        data.push({
          id: nextId++,
          type: "menu",
          title,
          valid: false,
          children: []
        });

      }


      if (
        modalAction.type === "submenu"
      ) {

        const menu =
          findItem(
            modalAction.parentId
          );

        if (menu) {

          menu.children.push({
            id: nextId++,
            type: "submenu",
            title,
            valid: false,
            children: []
          });

        }

      }

      closeModal();

      render();

    }


    /* =========================================================
       ÉDITION
    ========================================================= */

    function editItem(id) {

      const item = findItem(id);

      if (!item) {
        return;
      }


      if (item.type === "content") {

        editingContentId = id;

        document.getElementById(
          "editorTitle"
        ).textContent =
          "Modifier : " + item.title;

        document.getElementById(
          "contentTitle"
        ).value =
          item.title;

        document.getElementById(
          "wysiwyg"
        ).innerHTML =
          item.html || "";

        document.getElementById(
          "editorPanel"
        ).classList.add("visible");

        document.getElementById(
          "editorPanel"
        ).scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

        return;
      }


      openModal(
        "Modifier " +
        getTypeLabel(item.type).toLowerCase(),
        "edit-" + item.type,
        id
      );

      document.getElementById(
        "modalInput"
      ).value = item.title;

    }


    function saveEditor() {

      if (!editingContentId) {
        return;
      }

      const item =
        findItem(editingContentId);

      if (!item) {
        return;
      }

      item.title =
        document
          .getElementById("contentTitle")
          .value
          .trim() ||
        "Sans titre";

      item.html =
        document
          .getElementById("wysiwyg")
          .innerHTML;

      closeEditor();

      render();

    }


    function closeEditor() {

      editingContentId = null;

      document.getElementById(
        "editorPanel"
      ).classList.remove("visible");

    }


    /* =========================================================
       WYSIWYG
    ========================================================= */

    function formatText(
      command,
      value = null
    ) {

      document
        .getElementById("wysiwyg")
        .focus();

      document.execCommand(
        command,
        false,
        value
      );

    }


    function insertLink() {

      const url =
        prompt(
          "URL du lien :"
        );

      if (!url) {
        return;
      }

      formatText(
        "createLink",
        url
      );

    }


    function insertImage() {

      const url =
        prompt(
          "URL de l'image :"
        );

      if (!url) {
        return;
      }

      formatText(
        "insertImage",
        url
      );

    }


    function insertVideo() {

      const url =
        prompt(
          "URL de la vidéo :"
        );

      if (!url) {
        return;
      }

      const html =
        "<p><a href=\"" +
        escapeHtml(url) +
        "\" target=\"_blank\" rel=\"noopener\">" +
        "Voir la vidéo" +
        "</a></p>";

      document
        .getElementById("wysiwyg")
        .focus();

      document.execCommand(
        "insertHTML",
        false,
        html
      );

    }


    /* =========================================================
       MODAL : ÉDITION MENU / SOUS-MENU
    ========================================================= */

    const originalConfirmModal =
      confirmModal;

    confirmModal = function () {

      const input =
        document.getElementById(
          "modalInput"
        );

      const title =
        input.value.trim();

      if (!title) {
        input.focus();
        return;
      }

      if (
        modalAction &&
        (
          modalAction.type ===
          "edit-menu" ||
          modalAction.type ===
          "edit-submenu"
        )
      ) {

        const item =
          findItem(
            modalAction.parentId
          );

        if (item) {
          item.title = title;
        }

        closeModal();

        render();

        return;
      }

      originalConfirmModal();

    };


    /* =========================================================
       INITIALISATION
    ========================================================= */

    render();

  </script>

</body>

</html>
