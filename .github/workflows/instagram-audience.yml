name: Mise à jour audience Instagram

on:
  workflow_dispatch:

  schedule:
    - cron: "00 3 * * *"

jobs:
  update-instagram:
    runs-on: ubuntu-latest

    steps:

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Mise à jour des audiences Instagram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          node <<'EOF'

          const SUPABASE_URL =
            process.env.SUPABASE_URL;

          const SUPABASE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;


          async function supabaseFetch(path, options = {}) {

            const response = await fetch(
              SUPABASE_URL + path,
              {
                ...options,

                headers: {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Content-Type": "application/json",

                  ...(options.headers || {})
                }
              }
            );

            const text =
              await response.text();

            let data = null;

            try {

              data =
                text
                  ? JSON.parse(text)
                  : null;

            } catch {

              data = text;

            }


            if (!response.ok) {

              throw new Error(
                `Supabase ${response.status}: ${text}`
              );

            }

            return data;

          }


          function extraireUsername(url) {

            try {

              const u =
                new URL(url);


              const username =
                u.pathname
                  .split("/")
                  .filter(Boolean)[0];


              if (!username) {

                return null;

              }


              return username
                .replace(/^@/, "")
                .trim();

            } catch {

              return null;

            }

          }


          function nombreValide(nombre) {

            if (
              typeof nombre !== "number" ||
              !Number.isFinite(nombre) ||
              nombre < 0
            ) {

              return null;

            }


            return Math.round(nombre);

          }


          async function recupererProfilInstagram(
            urlInstagram
          ) {

            const url =
              "https://pulse.walls.sh/profile?url=" +
              encodeURIComponent(
                urlInstagram
              );


            console.log(
              "Requête :",
              url
            );


            const response =
              await fetch(
                url,
                {
                  headers: {
                    "Accept":
                      "application/json",

                    "User-Agent":
                      "Avant-Garde-Audience-Bot/1.0"
                  }
                }
              );


            const texte =
              await response.text();


            console.log(
              "HTTP Pulse :",
              response.status
            );


            if (!response.ok) {

              throw new Error(
                `Pulse HTTP ${response.status}: ${texte}`
              );

            }


            let data;

            try {

              data =
                JSON.parse(
                  texte
                );

            } catch {

              throw new Error(
                "Réponse Pulse non JSON."
              );

            }


            return data;

          }


          function recalculerAudienceMax(
            profil
          ) {

            const valeurs = [

              {
                reseau:
                  "Facebook",

                valeur:
                  profil.facebook_audience
              },

              {
                reseau:
                  "Instagram",

                valeur:
                  profil.instagram_audience
              },

              {
                reseau:
                  "X",

                valeur:
                  profil.x_audience
              },

              {
                reseau:
                  "YouTube",

                valeur:
                  profil.youtube_audience
              },

              {
                reseau:
                  "TikTok",

                valeur:
                  profil.tiktok_audience
              }

            ].filter(
              x =>
                typeof x.valeur === "number" &&
                Number.isFinite(x.valeur)
            );


            if (
              valeurs.length === 0
            ) {

              return {
                audience_max:
                  null,

                audience_reseau:
                  null
              };

            }


            valeurs.sort(
              (a, b) =>
                b.valeur -
                a.valeur
            );


            return {

              audience_max:
                valeurs[0].valeur,

              audience_reseau:
                valeurs[0].reseau

            };

          }


          function compteIntrouvable(
            data
          ) {

            if (!data) {

              return true;

            }


            const erreur =
              String(
                data.error ||
                ""
              ).toLowerCase();


            return [
              "content_unavailable",
              "not_found"
            ].includes(
              erreur
            );

          }


          (async () => {

            if (
              !SUPABASE_URL ||
              !SUPABASE_KEY
            ) {

              throw new Error(
                "SUPABASE_URL ou SUPABASE_SERVICE_ROLE_KEY manquant."
              );

            }


            console.log(
              "Récupération des profils..."
            );


            const profils =
              await supabaseFetch(
                "/rest/v1/profiles" +
                "?select=id,nom,instagram_url,facebook_audience,instagram_audience,x_audience,youtube_audience,tiktok_audience" +
                "&instagram_url=not.is.null"
              );


            console.log(
              "Profils Instagram :",
              profils.length
            );


            for (
              const profil
              of profils
            ) {

              console.log("");

              console.log(
                "================================"
              );


              console.log(
                "Profil :",
                profil.nom
              );


              console.log(
                "URL :",
                profil.instagram_url
              );


              const username =
                extraireUsername(
                  profil.instagram_url
                );


              if (!username) {

                console.log(
                  "Username Instagram impossible à déterminer."
                );

                continue;

              }


              console.log(
                "Username Instagram :",
                username
              );


              try {

                const data =
                  await recupererProfilInstagram(
                    profil.instagram_url
                  );


                console.log(
                  "Réponse :",
                  JSON.stringify(
                    data,
                    null,
                    2
                  )
                );


                /*
                 * Compte supprimé / privé / inexistant.
                 *
                 * Dans ce cas on efface l'ancienne
                 * audience afin de ne pas conserver
                 * une valeur d'un compte qui n'existe plus.
                 */

                if (
                  compteIntrouvable(
                    data
                  )
                ) {

                  await supabaseFetch(
                    "/rest/v1/profiles?id=eq." +
                    profil.id,
                    {

                      method:
                        "PATCH",

                      body:
                        JSON.stringify({

                          instagram_audience:
                            null,

                          audience_updated_at:
                            new Date()
                              .toISOString()

                        })

                    }
                  );


                  console.log(
                    "Compte Instagram introuvable : audience supprimée."
                  );


                  continue;

                }


                /*
                 * Instagram peut retourner login_required.
                 *
                 * Dans ce cas le compte existe mais
                 * Pulse ne peut momentanément pas lire
                 * le nombre public.
                 *
                 * On conserve donc l'ancienne valeur.
                 */

                if (
                  data.error ===
                  "login_required"
                ) {

                  console.log(
                    "Instagram demande une connexion : ancienne audience conservée."
                  );


                  continue;

                }


                const audience =
                  nombreValide(
                    data.followers
                  );


                if (
                  audience === null
                ) {

                  console.log(
                    "Audience Instagram non trouvée."
                  );


                  /*
                   * Aucune modification :
                   * on conserve la valeur existante.
                   */

                  continue;

                }


                console.log(
                  "Audience Instagram trouvée :",
                  audience
                );


                /*
                 * Enregistrement de la nouvelle audience.
                 */

                await supabaseFetch(
                  "/rest/v1/profiles?id=eq." +
                  profil.id,
                  {

                    method:
                      "PATCH",

                    body:
                      JSON.stringify({

                        instagram_audience:
                          audience,

                        audience_updated_at:
                          new Date()
                            .toISOString()

                      })

                  }
                );


                console.log(
                  "Audience Instagram enregistrée :",
                  audience
                );


                /*
                 * Relecture des audiences
                 * de tous les réseaux.
                 */

                const profilActualise =
                  await supabaseFetch(
                    "/rest/v1/profiles" +
                    "?select=facebook_audience,instagram_audience,x_audience,youtube_audience,tiktok_audience" +
                    "&id=eq." +
                    profil.id
                  );


                if (
                  profilActualise.length
                ) {

                  const max =
                    recalculerAudienceMax(
                      profilActualise[0]
                    );


                  await supabaseFetch(
                    "/rest/v1/profiles?id=eq." +
                    profil.id,
                    {

                      method:
                        "PATCH",

                      body:
                        JSON.stringify({

                          audience_max:
                            max.audience_max,

                          audience_reseau:
                            max.audience_reseau

                        })

                    }
                  );


                  console.log(
                    "Audience maximale :",
                    max.audience_max,

                    "(" +
                    max.audience_reseau +
                    ")"
                  );

                }

              } catch (error) {

                console.log(
                  "Erreur Instagram :",
                  error.message
                );


                /*
                 * En cas d'erreur technique :
                 * aucune modification de la valeur existante.
                 */

              }

            }


            console.log("");

            console.log(
              "================================"
            );


            console.log(
              "MISE À JOUR INSTAGRAM TERMINÉE"
            );

          })();

          EOF
