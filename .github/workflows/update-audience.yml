name: Mise à jour audiences réseaux

on:
  schedule:

    # 20 passages entre 01h00 et 06h00
    - cron: "2,17,32,47 1-5 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:

# Une seule rotation à la fois.
# On évite ainsi que deux passages travaillent les mêmes profils.
concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:

  update-audience:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22


      # ============================================================
      # UPDATE AUDIENCE
      # ============================================================

      - name: Update audiences
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          node <<'EOF'

          const https = require("https");

          // ============================================================
          // CONFIGURATION
          // ============================================================

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL) {
            throw new Error("SUPABASE_URL manquant");
          }

          if (!SUPABASE_KEY) {
            throw new Error("SUPABASE_SERVICE_ROLE_KEY manquant");
          }

          const PULSE_URL =
            "https://pulse.walls.sh/profile?url=";

          /*
           * LIMITE GLOBALE
           *
           * Maximum théorique :
           * 120 requêtes / minute
           *
           * On prend une marge de sécurité.
           */
          const MAX_CALLS_PER_MINUTE = 120;

          /*
           * Nombre maximum d'URLs traitées par ce lancement.
           *
           * 20 lancements / nuit
           * × 1000 URLs
           * = 20 000 URLs / nuit
           */
          const MAX_URLS_PER_RUN = 1000;

          /*
           * On ne demande pas des milliers de profils inutilement.
           *
           * Il faut suffisamment de candidats pour que la sélection
           * puisse remplir MAX_URLS_PER_RUN.
           */
          const CANDIDATE_PROFILES = 1500;

          /*
           * Pause minimale entre requêtes Pulse.
           *
           * 600 ms ≈ 100 requêtes/minute.
           *
           * Cela reste volontairement sous la limite de 120/min.
           */
          const PULSE_DELAY_MS = 600;

          /*
           * Tentatives en cas d'erreur réseau / HTTP temporaire.
           */
          const MAX_RETRIES = 3;

          /*
           * Timeout d'une requête Pulse.
           */
          const PULSE_TIMEOUT_MS = 15000;

          /*
           * Taille des pages Supabase.
           *
           * 1000 est volontairement raisonnable.
           */
          const SUPABASE_PAGE_SIZE = 1000;


          // ============================================================
          // UTILITAIRES
          // ============================================================

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }


          function normalizeUrl(url) {

            if (!url) return null;

            url = String(url).trim();

            if (!url) return null;

            return url;
          }


          function detectNetwork(url) {

            const value = url.toLowerCase();

            if (
              value.includes("facebook.com") ||
              value.includes("fb.com")
            ) {
              return "facebook";
            }

            if (
              value.includes("instagram.com")
            ) {
              return "instagram";
            }

            if (
              value.includes("twitter.com") ||
              value.includes("x.com")
            ) {
              return "x";
            }

            if (
              value.includes("youtube.com") ||
              value.includes("youtu.be")
            ) {
              return "youtube";
            }

            if (
              value.includes("tiktok.com")
            ) {
              return "tiktok";
            }

            return null;
          }


          function audienceColumn(network) {

            return `${network}_audience`;
          }


          function supabaseRequest(path, options = {}) {

            return new Promise((resolve, reject) => {

              const url =
                new URL(path, SUPABASE_URL);

              const req = https.request(
                url,
                {
                  method: options.method || "GET",

                  headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                  }
                },

                res => {

                  let body = "";

                  res.on("data", chunk => {
                    body += chunk;
                  });

                  res.on("end", () => {

                    let parsed = null;

                    try {
                      parsed = body ? JSON.parse(body) : null;
                    } catch {
                      parsed = body;
                    }

                    if (
                      res.statusCode >= 200 &&
                      res.statusCode < 300
                    ) {

                      resolve({
                        status: res.statusCode,
                        data: parsed
                      });

                    } else {

                      reject(
                        new Error(
                          `Supabase HTTP ${res.statusCode}: ${body}`
                        )
                      );

                    }

                  });

                }
              );

              req.on("error", reject);

              if (options.body) {
                req.write(options.body);
              }

              req.end();
            });
          }


          async function pulseRequest(url) {

            const target =
              PULSE_URL +
              encodeURIComponent(url);

            let lastError = null;

            for (
              let attempt = 1;
              attempt <= MAX_RETRIES;
              attempt++
            ) {

              try {

                const result =
                  await new Promise((resolve, reject) => {

                    const request =
                      https.get(
                        target,
                        {
                          headers: {
                            "User-Agent":
                              "Avant-Garde-Audience-Updater/1.0",
                            "Accept":
                              "application/json,text/plain,*/*"
                          }
                        },
                        res => {

                          let body = "";

                          res.on(
                            "data",
                            chunk => {
                              body += chunk;
                            }
                          );

                          res.on(
                            "end",
                            () => {

                              if (
                                res.statusCode < 200 ||
                                res.statusCode >= 300
                              ) {

                                reject(
                                  new Error(
                                    `Pulse HTTP ${res.statusCode}`
                                  )
                                );

                                return;
                              }

                              resolve(body);

                            }
                          );

                        }
                      );

                    request.setTimeout(
                      PULSE_TIMEOUT_MS,
                      () => {
                        request.destroy(
                          new Error("Pulse timeout")
                        );
                      }
                    );

                    request.on(
                      "error",
                      reject
                    );

                  });


                return parsePulseAudience(result);

              } catch (error) {

                lastError = error;

                console.log(
                  `      Tentative ${attempt}/${MAX_RETRIES} échouée : ${error.message}`
                );

                if (
                  attempt < MAX_RETRIES
                ) {

                  await sleep(
                    1500 * attempt
                  );

                }

              }

            }

            throw lastError;
          }


          function parsePulseAudience(body) {

            /*
             * Pulse peut renvoyer du JSON ou du texte.
             *
             * On essaie plusieurs structures possibles.
             */

            let data = null;

            try {
              data = JSON.parse(body);
            } catch {
              data = null;
            }


            function findNumber(value) {

              if (
                typeof value === "number" &&
                Number.isFinite(value)
              ) {
                return Math.round(value);
              }

              if (
                typeof value === "string"
              ) {

                const cleaned =
                  value
                    .replace(/[^\d]/g, "");

                if (cleaned) {
                  return Number(cleaned);
                }
              }

              return null;
            }


            if (data !== null) {

              const candidates = [

                data.followers,
                data.followerCount,
                data.followersCount,
                data.subscribers,
                data.subscriberCount,
                data.audience,
                data.count,

                data.data?.followers,
                data.data?.followerCount,
                data.data?.followersCount,
                data.data?.subscribers,
                data.data?.subscriberCount,
                data.data?.audience,
                data.data?.count,

                data.profile?.followers,
                data.profile?.followerCount,
                data.profile?.followersCount,
                data.profile?.subscribers,
                data.profile?.subscriberCount

              ];

              for (
                const candidate of candidates
              ) {

                const number =
                  findNumber(candidate);

                if (
                  number !== null &&
                  number >= 0
                ) {
                  return number;
                }

              }

            }


            /*
             * Dernier recours :
             * recherche de nombres dans la réponse.
             */

            const text =
              String(body);

            const patterns = [

              /"followers"\s*:\s*([0-9]+)/i,
              /"followerCount"\s*:\s*([0-9]+)/i,
              /"followersCount"\s*:\s*([0-9]+)/i,
              /"subscribers"\s*:\s*([0-9]+)/i,
              /"subscriberCount"\s*:\s*([0-9]+)/i,
              /"audience"\s*:\s*([0-9]+)/i,
              /"count"\s*:\s*([0-9]+)/i

            ];

            for (
              const pattern of patterns
            ) {

              const match =
                text.match(pattern);

              if (match) {

                const number =
                  Number(match[1]);

                if (
                  Number.isFinite(number)
                ) {
                  return number;
                }

              }

            }

            throw new Error(
              "Impossible de lire l'audience Pulse"
            );
          }


          // ============================================================
          // RÉCUPÉRATION DES PROFILS
          // ============================================================

          async function getProfiles() {

            const fields = [
              "id",
              "name",
              "facebook_url",
              "instagram_url",
              "x_url",
              "youtube_url",
              "tiktok_url",
              "facebook_audience",
              "instagram_audience",
              "x_audience",
              "youtube_audience",
              "tiktok_audience",
              "audience_max",
              "audience_reseau",
              "audience_updated_at"
            ].join(",");


            const url =
              `${SUPABASE_URL}/rest/v1/profiles` +
              `?select=${encodeURIComponent(fields)}` +
              `&order=audience_updated_at.asc.nullsfirst,id.asc` +
              `&limit=${CANDIDATE_PROFILES}`;


            const result =
              await supabaseRequest(url);

            return result.data || [];
          }


          // ============================================================
          // CALCUL DU MEILLEUR RÉSEAU
          // ============================================================

          function calculateAudience(profile) {

            const networks = [

              {
                name: "facebook",
                value: profile.facebook_audience
              },

              {
                name: "instagram",
                value: profile.instagram_audience
              },

              {
                name: "x",
                value: profile.x_audience
              },

              {
                name: "youtube",
                value: profile.youtube_audience
              },

              {
                name: "tiktok",
                value: profile.tiktok_audience
              }

            ];


            let max = 0;
            let network = null;


            for (
              const item of networks
            ) {

              const value =
                Number(item.value);

              if (
                Number.isFinite(value) &&
                value > max
              ) {

                max = value;
                network = item.name;

              }

            }


            return {
              max,
              network
            };
          }


          // ============================================================
          // MISE À JOUR SUPABASE
          // ============================================================

          async function updateProfile(
            profileId,
            values
          ) {

            const url =
              `${SUPABASE_URL}/rest/v1/profiles?id=eq.${encodeURIComponent(profileId)}`;


            await supabaseRequest(
              url,
              {
                method: "PATCH",

                headers: {
                  "Prefer": "return=minimal"
                },

                body: JSON.stringify(values)
              }
            );
          }


          // ============================================================
          // PROGRAMME PRINCIPAL
          // ============================================================

          async function main() {

            const startedAt =
              Date.now();


            console.log("");
            console.log(
              "========================================"
            );
            console.log(
              "AVANT-GARDE — UPDATE AUDIENCE"
            );
            console.log(
              "========================================"
            );

            console.log(
              `Limite Pulse : ${MAX_CALLS_PER_MINUTE}/min`
            );

            console.log(
              `Budget URLs : ${MAX_URLS_PER_RUN}`
            );


            // ----------------------------------------------------------
            // PROFILS
            // ----------------------------------------------------------

            const profiles =
              await getProfiles();


            console.log(
              `Profils candidats : ${profiles.length}`
            );


            if (!profiles.length) {

              console.log(
                "Aucun profil à traiter."
              );

              return;
            }


            // ----------------------------------------------------------
            // CONSTRUCTION DES URLS
            // ----------------------------------------------------------

            const entries = [];


            for (
              const profile of profiles
            ) {

              const socialUrls = [

                {
                  network: "facebook",
                  url: profile.facebook_url
                },

                {
                  network: "instagram",
                  url: profile.instagram_url
                },

                {
                  network: "x",
                  url: profile.x_url
                },

                {
                  network: "youtube",
                  url: profile.youtube_url
                },

                {
                  network: "tiktok",
                  url: profile.tiktok_url
                }

              ];


              const profileEntries = [];


              for (
                const item of socialUrls
              ) {

                const url =
                  normalizeUrl(item.url);

                if (!url) continue;

                const detected =
                  detectNetwork(url);

                if (!detected) continue;

                profileEntries.push({
                  profile,
                  network: detected,
                  url
                });

              }


              /*
               * IMPORTANT :
               *
               * On ne coupe jamais un profil au milieu.
               *
               * Soit on peut traiter toutes ses URLs,
               * soit on passe au profil suivant.
               */

              if (
                entries.length +
                profileEntries.length
                <= MAX_URLS_PER_RUN
              ) {

                entries.push(
                  ...profileEntries
                );

              } else {

                break;
              }

            }


            console.log(
              `URLs sélectionnées : ${entries.length}`
            );


            if (!entries.length) {

              console.log(
                "Aucune URL sociale exploitable."
              );

              return;
            }


            // ----------------------------------------------------------
            // GROUPEMENT PAR PROFIL
            // ----------------------------------------------------------

            const profileMap =
              new Map();


            for (
              const entry of entries
            ) {

              if (
                !profileMap.has(
                  entry.profile.id
                )
              ) {

                profileMap.set(
                  entry.profile.id,
                  {
                    profile: entry.profile,
                    entries: []
                  }
                );

              }


              profileMap
                .get(entry.profile.id)
                .entries
                .push(entry);

            }


            console.log(
              `Profils réellement traités : ${profileMap.size}`
            );


            // ----------------------------------------------------------
            // TRAITEMENT
            // ----------------------------------------------------------

            let pulseOK = 0;
            let pulseErrors = 0;
            let profilesUpdated = 0;


            for (
              const group of profileMap.values()
            ) {

              const profile =
                group.profile;


              console.log("");
              console.log(
                `----- ${profile.name || profile.id} -----`
              );


              const updates = {};

              let profileHadSuccess =
                false;


              for (
                const entry of group.entries
              ) {

                console.log(
                  `[${entry.network}] ${entry.url}`
                );


                try {

                  const audience =
                    await pulseRequest(
                      entry.url
                    );


                  console.log(
                    `  → ${audience}`
                  );


                  updates[
                    audienceColumn(
                      entry.network
                    )
                  ] = audience;


                  /*
                   * Mise à jour de l'objet local.
                   * Cela permet de recalculer audience_max.
                   */

                  profile[
                    audienceColumn(
                      entry.network
                    )
                  ] = audience;


                  pulseOK++;
                  profileHadSuccess = true;


                } catch (error) {

                  pulseErrors++;


                  console.log(
                    `  → ERREUR : ${error.message}`
                  );

                }


                /*
                 * ≈ 100 requêtes/minute maximum.
                 */
                await sleep(
                  PULSE_DELAY_MS
                );

              }


              // --------------------------------------------------------
              // ÉCRITURE DU PROFIL
              // --------------------------------------------------------

              if (
                profileHadSuccess
              ) {

                const calculated =
                  calculateAudience(profile);


                updates.audience_max =
                  calculated.max;

                updates.audience_reseau =
                  calculated.network;

                /*
                 * Très important :
                 *
                 * On indique que le profil a été traité
                 * seulement après ses requêtes Pulse.
                 *
                 * Ainsi il partira automatiquement
                 * en fin de rotation.
                 */

                updates.audience_updated_at =
                  new Date().toISOString();


                try {

                  await updateProfile(
                    profile.id,
                    updates
                  );


                  profilesUpdated++;


                  console.log(
                    `  ✓ Supabase mis à jour`
                  );


                } catch (error) {

                  console.log(
                    `  ✗ Erreur Supabase : ${error.message}`
                  );

                }

              }

            }


            // ============================================================
            // RAPPORT
            // ============================================================

            const duration =
              Math.round(
                (Date.now() - startedAt) /
                1000
              );


            console.log("");
            console.log(
              "========================================"
            );

            console.log(
              "MISE À JOUR TERMINÉE"
            );

            console.log(
              "========================================"
            );

            console.log(
              `Profils candidats : ${profiles.length}`
            );

            console.log(
              `Profils traités : ${profileMap.size}`
            );

            console.log(
              `URLs Pulse : ${entries.length}`
            );

            console.log(
              `Pulse OK : ${pulseOK}`
            );

            console.log(
              `Pulse erreurs : ${pulseErrors}`
            );

            console.log(
              `Profils Supabase mis à jour : ${profilesUpdated}`
            );

            console.log(
              `Durée : ${duration}s`
            );

            console.log(
              "========================================"
            );

          }


          main()
            .catch(error => {

              console.error("");
              console.error(
                "ERREUR FATALE"
              );

              console.error(
                error
              );

              process.exit(1);

            });

          EOF
