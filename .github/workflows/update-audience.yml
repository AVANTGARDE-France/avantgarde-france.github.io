name: Mise à jour audiences réseaux

on:
  schedule:
    - cron: "2,17,32,47 1-5 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:
  update-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Mise à jour des audiences
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'EOF'

          const https = require("https");

          /* =========================================================
             AVANT-GARDE — UPDATE AUDIENCE
             Récupération des audiences réseaux + écriture Supabase

             Pulse :
             - 1 requête /profile/batch
             - jusqu'à 50 URLs par requête
             - aucune logique de retry
             - les URLs identiques sont récupérées une seule fois
          ========================================================= */

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_SERVICE_ROLE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;

          const PULSE_BATCH_URL =
            "https://pulse.walls.sh/profile/batch";

          const MAX_URLS_PER_BATCH = 50;
          const MAX_URLS_PER_RUN = 1000;
          const CANDIDATE_PROFILES = 1500;
          const PULSE_TIMEOUT_MS = 15000;

          if (!SUPABASE_URL || !SUPABASE_SERVICE_ROLE_KEY) {
            throw new Error("Variables Supabase manquantes");
          }

          /* =========================================================
             OUTILS
          ========================================================= */

          function normalizeUrl(url) {
            if (!url) return null;

            return String(url)
              .trim()
              .replace(/\/+$/, "")
              .toLowerCase();
          }

          function numberValue(value) {
            if (value === null || value === undefined) {
              return null;
            }

            if (typeof value === "number") {
              return Number.isFinite(value) ? Math.round(value) : null;
            }

            const text = String(value)
              .trim()
              .replace(/\s/g, "")
              .replace(/,/g, "");

            if (!text) {
              return null;
            }

            const direct = Number(text);

            if (Number.isFinite(direct)) {
              return Math.round(direct);
            }

            const match = text.match(
              /^([\d.]+)([kKmMbB])?$/
            );

            if (!match) {
              return null;
            }

            let number = Number(match[1]);

            if (!Number.isFinite(number)) {
              return null;
            }

            const suffix = (match[2] || "").toLowerCase();

            if (suffix === "k") number *= 1000;
            if (suffix === "m") number *= 1000000;
            if (suffix === "b") number *= 1000000000;

            return Math.round(number);
          }

          /* =========================================================
             PARSING REPONSE PULSE
          ========================================================= */

          function parsePulseAudience(data) {
            if (!data) {
              return null;
            }

            const candidates = [
              data.followers,
              data.followerCount,
              data.followersCount,
              data.subscribers,
              data.subscriberCount,
              data.audience,
              data.count,

              data.data?.followers,
              data.data?.followerCount,
              data.data?.followersCount,
              data.data?.subscribers,
              data.data?.subscriberCount,
              data.data?.audience,
              data.data?.count,

              data.profile?.followers,
              data.profile?.followerCount,
              data.profile?.followersCount,
              data.profile?.subscribers,
              data.profile?.subscriberCount,
              data.profile?.audience,
              data.profile?.count
            ];

            for (const candidate of candidates) {
              const value = numberValue(candidate);

              if (value !== null) {
                return value;
              }
            }

            /*
             * Dernier recours :
             * recherche récursive de champs connus dans la réponse.
             */

            function recursiveSearch(obj, depth = 0) {
              if (!obj || depth > 4) {
                return null;
              }

              if (typeof obj !== "object") {
                return null;
              }

              for (const [key, value] of Object.entries(obj)) {
                const normalizedKey = key
                  .toLowerCase()
                  .replace(/[^a-z]/g, "");

                if (
                  normalizedKey === "followers" ||
                  normalizedKey === "followercount" ||
                  normalizedKey === "followerscount" ||
                  normalizedKey === "subscribers" ||
                  normalizedKey === "subscribercount" ||
                  normalizedKey === "audience"
                ) {
                  const parsed = numberValue(value);

                  if (parsed !== null) {
                    return parsed;
                  }
                }

                if (value && typeof value === "object") {
                  const nested = recursiveSearch(
                    value,
                    depth + 1
                  );

                  if (nested !== null) {
                    return nested;
                  }
                }
              }

              return null;
            }

            return recursiveSearch(data);
          }

          /* =========================================================
             APPEL SUPABASE
          ========================================================= */

          function supabaseRequest(method, path, body = null) {
            return new Promise((resolve, reject) => {
              const url = new URL(
                `${SUPABASE_URL}${path}`
              );

              const payload =
                body !== null
                  ? JSON.stringify(body)
                  : null;

              const req = https.request(
                {
                  hostname: url.hostname,
                  port: 443,
                  path: `${url.pathname}${url.search}`,
                  method,

                  headers: {
                    "apikey": SUPABASE_SERVICE_ROLE_KEY,
                    "Authorization":
                      `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`,

                    "Content-Type":
                      "application/json",

                    ...(payload
                      ? {
                          "Content-Length":
                            Buffer.byteLength(payload)
                        }
                      : {})
                  }
                },

                res => {
                  let data = "";

                  res.on("data", chunk => {
                    data += chunk;
                  });

                  res.on("end", () => {
                    let parsed = data;

                    try {
                      parsed = data
                        ? JSON.parse(data)
                        : null;
                    } catch (_) {}

                    if (
                      res.statusCode >= 200 &&
                      res.statusCode < 300
                    ) {
                      resolve(parsed);
                    } else {
                      reject(
                        new Error(
                          `Supabase HTTP ${res.statusCode}: ${data}`
                        )
                      );
                    }
                  });
                }
              );

              req.on("error", reject);

              if (payload) {
                req.write(payload);
              }

              req.end();
            });
          }

          /* =========================================================
             RECUPERATION DES PROFILS
          ========================================================= */

          async function getProfiles() {
            const select = [
              "id",
              "nom",

              "facebook_url",
              "instagram_url",
              "x_url",
              "youtube_url",
              "tiktok_url",

              "facebook_audience",
              "instagram_audience",
              "x_audience",
              "youtube_audience",
              "tiktok_audience",

              "audience_max",
              "audience_reseau",
              "audience_updated_at"
            ].join(",");

            const path =
              `/rest/v1/profiles` +
              `?select=${encodeURIComponent(select)}` +
              `&order=audience_updated_at.asc.nullsfirst,id.asc` +
              `&limit=${CANDIDATE_PROFILES}`;

            return await supabaseRequest("GET", path);
          }

          /* =========================================================
             CALCUL AUDIENCE MAX
          ========================================================= */

          function calculateAudience(profile) {
            const values = [
              {
                network: "facebook",
                value: numberValue(
                  profile.facebook_audience
                )
              },

              {
                network: "instagram",
                value: numberValue(
                  profile.instagram_audience
                )
              },

              {
                network: "x",
                value: numberValue(
                  profile.x_audience
                )
              },

              {
                network: "youtube",
                value: numberValue(
                  profile.youtube_audience
                )
              },

              {
                network: "tiktok",
                value: numberValue(
                  profile.tiktok_audience
                )
              }
            ].filter(item => item.value !== null);

            if (!values.length) {
              return {
                max: null,
                network: null
              };
            }

            values.sort(
              (a, b) => b.value - a.value
            );

            return {
              max: values[0].value,
              network: values[0].network
            };
          }

          /* =========================================================
             ECRITURE AUDIENCE SUPABASE
          ========================================================= */

          async function updateProfile(
            profileId,
            values
          ) {
            await supabaseRequest(
              "POST",
              "/rest/v1/rpc/update_profile_audiences",
              {
                p_profile_id: profileId,

                p_facebook_audience:
                  values.facebook_audience ?? null,

                p_instagram_audience:
                  values.instagram_audience ?? null,

                p_x_audience:
                  values.x_audience ?? null,

                p_youtube_audience:
                  values.youtube_audience ?? null,

                p_tiktok_audience:
                  values.tiktok_audience ?? null,

                p_audience_max:
                  values.audience_max ?? null,

                p_audience_reseau:
                  values.audience_reseau ?? null,

                p_audience_updated_at:
                  values.audience_updated_at
              }
            );
          }

          /* =========================================================
             PULSE — BATCH
          ========================================================= */

          function pulseBatchRequest(urls) {
            return new Promise((resolve, reject) => {
              const params = new URLSearchParams();

              for (const url of urls) {
                params.append("url", url);
              }

              const requestUrl =
                `${PULSE_BATCH_URL}?${params.toString()}`;

              const parsedUrl = new URL(requestUrl);

              const req = https.request(
                {
                  hostname: parsedUrl.hostname,
                  port: 443,
                  path:
                    `${parsedUrl.pathname}${parsedUrl.search}`,
                  method: "GET",

                  headers: {
                    "Accept": "application/json"
                  }
                },

                res => {
                  let data = "";

                  res.on("data", chunk => {
                    data += chunk;
                  });

                  res.on("end", () => {
                    if (
                      res.statusCode < 200 ||
                      res.statusCode >= 300
                    ) {
                      reject(
                        new Error(
                          `Pulse HTTP ${res.statusCode}: ${data}`
                        )
                      );

                      return;
                    }

                    try {
                      resolve(
                        JSON.parse(data)
                      );
                    } catch (error) {
                      reject(
                        new Error(
                          `Réponse Pulse JSON invalide: ${error.message}`
                        )
                      );
                    }
                  });
                }
              );

              req.setTimeout(
                PULSE_TIMEOUT_MS,
                () => {
                  req.destroy(
                    new Error(
                      `Pulse timeout après ${PULSE_TIMEOUT_MS}ms`
                    )
                  );
                }
              );

              req.on("error", reject);

              req.end();
            });
          }

          /* =========================================================
             RECUPERATION PULSE DE TOUTES LES URLS DISTINCTES
          ========================================================= */

          async function loadPulseData(
            uniqueUrls,
            pulseCache
          ) {
            let pulseOk = 0;
            let pulseErrors = 0;

            /*
             * Pulse accepte maximum 50 URLs par batch.
             * On découpe donc automatiquement si nécessaire.
             */

            for (
              let start = 0;
              start < uniqueUrls.length;
              start += MAX_URLS_PER_BATCH
            ) {
              const urls = uniqueUrls.slice(
                start,
                start + MAX_URLS_PER_BATCH
              );

              console.log(
                `\nPulse batch ${Math.floor(
                  start / MAX_URLS_PER_BATCH
                ) + 1} : ${urls.length} URL(s)`
              );

              try {
                const response =
                  await pulseBatchRequest(urls);

                /*
                 * La réponse documentée de Pulse est :
                 *
                 * {
                 *   count: ...,
                 *   results: [...]
                 * }
                 */

                const results =
                  Array.isArray(response?.results)
                    ? response.results
                    : Array.isArray(response)
                    ? response
                    : [];

                /*
                 * Pulse conserve l'ordre des URLs envoyées.
                 * On associe donc chaque résultat à l'URL
                 * correspondante.
                 */

                for (
                  let i = 0;
                  i < urls.length;
                  i++
                ) {
                  const originalUrl = urls[i];
                  const key =
                    normalizeUrl(originalUrl);

                  const result = results[i];

                  if (!result) {
                    pulseCache.set(
                      key,
                      {
                        success: false,
                        error:
                          "Aucun résultat retourné par Pulse"
                      }
                    );

                    pulseErrors++;
                    continue;
                  }

                  /*
                   * Un élément de batch peut être :
                   *
                   * - un profil valide
                   * - { url, error }
                   */

                  if (result.error) {
                    pulseCache.set(
                      key,
                      {
                        success: false,
                        error: String(result.error)
                      }
                    );

                    pulseErrors++;
                    continue;
                  }

                  const audience =
                    parsePulseAudience(result);

                  if (audience === null) {
                    pulseCache.set(
                      key,
                      {
                        success: false,
                        error:
                          "Audience introuvable dans la réponse Pulse"
                      }
                    );

                    pulseErrors++;
                    continue;
                  }

                  pulseCache.set(
                    key,
                    {
                      success: true,
                      audience
                    }
                  );

                  pulseOk++;
                }

              } catch (error) {
                /*
                 * IMPORTANT :
                 * aucun retry.
                 *
                 * Si le batch échoue, toutes les URLs
                 * de ce batch sont simplement marquées
                 * en erreur et le workflow continue.
                 */

                console.log(
                  `  → ERREUR BATCH : ${error.message}`
                );

                for (const url of urls) {
                  const key =
                    normalizeUrl(url);

                  pulseCache.set(
                    key,
                    {
                      success: false,
                      error: error.message
                    }
                  );

                  pulseErrors++;
                }
              }
            }

            return {
              pulseOk,
              pulseErrors
            };
          }

          /* =========================================================
             PROGRAMME PRINCIPAL
          ========================================================= */

          async function main() {
            const startedAt = Date.now();

            console.log(
              "========================================="
            );

            console.log(
              "AVANT-GARDE — UPDATE AUDIENCE"
            );

            console.log(
              "========================================="
            );

            const profiles =
              await getProfiles();

            console.log(
              `Profils candidats : ${profiles.length}`
            );

            /*
             * Construction de toutes les références
             * réseaux/profils.
             */

            const entries = [];

            for (const profile of profiles) {
              const networks = [
                {
                  network: "facebook",
                  url: profile.facebook_url
                },

                {
                  network: "instagram",
                  url: profile.instagram_url
                },

                {
                  network: "x",
                  url: profile.x_url
                },

                {
                  network: "youtube",
                  url: profile.youtube_url
                },

                {
                  network: "tiktok",
                  url: profile.tiktok_url
                }
              ];

              for (const item of networks) {
                if (!item.url) {
                  continue;
                }

                entries.push({
                  profile,
                  network: item.network,
                  url: item.url,
                  key: normalizeUrl(item.url)
                });
              }
            }

            /*
             * Une même URL peut appartenir à plusieurs profils.
             * Elle ne doit être interrogée qu'une seule fois.
             */

            const uniqueMap = new Map();

            for (const entry of entries) {
              if (!uniqueMap.has(entry.key)) {
                uniqueMap.set(
                  entry.key,
                  entry.url
                );
              }
            }

            let uniqueUrls =
              Array.from(uniqueMap.values());

            /*
             * Sécurité : plafond global du workflow.
             */

            if (
              uniqueUrls.length >
              MAX_URLS_PER_RUN
            ) {
              uniqueUrls =
                uniqueUrls.slice(
                  0,
                  MAX_URLS_PER_RUN
                );
            }

            const sharedSaved =
              entries.length -
              uniqueUrls.length;

            console.log(
              `URLs sélectionnées : ${entries.length}`
            );

            console.log(
              `URLs Pulse distinctes : ${uniqueUrls.length}`
            );

            console.log(
              `URLs partagées économisées : ${sharedSaved}`
            );

            /*
             * Cache global du run.
             */

            const pulseCache =
              new Map();

            /*
             * UNE SEULE PHASE DE RECUPERATION PULSE.
             * Pas de requêtes individuelles ensuite.
             */

            const pulseStats =
              await loadPulseData(
                uniqueUrls,
                pulseCache
              );

            let profilesUpdated = 0;
            let profilesErrors = 0;

            /*
             * Maintenant seulement :
             * on répartit les résultats Pulse
             * vers les différents profils.
             */

            for (const profile of profiles) {
              console.log(
                `\n----- ${profile.nom || profile.id} -----`
              );

              const updates = {
                facebook_audience:
                  profile.facebook_audience,

                instagram_audience:
                  profile.instagram_audience,

                x_audience:
                  profile.x_audience,

                youtube_audience:
                  profile.youtube_audience,

                tiktok_audience:
                  profile.tiktok_audience
              };

              const profileEntries =
                entries.filter(
                  entry =>
                    entry.profile.id ===
                    profile.id
                );

              let profileHasPulseResult =
                false;

              for (const entry of profileEntries) {
                const cached =
                  pulseCache.get(entry.key);

                console.log(
                  `[${entry.network}] ${entry.url}`
                );

                if (!cached) {
                  console.log(
                    "  → ERREUR : donnée Pulse absente"
                  );

                  continue;
                }

                if (!cached.success) {
                  console.log(
                    `  → ERREUR : ${cached.error}`
                  );

                  continue;
                }

                console.log(
                  `  → ${cached.audience}` +
                  (
                    uniqueMap.get(entry.key) ===
                    entry.url
                      ? ""
                      : " (cache)"
                  )
                );

                updates[
                  `${entry.network}_audience`
                ] = cached.audience;

                profileHasPulseResult =
                  true;
              }

              /*
               * Calcul du maximum avec les valeurs
               * nouvellement récupérées.
               */

              const calculation =
                calculateAudience({
                  ...profile,
                  ...updates
                });

              updates.audience_max =
                calculation.max;

              updates.audience_reseau =
                calculation.network;

              /*
               * On conserve l'écriture Supabase
               * via la RPC existante.
               */

              updates.audience_updated_at =
                new Date().toISOString();

              /*
               * Même si Pulse a rencontré une erreur
               * sur un réseau, on ne bloque pas le profil :
               * les autres audiences récupérées sont écrites.
               */

              try {
                await updateProfile(
                  profile.id,
                  updates
                );

                profilesUpdated++;

                console.log(
                  "  ✓ Supabase mis à jour"
                );

              } catch (error) {
                profilesErrors++;

                console.log(
                  `  ✗ Erreur Supabase : ${error.message}`
                );
              }
            }

            const duration =
              Math.round(
                (Date.now() - startedAt) / 1000
              );

            console.log(
              "\n========================================="
            );

            console.log(
              "RÉSUMÉ"
            );

            console.log(
              "========================================="
            );

            console.log(
              `Profils candidats : ${profiles.length}`
            );

            console.log(
              `Profils traités : ${profiles.length}`
            );

            console.log(
              `URLs sélectionnées : ${entries.length}`
            );

            console.log(
              `URLs Pulse distinctes : ${uniqueUrls.length}`
            );

            console.log(
              `URLs partagées économisées : ${sharedSaved}`
            );

            console.log(
              `Pulse OK : ${pulseStats.pulseOk}`
            );

            console.log(
              `Pulse erreurs : ${pulseStats.pulseErrors}`
            );

            console.log(
              `Profils Supabase mis à jour : ${profilesUpdated}`
            );

            console.log(
              `Erreurs Supabase : ${profilesErrors}`
            );

            console.log(
              `Durée : ${duration}s`
            );

            console.log(
              "========================================="
            );

            /*
             * Une erreur Pulse ne fait PAS échouer tout le workflow.
             * En revanche, une erreur Supabase globale ou de lecture
             * des profils fait bien échouer le job via les exceptions.
             */
          }

          main().catch(error => {
            console.error(
              "\nERREUR FATALE :",
              error
            );

            process.exit(1);
          });

          EOF
