name: Mise à jour audiences réseaux

on:
  # Toutes les heures de 01h00 à 06h00, heure de Paris
  schedule:
    - cron: "0 1-6 * * *"
      timezone: "Europe/Paris"

  # Permet de lancer manuellement depuis GitHub
  workflow_dispatch:

concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:
  update-audience:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Mise à jour des audiences
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'EOF'

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_SERVICE_ROLE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL) {
            throw new Error("SUPABASE_URL manquant");
          }

          if (!SUPABASE_SERVICE_ROLE_KEY) {
            throw new Error("SUPABASE_SERVICE_ROLE_KEY manquant");
          }

          const PULSE_URL = "https://pulse.walls.sh/profile/batch";

          /*
           * Pulse autorise actuellement jusqu'à 120 appels/minute.
           *
           * On ne colle volontairement pas à 120.
           * 100 appels/minute laisse une marge de sécurité.
           */
          const MAX_CALLS_PER_MINUTE = 100;

          /*
           * Pulse accepte jusqu'à 50 profils dans /profile/batch.
           */
          const PULSE_BATCH_SIZE = 50;

          /*
           * Petit délai entre les appels.
           * 600 ms ≈ 100 appels/minute.
           */
          const BASE_DELAY_MS = 600;

          /*
           * Pause utilitaire
           */
          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          /*
           * Headers Supabase
           */
          const supabaseHeaders = {
            "apikey": SUPABASE_SERVICE_ROLE_KEY,
            "Authorization": `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`,
            "Content-Type": "application/json"
          };

          /*
           * GET Supabase
           */
          async function supabaseGet(path) {

            const response = await fetch(
              `${SUPABASE_URL}/rest/v1/${path}`,
              {
                method: "GET",
                headers: {
                  ...supabaseHeaders,
                  "Accept": "application/json"
                }
              }
            );

            if (!response.ok) {

              const text = await response.text();

              throw new Error(
                `Supabase GET ${response.status}: ${text}`
              );
            }

            return response.json();
          }

          /*
           * PATCH Supabase
           */
          async function supabasePatch(id, values) {

            const response = await fetch(
              `${SUPABASE_URL}/rest/v1/profiles?id=eq.${encodeURIComponent(id)}`,
              {
                method: "PATCH",
                headers: {
                  ...supabaseHeaders,
                  "Prefer": "return=minimal"
                },
                body: JSON.stringify(values)
              }
            );

            if (!response.ok) {

              const text = await response.text();

              throw new Error(
                `Supabase PATCH ${response.status}: ${text}`
              );
            }
          }

          /*
           * Récupération de TOUS les profils.
           *
           * Supabase/PostgREST limite généralement les réponses.
           * On utilise donc une pagination de 1000.
           */
          async function getAllProfiles() {

            const profiles = [];

            const PAGE_SIZE = 1000;

            let offset = 0;

            while (true) {

              const fields = [
                "id",
                "nom",

                "facebook_url",
                "instagram_url",
                "x_url",
                "youtube_url",
                "tiktok_url",

                "facebook_audience",
                "instagram_audience",
                "x_audience",
                "youtube_audience",
                "tiktok_audience",

                "audience_max",
                "audience_reseau",
                "audience_updated_at"
              ].join(",");

              const path =
                `profiles?select=${fields}` +
                `&order=id.asc` +
                `&limit=${PAGE_SIZE}` +
                `&offset=${offset}`;

              const page = await supabaseGet(path);

              profiles.push(...page);

              console.log(
                `Supabase : ${profiles.length} profils récupérés`
              );

              if (page.length < PAGE_SIZE) {
                break;
              }

              offset += PAGE_SIZE;
            }

            return profiles;
          }

          /*
           * Détermine le nom du champ audience correspondant
           * à une plateforme Pulse.
           */
          function audienceField(platform) {

            switch (platform) {

              case "facebook":
                return "facebook_audience";

              case "instagram":
                return "instagram_audience";

              case "x":
              case "twitter":
                return "x_audience";

              case "youtube":
                return "youtube_audience";

              case "tiktok":
                return "tiktok_audience";

              default:
                return null;
            }
          }

          /*
           * Vérifie qu'une audience est exploitable.
           */
          function normalizeFollowers(value) {

            if (
              value === null ||
              value === undefined ||
              value === ""
            ) {
              return null;
            }

            const number = Number(value);

            if (!Number.isFinite(number)) {
              return null;
            }

            if (number < 0) {
              return null;
            }

            return Math.round(number);
          }

          /*
           * Pulse peut renvoyer un objet d'erreur
           * à l'intérieur d'un batch.
           */
          function isUnavailableError(item) {

            if (!item || !item.error) {
              return false;
            }

            const error = String(item.error).toLowerCase();

            return [
              "not_found",
              "deleted",
              "suspended"
            ].includes(error);
          }

          /*
           * Nous NE supprimons PAS une audience simplement parce
           * qu'une requête échoue techniquement.
           *
           * Un login_required ou content_unavailable peut signifier
           * page privée, blocage régional ou problème temporaire.
           */
          function shouldClearAudience(item) {

            if (!item || !item.error) {
              return false;
            }

            const error = String(item.error).toLowerCase();

            return [
              "not_found",
              "deleted",
              "suspended"
            ].includes(error);
          }

          /*
           * Appel Pulse batch.
           */
          async function pulseBatch(urls, attempt = 1) {

            const params = new URLSearchParams();

            /*
             * On utilise plusieurs paramètres url=.
             * C'est officiellement supporté par Pulse.
             */
            for (const url of urls) {
              params.append("url", url);
            }

            const response = await fetch(
              `${PULSE_URL}?${params.toString()}`,
              {
                method: "GET",
                headers: {
                  "Accept": "application/json",
                  "User-Agent": "Avant-Garde-Audience-Bot/1.0"
                }
              }
            );

            /*
             * Rate limit Pulse.
             */
            if (response.status === 429) {

              if (attempt >= 5) {
                throw new Error(
                  "Pulse: trop de 429 après 5 tentatives"
                );
              }

              const retryAfter =
                Number(response.headers.get("Retry-After")) || 10;

              console.log(
                `Pulse 429 → attente ${retryAfter}s`
              );

              await sleep(
                (retryAfter + 1) * 1000
              );

              return pulseBatch(
                urls,
                attempt + 1
              );
            }

            /*
             * Erreur serveur Pulse.
             */
            if (
              response.status === 500 ||
              response.status === 502 ||
              response.status === 503
            ) {

              if (attempt >= 5) {
                throw new Error(
                  `Pulse ${response.status} après 5 tentatives`
                );
              }

              console.log(
                `Pulse ${response.status} → retry`
              );

              await sleep(
                Math.min(
                  30000,
                  2000 * attempt
                )
              );

              return pulseBatch(
                urls,
                attempt + 1
              );
            }

            const text = await response.text();

            if (!response.ok) {

              throw new Error(
                `Pulse HTTP ${response.status}: ${text}`
              );
            }

            let data;

            try {
              data = JSON.parse(text);
            } catch {

              throw new Error(
                `Pulse réponse JSON invalide: ${text.slice(0, 500)}`
              );
            }

            /*
             * Format actuel :
             *
             * {
             *   count: 2,
             *   results: [...]
             * }
             */
            if (Array.isArray(data)) {
              return data;
            }

            if (Array.isArray(data.results)) {
              return data.results;
            }

            /*
             * Sécurité si Pulse modifie légèrement le format.
             */
            if (Array.isArray(data.profiles)) {
              return data.profiles;
            }

            throw new Error(
              "Format Pulse inattendu"
            );
          }

          /*
           * Recalcul de l'audience maximale.
           */
          function calculateMaximum(profile) {

            const values = [

              {
                network: "Facebook",
                value: profile.facebook_audience
              },

              {
                network: "Instagram",
                value: profile.instagram_audience
              },

              {
                network: "X",
                value: profile.x_audience
              },

              {
                network: "YouTube",
                value: profile.youtube_audience
              },

              {
                network: "TikTok",
                value: profile.tiktok_audience
              }

            ];

            const valid = values
              .filter(x =>
                Number.isFinite(Number(x.value))
              )
              .map(x => ({
                network: x.network,
                value: Number(x.value)
              }));

            if (!valid.length) {

              return {
                max: null,
                network: null
              };
            }

            valid.sort(
              (a, b) => b.value - a.value
            );

            return {
              max: valid[0].value,
              network: valid[0].network
            };
          }

          /*
           * PROGRAMME PRINCIPAL
           */
          async function main() {

            console.log("");
            console.log("========================================");
            console.log("AVANT-GARDE — UPDATE AUDIENCE");
            console.log("========================================");
            console.log("");

            const startTime = Date.now();

            /*
             * 1. Récupération des profils
             */
            const profiles =
              await getAllProfiles();

            console.log("");
            console.log(
              `TOTAL PROFILS : ${profiles.length}`
            );

            /*
             * 2. Construction d'une liste unique de toutes
             * les URLs de réseaux.
             *
             * Pulse accepte les plateformes mélangées.
             */
            const urlEntries = [];

            for (const profile of profiles) {

              const networks = [

                ["facebook", profile.facebook_url],
                ["instagram", profile.instagram_url],
                ["x", profile.x_url],
                ["youtube", profile.youtube_url],
                ["tiktok", profile.tiktok_url]

              ];

              for (const [network, url] of networks) {

                if (
                  typeof url !== "string" ||
                  !url.trim()
                ) {
                  continue;
                }

                urlEntries.push({
                  profileId: profile.id,
                  profileName: profile.nom,
                  network,
                  url: url.trim()
                });
              }
            }

            console.log(
              `TOTAL URLS RÉSEAUX : ${urlEntries.length}`
            );

            /*
             * 3. Découpage en lots de 50.
             */
            const batches = [];

            for (
              let i = 0;
              i < urlEntries.length;
              i += PULSE_BATCH_SIZE
            ) {

              batches.push(
                urlEntries.slice(
                  i,
                  i + PULSE_BATCH_SIZE
                )
              );
            }

            console.log(
              `LOTS PULSE : ${batches.length}`
            );

            /*
             * Statistiques
             */
            let pulseSuccess = 0;
            let pulseErrors = 0;
            let supabaseUpdates = 0;

            /*
             * 4. Traitement des lots
             */
            for (
              let batchIndex = 0;
              batchIndex < batches.length;
              batchIndex++
            ) {

              const batch =
                batches[batchIndex];

              console.log("");
              console.log(
                `----- LOT ${batchIndex + 1}/${batches.length} -----`
              );

              console.log(
                `URLs : ${batch.length}`
              );

              const urls =
                batch.map(item => item.url);

              /*
               * Appel Pulse
               */
              let results;

              try {

                results =
                  await pulseBatch(urls);

              } catch (error) {

                console.error(
                  "ERREUR PULSE :",
                  error.message
                );

                /*
                 * On ne détruit aucune donnée
                 * en cas d'erreur technique.
                 */
                pulseErrors += batch.length;

                /*
                 * On passe au lot suivant.
                 */
                await sleep(
                  BASE_DELAY_MS
                );

                continue;
              }

              /*
               * Création d'une map URL → résultat
               */
              const resultMap =
                new Map();

              for (const result of results) {

                if (
                  result &&
                  typeof result.url === "string"
                ) {

                  resultMap.set(
                    result.url,
                    result
                  );
                }
              }

              /*
               * Pour chaque profil du lot,
               * on regroupe les résultats.
               */
              const updatesByProfile =
                new Map();

              for (const entry of batch) {

                const result =
                  resultMap.get(entry.url);

                if (!result) {

                  console.log(
                    `Aucun résultat Pulse : ${entry.url}`
                  );

                  pulseErrors++;

                  continue;
                }

                const field =
                  audienceField(
                    result.platform ||
                    entry.network
                  );

                if (!field) {

                  console.log(
                    `Plateforme inconnue : ${result.platform}`
                  );

                  pulseErrors++;

                  continue;
                }

                /*
                 * Erreur explicite Pulse
                 */
                if (result.error) {

                  console.log(
                    `[${entry.network}] ${entry.profileName} → ${result.error}`
                  );

                  /*
                   * Seulement certaines erreurs explicites
                   * autorisent la suppression.
                   */
                  if (
                    shouldClearAudience(result)
                  ) {

                    if (
                      !updatesByProfile.has(
                        entry.profileId
                      )
                    ) {

                      updatesByProfile.set(
                        entry.profileId,
                        {
                          profile: profiles.find(
                            p =>
                              p.id === entry.profileId
                          ),
                          values: {}
                        }
                      );
                    }

                    updatesByProfile
                      .get(entry.profileId)
                      .values[field] = null;
                  }

                  pulseErrors++;

                  continue;
                }

                const followers =
                  normalizeFollowers(
                    result.followers
                  );

                /*
                 * Pas de compteur valide :
                 * on conserve l'ancien.
                 */
                if (followers === null) {

                  console.log(
                    `[${entry.network}] ${entry.profileName} → followers absent`
                  );

                  pulseErrors++;

                  continue;
                }

                console.log(
                  `[${entry.network}] ${entry.profileName} → ${followers}`
                );

                if (
                  !updatesByProfile.has(
                    entry.profileId
                  )
                ) {

                  updatesByProfile.set(
                    entry.profileId,
                    {
                      profile: profiles.find(
                        p =>
                          p.id === entry.profileId
                      ),
                      values: {}
                    }
                  );
                }

                updatesByProfile
                  .get(entry.profileId)
                  .values[field] = followers;

                pulseSuccess++;
              }

              /*
               * 5. Mise à jour Supabase.
               *
               * Un seul PATCH par profil pour les réseaux
               * trouvés dans ce lot.
               */
              for (
                const [
                  profileId,
                  update
                ] of updatesByProfile
              ) {

                const profile =
                  update.profile;

                if (!profile) {
                  continue;
                }

                /*
                 * Fusion avec les anciennes audiences.
                 */
                const merged = {

                  facebook_audience:
                    profile.facebook_audience,

                  instagram_audience:
                    profile.instagram_audience,

                  x_audience:
                    profile.x_audience,

                  youtube_audience:
                    profile.youtube_audience,

                  tiktok_audience:
                    profile.tiktok_audience,

                  ...update.values

                };

                /*
                 * Calcul audience maximale.
                 */
                const maximum =
                  calculateMaximum(
                    merged
                  );

                const values = {

                  ...update.values,

                  audience_max:
                    maximum.max,

                  audience_reseau:
                    maximum.network,

                  audience_updated_at:
                    new Date().toISOString()

                };

                try {

                  await supabasePatch(
                    profileId,
                    values
                  );

                  supabaseUpdates++;

                } catch (error) {

                  console.error(
                    `Supabase erreur profil ${profileId}:`,
                    error.message
                  );
                }
              }

              /*
               * Limitation volontaire :
               * ~100 appels Pulse/minute maximum.
               */
              if (
                batchIndex <
                batches.length - 1
              ) {

                await sleep(
                  BASE_DELAY_MS
                );
              }
            }

            /*
             * Résumé final
             */
            const duration =
              Math.round(
                (Date.now() - startTime) / 1000
              );

            console.log("");
            console.log("========================================");
            console.log("MISE À JOUR TERMINÉE");
            console.log("========================================");

            console.log(
              `Profils : ${profiles.length}`
            );

            console.log(
              `URLs réseaux : ${urlEntries.length}`
            );

            console.log(
              `Lots Pulse : ${batches.length}`
            );

            console.log(
              `Résultats Pulse OK : ${pulseSuccess}`
            );

            console.log(
              `Erreurs Pulse : ${pulseErrors}`
            );

            console.log(
              `Profils Supabase mis à jour : ${supabaseUpdates}`
            );

            console.log(
              `Durée : ${duration}s`
            );

            console.log("========================================");
          }

          main().catch(error => {

            console.error("");
            console.error("========================================");
            console.error("ERREUR FATALE");
            console.error("========================================");
            console.error(error);
            console.error("========================================");

            process.exit(1);
          });

          EOF
