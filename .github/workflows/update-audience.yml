name: Mise à jour audiences réseaux

on:
  schedule:
    - cron: "2,17,32,47 1-5 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:

concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:

  update-audience:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update audiences

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          node <<'EOF'

          const https = require("https");


          // ============================================================
          // CONFIGURATION
          // ============================================================

          const SUPABASE_URL =
            process.env.SUPABASE_URL;

          const SUPABASE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL) {
            throw new Error(
              "SUPABASE_URL manquant"
            );
          }

          if (!SUPABASE_KEY) {
            throw new Error(
              "SUPABASE_SERVICE_ROLE_KEY manquant"
            );
          }


          // Pulse que nous avons déjà testé avec succès
          const PULSE_URL =
            "https://pulse.walls.sh/profile?url=";


          // ------------------------------------------------------------
          // LIMITES
          // ------------------------------------------------------------

          const MAX_CALLS_PER_MINUTE = 120;

          // Environ 100 requêtes/minute
          const PULSE_DELAY_MS = 600;

          // Maximum d'URLs par lancement
          const MAX_URLS_PER_RUN = 1000;

          // Nombre de profils candidats récupérés
          const CANDIDATE_PROFILES = 1500;

          // Retries uniquement pour les erreurs temporaires
          const MAX_RETRIES = 3;

          // Timeout Pulse
          const PULSE_TIMEOUT_MS = 15000;


          // ============================================================
          // OUTILS
          // ============================================================

          function sleep(ms) {

            return new Promise(
              resolve => setTimeout(resolve, ms)
            );

          }


          function normalizeUrl(url) {

            if (!url) {
              return null;
            }

            const value =
              String(url).trim();

            if (!value) {
              return null;
            }

            return value;

          }


          /*
           * Cette fonction sert uniquement à reconnaître
           * deux références vers la même URL.
           *
           * IMPORTANT :
           * plusieurs profils peuvent parfaitement avoir
           * la même URL.
           */

          function urlKey(url) {

            if (!url) {
              return null;
            }


            try {

              const parsed =
                new URL(url.trim());


              parsed.hash = "";


              let pathname =
                parsed.pathname.replace(
                  /\/+$/,
                  ""
                );


              if (!pathname) {
                pathname = "/";
              }


              return (
                parsed.protocol.toLowerCase() +
                "//" +
                parsed.hostname.toLowerCase() +
                pathname +
                (parsed.search || "")
              );

            } catch {

              return url
                .trim()
                .toLowerCase()
                .replace(
                  /\/+$/,
                  ""
                );

            }

          }


          function detectNetwork(url) {

            const value =
              url.toLowerCase();


            if (
              value.includes("facebook.com") ||
              value.includes("fb.com")
            ) {

              return "facebook";

            }


            if (
              value.includes("instagram.com")
            ) {

              return "instagram";

            }


            if (
              value.includes("twitter.com") ||
              value.includes("x.com")
            ) {

              return "x";

            }


            if (
              value.includes("youtube.com") ||
              value.includes("youtu.be")
            ) {

              return "youtube";

            }


            if (
              value.includes("tiktok.com")
            ) {

              return "tiktok";

            }


            return null;

          }


          function audienceColumn(network) {

            return `${network}_audience`;

          }


          // ============================================================
          // SUPABASE REQUEST
          // ============================================================

          function supabaseRequest(
            path,
            options = {}
          ) {

            return new Promise(
              (resolve, reject) => {

                const url =
                  new URL(
                    path,
                    SUPABASE_URL
                  );


                const request =
                  https.request(
                    url,
                    {

                      method:
                        options.method || "GET",

                      headers: {

                        "apikey":
                          SUPABASE_KEY,

                        "Authorization":
                          `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                          "application/json",

                        ...(options.headers || {})

                      }

                    },

                    response => {

                      let body = "";


                      response.on(
                        "data",
                        chunk => {

                          body += chunk;

                        }
                      );


                      response.on(
                        "end",
                        () => {

                          let data = null;


                          try {

                            data =
                              body
                                ? JSON.parse(body)
                                : null;

                          } catch {

                            data = body;

                          }


                          if (
                            response.statusCode >= 200 &&
                            response.statusCode < 300
                          ) {

                            resolve({

                              status:
                                response.statusCode,

                              data

                            });

                          } else {

                            reject(
                              new Error(
                                `Supabase HTTP ${response.statusCode}: ${body}`
                              )
                            );

                          }

                        }
                      );

                    }

                  );


                request.on(
                  "error",
                  reject
                );


                if (options.body) {

                  request.write(
                    options.body
                  );

                }


                request.end();

              }
            );

          }


          // ============================================================
          // PULSE
          // ============================================================

          async function pulseRequest(
            socialUrl
          ) {

            const requestUrl =
              PULSE_URL +
              encodeURIComponent(
                socialUrl
              );


            let lastError = null;


            for (
              let attempt = 1;
              attempt <= MAX_RETRIES;
              attempt++
            ) {

              try {

                const body =
                  await new Promise(
                    (resolve, reject) => {

                      const request =
                        https.get(
                          requestUrl,
                          {

                            headers: {

                              "User-Agent":
                                "Avant-Garde-Audience-Updater/1.0",

                              "Accept":
                                "application/json,text/plain,*/*"

                            }

                          },

                          response => {

                            let data = "";


                            response.on(
                              "data",
                              chunk => {

                                data += chunk;

                              }
                            );


                            response.on(
                              "end",
                              () => {

                                const status =
                                  response.statusCode;


                                /*
                                 * 429 :
                                 * on abandonne immédiatement.
                                 *
                                 * Pas de Retry-After :
                                 * on ne veut plus bloquer le workflow.
                                 */

                                if (
                                  status === 429
                                ) {

                                  const error =
                                    new Error(
                                      "Pulse HTTP 429"
                                    );

                                  error.status =
                                    429;

                                  reject(error);

                                  return;

                                }


                                /*
                                 * 422 :
                                 * erreur de lecture de la page,
                                 * notamment possible avec Instagram.
                                 */

                                if (
                                  status === 422
                                ) {

                                  const error =
                                    new Error(
                                      "Pulse HTTP 422"
                                    );

                                  error.status =
                                    422;

                                  reject(error);

                                  return;

                                }


                                /*
                                 * 400 / 404 :
                                 * URL non exploitable.
                                 */

                                if (
                                  status === 400 ||
                                  status === 404
                                ) {

                                  const error =
                                    new Error(
                                      `Pulse HTTP ${status}`
                                    );

                                  error.status =
                                    status;

                                  reject(error);

                                  return;

                                }


                                /*
                                 * Autres erreurs HTTP.
                                 */

                                if (
                                  status < 200 ||
                                  status >= 300
                                ) {

                                  const error =
                                    new Error(
                                      `Pulse HTTP ${status}`
                                    );

                                  error.status =
                                    status;

                                  reject(error);

                                  return;

                                }


                                resolve(data);

                              }
                            );

                          }

                        );


                      request.setTimeout(
                        PULSE_TIMEOUT_MS,
                        () => {

                          const error =
                            new Error(
                              "Pulse timeout"
                            );

                          error.status =
                            0;

                          request.destroy(
                            error
                          );

                        }
                      );


                      request.on(
                        "error",
                        reject
                      );

                    }
                  );


                return parsePulseAudience(
                  body
                );


              } catch (error) {

                lastError =
                  error;


                /*
                 * Ces erreurs ne sont pas retryées.
                 */

                if (
                  error.status === 429 ||
                  error.status === 422 ||
                  error.status === 400 ||
                  error.status === 404
                ) {

                  throw error;

                }


                /*
                 * Les erreurs réseau, timeout et 5xx
                 * peuvent être temporaires.
                 */

                console.log(
                  `      Tentative ${attempt}/${MAX_RETRIES} : ${error.message}`
                );


                if (
                  attempt < MAX_RETRIES
                ) {

                  await sleep(
                    1500 * attempt
                  );

                }

              }

            }


            throw lastError;

          }


          // ============================================================
          // EXTRACTION FOLLOWERS
          // ============================================================

          function parsePulseAudience(
            body
          ) {

            let data = null;


            try {

              data =
                JSON.parse(body);

            } catch {

              data = null;

            }


            function numberValue(
              value
            ) {

              if (
                typeof value === "number" &&
                Number.isFinite(value)
              ) {

                return Math.round(
                  value
                );

              }


              if (
                typeof value === "string"
              ) {

                const cleaned =
                  value.replace(
                    /[^\d]/g,
                    ""
                  );


                if (cleaned) {

                  return Number(
                    cleaned
                  );

                }

              }


              return null;

            }


            if (data) {

              const candidates = [

                data.followers,
                data.followerCount,
                data.followersCount,
                data.subscribers,
                data.subscriberCount,
                data.audience,
                data.count,

                data.data?.followers,
                data.data?.followerCount,
                data.data?.followersCount,
                data.data?.subscribers,
                data.data?.subscriberCount,
                data.data?.audience,
                data.data?.count,

                data.profile?.followers,
                data.profile?.followerCount,
                data.profile?.followersCount,
                data.profile?.subscribers,
                data.profile?.subscriberCount

              ];


              for (
                const candidate
                of candidates
              ) {

                const number =
                  numberValue(
                    candidate
                  );


                if (
                  number !== null &&
                  number >= 0
                ) {

                  return number;

                }

              }

            }


            const text =
              String(body);


            const patterns = [

              /"followers"\s*:\s*([0-9]+)/i,

              /"followerCount"\s*:\s*([0-9]+)/i,

              /"followersCount"\s*:\s*([0-9]+)/i,

              /"subscribers"\s*:\s*([0-9]+)/i,

              /"subscriberCount"\s*:\s*([0-9]+)/i,

              /"audience"\s*:\s*([0-9]+)/i,

              /"count"\s*:\s*([0-9]+)/i

            ];


            for (
              const pattern
              of patterns
            ) {

              const match =
                text.match(
                  pattern
                );


              if (match) {

                const number =
                  Number(
                    match[1]
                  );


                if (
                  Number.isFinite(number)
                ) {

                  return number;

                }

              }

            }


            throw new Error(
              "Audience introuvable dans la réponse Pulse"
            );

          }


          // ============================================================
          // RÉCUPÉRATION DES PROFILS
          // ============================================================

          async function getProfiles() {

            const fields = [

              "id",
              "nom",

              "facebook_url",
              "instagram_url",
              "x_url",
              "youtube_url",
              "tiktok_url",

              "facebook_audience",
              "instagram_audience",
              "x_audience",
              "youtube_audience",
              "tiktok_audience",

              "audience_max",
              "audience_reseau",
              "audience_updated_at"

            ].join(",");


            const path =
              `${SUPABASE_URL}/rest/v1/profiles` +
              `?select=${encodeURIComponent(fields)}` +
              `&order=audience_updated_at.asc.nullsfirst,id.asc` +
              `&limit=${CANDIDATE_PROFILES}`;


            const result =
              await supabaseRequest(
                path
              );


            return result.data || [];

          }


          // ============================================================
          // CALCUL MAXIMUM
          // ============================================================

          function calculateAudience(
            profile
          ) {

            const networks = [

              {
                name: "facebook",
                value:
                  profile.facebook_audience
              },

              {
                name: "instagram",
                value:
                  profile.instagram_audience
              },

              {
                name: "x",
                value:
                  profile.x_audience
              },

              {
                name: "youtube",
                value:
                  profile.youtube_audience
              },

              {
                name: "tiktok",
                value:
                  profile.tiktok_audience
              }

            ];


            let max = 0;

            let network = null;


            for (
              const item
              of networks
            ) {

              const value =
                Number(
                  item.value
                );


              if (
                Number.isFinite(value) &&
                value > max
              ) {

                max =
                  value;

                network =
                  item.name;

              }

            }


            return {
              max,
              network
            };

          }


          // ============================================================
          // UPDATE SUPABASE
          // ============================================================

          async function updateProfile(
            profileId,
            values
          ) {

            /*
             * MÉCANISME D'ORIGINE CONSERVÉ.
             *
             * On passe toujours par le RPC
             * update_profile_audiences.
             */

            const path =
              `${SUPABASE_URL}/rest/v1/rpc/update_profile_audiences`;


            await supabaseRequest(
              path,
              {

                method: "POST",

                headers: {

                  "Prefer":
                    "return=minimal"

                },

                body:
                  JSON.stringify({

                    p_profile_id:
                      profileId,

                    p_facebook_audience:
                      values.facebook_audience ?? null,

                    p_instagram_audience:
                      values.instagram_audience ?? null,

                    p_x_audience:
                      values.x_audience ?? null,

                    p_youtube_audience:
                      values.youtube_audience ?? null,

                    p_tiktok_audience:
                      values.tiktok_audience ?? null,

                    p_audience_max:
                      values.audience_max ?? null,

                    p_audience_reseau:
                      values.audience_reseau ?? null,

                    p_audience_updated_at:
                      values.audience_updated_at ?? null

                  })

              }
            );

          }


          // ============================================================
          // MAIN
          // ============================================================

          async function main() {

            const startedAt =
              Date.now();


            console.log("");

            console.log(
              "========================================"
            );

            console.log(
              "AVANT-GARDE — UPDATE AUDIENCE"
            );

            console.log(
              "========================================"
            );

            console.log(
              `Limite Pulse : ${MAX_CALLS_PER_MINUTE}/min`
            );

            console.log(
              `Budget URLs : ${MAX_URLS_PER_RUN}`
            );


            // ----------------------------------------------------------
            // PROFILS
            // ----------------------------------------------------------

            const profiles =
              await getProfiles();


            console.log(
              `Profils candidats : ${profiles.length}`
            );


            if (!profiles.length) {

              console.log(
                "Aucun profil à traiter."
              );

              return;

            }


            // ----------------------------------------------------------
            // CONSTRUCTION DES ENTRÉES
            // ----------------------------------------------------------

            const entries = [];


            for (
              const profile
              of profiles
            ) {

              const networks = [

                {
                  network: "facebook",
                  url:
                    profile.facebook_url
                },

                {
                  network: "instagram",
                  url:
                    profile.instagram_url
                },

                {
                  network: "x",
                  url:
                    profile.x_url
                },

                {
                  network: "youtube",
                  url:
                    profile.youtube_url
                },

                {
                  network: "tiktok",
                  url:
                    profile.tiktok_url
                }

              ];


              for (
                const item
                of networks
              ) {

                const url =
                  normalizeUrl(
                    item.url
                  );


                if (!url) {
                  continue;
                }


                const detected =
                  detectNetwork(
                    url
                  );


                if (!detected) {
                  continue;
                }


                entries.push({

                  profileId:
                    profile.id,

                  network:
                    detected,

                  url,

                  urlKey:
                    urlKey(url)

                });


                /*
                 * Budget = nombre de références sociales
                 * sélectionnées.
                 */

                if (
                  entries.length >=
                  MAX_URLS_PER_RUN
                ) {

                  break;

                }

              }


              if (
                entries.length >=
                MAX_URLS_PER_RUN
              ) {

                break;

              }

            }


            console.log(
              `URLs sélectionnées : ${entries.length}`
            );


            if (!entries.length) {

              console.log(
                "Aucune URL sociale exploitable."
              );

              return;

            }


            // ----------------------------------------------------------
            // PROFILS PAR ID
            // ----------------------------------------------------------

            const profileMap =
              new Map();


            for (
              const profile
              of profiles
            ) {

              profileMap.set(
                profile.id,
                profile
              );

            }


            // ----------------------------------------------------------
            // DÉDOUBLONNAGE GLOBAL DES URLS
            // ----------------------------------------------------------

            /*
             * Une URL identique peut appartenir à plusieurs profils.
             *
             * Exemple :
             *
             * Profil A → x.com/FranceInsoumise
             * Profil B → x.com/FranceInsoumise
             *
             * Pulse n'est appelé qu'une fois.
             * Le résultat sera ensuite appliqué aux deux profils.
             */

            const urlGroups =
              new Map();


            for (
              const entry
              of entries
            ) {

              if (
                !urlGroups.has(
                  entry.urlKey
                )
              ) {

                urlGroups.set(
                  entry.urlKey,
                  {

                    url:
                      entry.url,

                    network:
                      entry.network,

                    entries:
                      []

                  }
                );

              }


              urlGroups
                .get(
                  entry.urlKey
                )
                .entries
                .push(
                  entry
                );

            }


            const uniqueUrls =
              Array.from(
                urlGroups.values()
              );


            const duplicateCount =
              entries.length -
              uniqueUrls.length;


            console.log(
              `URLs Pulse distinctes : ${uniqueUrls.length}`
            );

            console.log(
              `URLs partagées économisées : ${duplicateCount}`
            );


            // ----------------------------------------------------------
            // RÉSULTATS PULSE
            // ----------------------------------------------------------

            const pulseResults =
              new Map();


            let pulseOK = 0;

            let pulseErrors = 0;


            // ----------------------------------------------------------
            // INTERROGATION PULSE
            // ----------------------------------------------------------

            for (
              let index = 0;
              index < uniqueUrls.length;
              index++
            ) {

              const group =
                uniqueUrls[index];


              console.log("");

              console.log(
                `[Pulse ${index + 1}/${uniqueUrls.length}] [${group.network}] ${group.url}`
              );


              try {

                const audience =
                  await pulseRequest(
                    group.url
                  );


                console.log(
                  `  → ${audience}`
                );


                pulseResults.set(
                  group.urlKey,
                  {

                    success:
                      true,

                    audience

                  }
                );


                pulseOK++;

              } catch (error) {

                console.log(
                  `  → ERREUR : ${error.message}`
                );


                pulseResults.set(
                  group.urlKey,
                  {

                    success:
                      false,

                    error:
                      error.message

                  }
                );


                pulseErrors++;

              }


              /*
               * Pause uniquement entre deux URLs DISTINCTES.
               */

              if (
                index <
                uniqueUrls.length - 1
              ) {

                await sleep(
                  PULSE_DELAY_MS
                );

              }

            }


            // ----------------------------------------------------------
            // PRÉPARATION DES UPDATES
            // ----------------------------------------------------------

            const profileUpdates =
              new Map();


            for (
              const profile
              of profiles
            ) {

              profileUpdates.set(
                profile.id,
                {

                  profile,

                  values: {},

                  successCount:
                    0

                }
              );

            }


            // ----------------------------------------------------------
            // DISTRIBUTION DES RÉSULTATS
            // ----------------------------------------------------------

            for (
              const group
              of uniqueUrls
            ) {

              const result =
                pulseResults.get(
                  group.urlKey
                );


              /*
               * Une URL Pulse en erreur ne modifie
               * aucun profil.
               */

              if (
                !result ||
                !result.success
              ) {

                continue;

              }


              /*
               * Si plusieurs profils utilisent cette URL,
               * chacun reçoit le résultat.
               */

              for (
                const entry
                of group.entries
              ) {

                const state =
                  profileUpdates.get(
                    entry.profileId
                  );


                if (!state) {
                  continue;
                }


                const column =
                  audienceColumn(
                    entry.network
                  );


                state.values[column] =
                  result.audience;


                state.successCount++;

              }

            }


            // ----------------------------------------------------------
            // ÉCRITURE SUPABASE
            // ----------------------------------------------------------

            for (
              const state
              of profileUpdates.values()
            ) {

              const profile =
                state.profile;


              /*
               * Comme dans le principe du workflow d'origine :
               *
               * si aucune audience n'a été récupérée,
               * on ne touche pas au profil.
               */

              if (
                state.successCount === 0
              ) {

                continue;

              }


              console.log("");

              console.log(
                `----- ${profile.nom || profile.id} -----`
              );


              /*
               * On remet les anciennes audiences dans l'objet
               * puis on remplace uniquement celles qui viennent
               * d'être récupérées.
               */

              const updatedProfile = {

                ...profile,

                ...state.values

              };


              // --------------------------------------------------------
              // CALCUL MAXIMUM
              // --------------------------------------------------------

              const calculated =
                calculateAudience(
                  updatedProfile
                );


              state.values.audience_max =
                calculated.max;


              state.values.audience_reseau =
                calculated.network;


              // --------------------------------------------------------
              // DATE DE MISE À JOUR
              // --------------------------------------------------------

              state.values.audience_updated_at =
                new Date()
                  .toISOString();


              for (
                const [key, value]
                of Object.entries(
                  state.values
                )
              ) {

                console.log(
                  `  ${key} → ${value}`
                );

              }


              // --------------------------------------------------------
              // RPC SUPABASE
              // --------------------------------------------------------

              try {

                await updateProfile(
                  profile.id,
                  {

                    facebook_audience:
                      state.values.facebook_audience ??
                      profile.facebook_audience,

                    instagram_audience:
                      state.values.instagram_audience ??
                      profile.instagram_audience,

                    x_audience:
                      state.values.x_audience ??
                      profile.x_audience,

                    youtube_audience:
                      state.values.youtube_audience ??
                      profile.youtube_audience,

                    tiktok_audience:
                      state.values.tiktok_audience ??
                      profile.tiktok_audience,

                    audience_max:
                      state.values.audience_max,

                    audience_reseau:
                      state.values.audience_reseau,

                    audience_updated_at:
                      state.values.audience_updated_at

                  }
                );


                console.log(
                  "  ✓ Supabase mis à jour"
                );

              } catch (error) {

                console.log(
                  `  ✗ Erreur Supabase : ${error.message}`
                );

                continue;

              }

            }


            // ----------------------------------------------------------
            // COMPTAGE DES PROFILS EFFECTIVEMENT ÉCRITS
            // ----------------------------------------------------------

            /*
             * On recompte les profils ayant au moins un succès.
             * L'appel RPC ci-dessus est le véritable indicateur
             * de l'écriture ; ce compteur reste informatif.
             */

            let profilesUpdated = 0;


            for (
              const state
              of profileUpdates.values()
            ) {

              if (
                state.successCount > 0
              ) {

                profilesUpdated++;

              }

            }


            // ============================================================
            // RAPPORT
