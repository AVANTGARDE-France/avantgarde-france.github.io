name: Mise à jour audiences réseaux

on:
  schedule:
    - cron: "2,17,32,47 1-5 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:

  update-audience:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update audiences

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          node <<'EOF'

          const https = require("https");


          // ============================================================
          // CONFIGURATION
          // ============================================================

          const SUPABASE_URL =
            process.env.SUPABASE_URL;

          const SUPABASE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;


          if (!SUPABASE_URL) {

            throw new Error(
              "SUPABASE_URL manquant"
            );

          }


          if (!SUPABASE_KEY) {

            throw new Error(
              "SUPABASE_SERVICE_ROLE_KEY manquant"
            );

          }


          // Pulse
          const PULSE_URL =
            "https://pulse.walls.sh/profile?url=";


          // ------------------------------------------------------------
          // LIMITES
          // ------------------------------------------------------------

          const MAX_CALLS_PER_MINUTE = 120;

          const PULSE_DELAY_MS = 600;

          const MAX_URLS_PER_RUN = 1000;

          const CANDIDATE_PROFILES = 1500;

          const MAX_RETRIES = 3;

          const PULSE_TIMEOUT_MS = 15000;


          // ============================================================
          // OUTILS
          // ============================================================

          function sleep(ms) {

            return new Promise(
              resolve => setTimeout(resolve, ms)
            );

          }


          function normalizeUrl(url) {

            if (!url) {

              return null;

            }


            const value =
              String(url).trim();


            if (!value) {

              return null;

            }


            return value;

          }


          function normalizeUrlKey(url) {

            return normalizeUrl(url);

          }


          function detectNetwork(url) {

            const value =
              url.toLowerCase();


            if (
              value.includes("facebook.com") ||
              value.includes("fb.com")
            ) {

              return "facebook";

            }


            if (
              value.includes("instagram.com")
            ) {

              return "instagram";

            }


            if (
              value.includes("twitter.com") ||
              value.includes("x.com")
            ) {

              return "x";

            }


            if (
              value.includes("youtube.com") ||
              value.includes("youtu.be")
            ) {

              return "youtube";

            }


            if (
              value.includes("tiktok.com")
            ) {

              return "tiktok";

            }


            return null;

          }


          function audienceColumn(network) {

            return `${network}_audience`;

          }


          // ============================================================
          // SUPABASE REQUEST
          // ============================================================

          function supabaseRequest(
            path,
            options = {}
          ) {

            return new Promise(
              (resolve, reject) => {

                const url =
                  new URL(
                    path,
                    SUPABASE_URL
                  );


                const request =
                  https.request(
                    url,
                    {

                      method:
                        options.method || "GET",

                      headers: {

                        "apikey":
                          SUPABASE_KEY,

                        "Authorization":
                          `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                          "application/json",

                        ...(options.headers || {})

                      }

                    },

                    response => {

                      let body = "";


                      response.on(
                        "data",
                        chunk => {

                          body += chunk;

                        }
                      );


                      response.on(
                        "end",
                        () => {

                          let data = null;


                          try {

                            data =
                              body
                                ? JSON.parse(body)
                                : null;

                          } catch {

                            data = body;

                          }


                          if (
                            response.statusCode >= 200 &&
                            response.statusCode < 300
                          ) {

                            resolve({

                              status:
                                response.statusCode,

                              data

                            });

                          } else {

                            reject(
                              new Error(
                                `Supabase HTTP ${response.statusCode}: ${body}`
                              )
                            );

                          }

                        }
                      );

                    }
                  );


                request.on(
                  "error",
                  reject
                );


                if (options.body) {

                  request.write(
                    options.body
                  );

                }


                request.end();

              }
            );

          }


          // ============================================================
          // PULSE
          // ============================================================

          async function pulseRequest(
            socialUrl
          ) {

            const requestUrl =
              PULSE_URL +
              encodeURIComponent(
                socialUrl
              );


            let lastError = null;


            for (
              let attempt = 1;
              attempt <= MAX_RETRIES;
              attempt++
            ) {

              try {

                const body =
                  await new Promise(
                    (resolve, reject) => {

                      const request =
                        https.get(
                          requestUrl,
                          {

                            headers: {

                              "User-Agent":
                                "Avant-Garde-Audience-Updater/1.0",

                              "Accept":
                                "application/json,text/plain,*/*"

                            }

                          },

                          response => {

                            let data = "";


                            response.on(
                              "data",
                              chunk => {

                                data += chunk;

                              }
                            );


                            response.on(
                              "end",
                              () => {

                                if (
                                  response.statusCode < 200 ||
                                  response.statusCode >= 300
                                ) {

                                  const error =
                                    new Error(
                                      `Pulse HTTP ${response.statusCode}`
                                    );

                                  error.statusCode =
                                    response.statusCode;

                                  reject(error);

                                  return;

                                }


                                resolve(data);

                              }
                            );

                          }
                        );


                      request.setTimeout(
                        PULSE_TIMEOUT_MS,
                        () => {

                          request.destroy(
                            new Error(
                              "Pulse timeout"
                            )
                          );

                        }
                      );


                      request.on(
                        "error",
                        reject
                      );

                    }
                  );


                return parsePulseAudience(
                  body
                );


              } catch (error) {

                lastError = error;


                /*
                 * 429 et 422 :
                 *
                 * inutile de refaire immédiatement la même requête.
                 *
                 * Pulse vient déjà de répondre.
                 */

                if (
                  error.statusCode === 429 ||
                  error.statusCode === 422 ||
                  error.statusCode === 400 ||
                  error.statusCode === 404
                ) {

                  throw error;

                }


                console.log(
                  `      Tentative ${attempt}/${MAX_RETRIES} : ${error.message}`
                );


                if (
                  attempt < MAX_RETRIES
                ) {

                  await sleep(
                    1500 * attempt
                  );

                }

              }

            }


            throw lastError;

          }


          // ============================================================
          // EXTRACTION FOLLOWERS
          // ============================================================

          function parsePulseAudience(
            body
          ) {

            let data = null;


            try {

              data =
                JSON.parse(body);

            } catch {

              data = null;

            }


            function numberValue(
              value
            ) {

              if (
                typeof value === "number" &&
                Number.isFinite(value)
              ) {

                return Math.round(
                  value
                );

              }


              if (
                typeof value === "string"
              ) {

                const cleaned =
                  value.replace(
                    /[^\d]/g,
                    ""
                  );


                if (cleaned) {

                  return Number(
                    cleaned
                  );

                }

              }


              return null;

            }


            if (data) {

              const candidates = [

                data.followers,
                data.followerCount,
                data.followersCount,
                data.subscribers,
                data.subscriberCount,
                data.audience,
                data.count,

                data.data?.followers,
                data.data?.followerCount,
                data.data?.followersCount,
                data.data?.subscribers,
                data.data?.subscriberCount,
                data.data?.audience,
                data.data?.count,

                data.profile?.followers,
                data.profile?.followerCount,
                data.profile?.followersCount,
                data.profile?.subscribers,
                data.profile?.subscriberCount

              ];


              for (
                const candidate
                of candidates
              ) {

                const number =
                  numberValue(
                    candidate
                  );


                if (
                  number !== null &&
                  number >= 0
                ) {

                  return number;

                }

              }

            }


            const text =
              String(body);


            const patterns = [

              /"followers"\s*:\s*([0-9]+)/i,

              /"followerCount"\s*:\s*([0-9]+)/i,

              /"followersCount"\s*:\s*([0-9]+)/i,

              /"subscribers"\s*:\s*([0-9]+)/i,

              /"subscriberCount"\s*:\s*([0-9]+)/i,

              /"audience"\s*:\s*([0-9]+)/i,

              /"count"\s*:\s*([0-9]+)/i

            ];


            for (
              const pattern
              of patterns
            ) {

              const match =
                text.match(
                  pattern
                );


              if (match) {

                const number =
                  Number(
                    match[1]
                  );


                if (
                  Number.isFinite(number)
                ) {

                  return number;

                }

              }

            }


            throw new Error(
              "Audience introuvable dans la réponse Pulse"
            );

          }


          // ============================================================
          // RÉCUPÉRATION DES PROFILS
          // ============================================================

          async function getProfiles() {

            /*
             * IMPORTANT :
             *
             * La colonne est "nom", PAS "name".
             */

            const fields = [

              "id",
              "nom",

              "facebook_url",
              "instagram_url",
              "x_url",
              "youtube_url",
              "tiktok_url",

              "facebook_audience",
              "instagram_audience",
              "x_audience",
              "youtube_audience",
              "tiktok_audience",

              "audience_max",
              "audience_reseau",
              "audience_updated_at"

            ].join(",");


            const path =
              `${SUPABASE_URL}/rest/v1/profiles` +
              `?select=${encodeURIComponent(fields)}` +
              `&order=audience_updated_at.asc.nullsfirst,id.asc` +
              `&limit=${CANDIDATE_PROFILES}`;


            const result =
              await supabaseRequest(
                path
              );


            return result.data || [];

          }


          // ============================================================
          // CALCUL MAXIMUM
          // ============================================================

          function calculateAudience(
            profile
          ) {

            const networks = [

              {
                name: "facebook",
                value:
                  profile.facebook_audience
              },

              {
                name: "instagram",
                value:
                  profile.instagram_audience
              },

              {
                name: "x",
                value:
                  profile.x_audience
              },

              {
                name: "youtube",
                value:
                  profile.youtube_audience
              },

              {
                name: "tiktok",
                value:
                  profile.tiktok_audience
              }

            ];


            let max = 0;

            let network = null;


            for (
              const item
              of networks
            ) {

              const value =
                Number(
                  item.value
                );


              if (
                Number.isFinite(value) &&
                value > max
              ) {

                max = value;

                network =
                  item.name;

              }

            }


            return {

              max,

              network

            };

          }


          // ============================================================
          // UPDATE SUPABASE
          // ============================================================

          async function updateProfile(
            profileId,
            values
          ) {

            /*
             * IMPORTANT :
             *
             * On conserve exactement le principe
             * du système qui fonctionnait :
             *
             * RPC dédiée :
             *
             * public.update_profile_audiences(...)
             */

            const path =
              `${SUPABASE_URL}/rest/v1/rpc/update_profile_audiences`;


            await supabaseRequest(
              path,
              {

                method: "POST",

                headers: {

                  "Prefer":
                    "return=minimal"

                },

                body:
                  JSON.stringify({

                    p_profile_id:
                      profileId,

                    p_facebook_audience:
                      values.facebook_audience ?? null,

                    p_instagram_audience:
                      values.instagram_audience ?? null,

                    p_x_audience:
                      values.x_audience ?? null,

                    p_youtube_audience:
                      values.youtube_audience ?? null,

                    p_tiktok_audience:
                      values.tiktok_audience ?? null,

                    p_audience_max:
                      values.audience_max ?? null,

                    p_audience_reseau:
                      values.audience_reseau ?? null,

                    p_audience_updated_at:
                      values.audience_updated_at ?? null

                  })

              }
            );

          }


          // ============================================================
          // MAIN
          // ============================================================

          async function main() {

            const startedAt =
              Date.now();


            console.log("");

            console.log(
              "========================================"
            );

            console.log(
              "AVANT-GARDE — UPDATE AUDIENCE"
            );

            console.log(
              "========================================"
            );

            console.log(
              `Limite Pulse : ${MAX_CALLS_PER_MINUTE}/min`
            );

            console.log(
              `Budget URLs : ${MAX_URLS_PER_RUN}`
            );


            // ----------------------------------------------------------
            // PROFILS
            // ----------------------------------------------------------

            const profiles =
              await getProfiles();


            console.log(
              `Profils candidats : ${profiles.length}`
            );


            if (!profiles.length) {

              console.log(
                "Aucun profil à traiter."
              );

              return;

            }


            // ----------------------------------------------------------
            // CONSTRUCTION DES ENTRÉES
            // ----------------------------------------------------------

            const entries = [];


            for (
              const profile
              of profiles
            ) {

              const networks = [

                {
                  network: "facebook",
                  url:
                    profile.facebook_url
                },

                {
                  network: "instagram",
                  url:
                    profile.instagram_url
                },

                {
                  network: "x",
                  url:
                    profile.x_url
                },

                {
                  network: "youtube",
                  url:
                    profile.youtube_url
                },

                {
                  network: "tiktok",
                  url:
                    profile.tiktok_url
                }

              ];


              const profileEntries = [];


              for (
                const item
                of networks
              ) {

                const url =
                  normalizeUrl(
                    item.url
                  );


                if (!url) {

                  continue;

                }


                const detected =
                  detectNetwork(
                    url
                  );


                if (!detected) {

                  continue;

                }


                profileEntries.push({

                  profile,

                  network:
                    detected,

                  url

                });

              }


              /*
               * On garde toujours tous les réseaux
               * d'un même profil.
               */

              if (
                entries.length +
                profileEntries.length
                <= MAX_URLS_PER_RUN
              ) {

                entries.push(
                  ...profileEntries
                );

              } else {

                break;

              }

            }


            console.log(
              `URLs sélectionnées : ${entries.length}`
            );


            if (!entries.length) {

              console.log(
                "Aucune URL sociale exploitable."
              );

              return;

            }


            // ----------------------------------------------------------
            // CACHE PULSE
            // ----------------------------------------------------------

            /*
             * Une URL identique ne doit être interrogée
             * qu'une seule fois pendant ce lancement.
             *
             * Exemple :
             *
             * Profil A → instagram.com/avantgarde
             * Profil B → instagram.com/avantgarde
             *
             * Pulse n'est appelé qu'une seule fois.
             *
             * Le résultat — succès OU erreur — est mémorisé.
             */

            const pulseCache =
              new Map();


            const uniqueUrls =
              new Set(
                entries.map(
                  entry =>
                    normalizeUrlKey(
                      entry.url
                    )
                )
              );


            console.log(
              `URLs Pulse distinctes : ${uniqueUrls.size}`
            );


            console.log(
              `URLs partagées économisées : ${entries.length - uniqueUrls.size}`
            );


            // ----------------------------------------------------------
            // STATISTIQUES
            // ----------------------------------------------------------

            let pulseOK = 0;

            let pulseErrors = 0;

            let profilesUpdated = 0;


            // ----------------------------------------------------------
            // TRAITEMENT DES PROFILS
            // ----------------------------------------------------------

            /*
             * On revient volontairement à une logique très simple :
             *
             * profil
             *   ↓
             * réseau
             *   ↓
             * cache Pulse
             *   ↓
             * mise à jour du profil
             *
             * Pas de seconde phase de distribution.
             */

            const processedProfiles =
              new Set();


            for (
              const profile
              of profiles
            ) {

              const profileEntries =
                entries.filter(
                  entry =>
                    entry.profile.id === profile.id
                );


              if (!profileEntries.length) {

                continue;

              }


              console.log("");

              console.log(
                `----- ${profile.nom || profile.id} -----`
              );


              const updates = {};

              let profileHadSuccess =
                false;


              for (
                const entry
                of profileEntries
              ) {

                const urlKey =
                  normalizeUrlKey(
                    entry.url
                  );


                console.log(
                  `[${entry.network}] ${entry.url}`
                );


                // ------------------------------------------------------
                // URL DÉJÀ DANS LE CACHE
                // ------------------------------------------------------

                if (
                  pulseCache.has(
                    urlKey
                  )
                ) {

                  const cached =
                    pulseCache.get(
                      urlKey
                    );


                  if (
                    cached.success
                  ) {

                    const audience =
                      cached.audience;


                    console.log(
                      `  → ${audience} (cache)`
                    );


                    const column =
                      audienceColumn(
                        entry.network
                      );


                    updates[column] =
                      audience;


                    /*
                     * Mise à jour de l'objet local
                     * pour recalculer audience_max.
                     */

                    profile[column] =
                      audience;


                    profileHadSuccess =
                      true;

                  } else {

                    console.log(
                      `  → ERREUR (cache) : ${cached.error}`
                    );

                  }


                  continue;

                }


                // ------------------------------------------------------
                // NOUVELLE URL → PULSE
                // ------------------------------------------------------

                try {

                  const audience =
                    await pulseRequest(
                      entry.url
                    );


                  console.log(
                    `  → ${audience}`
                  );


                  pulseCache.set(
                    urlKey,
                    {

                      success: true,

                      audience

                    }
                  );


                  const column =
                    audienceColumn(
                      entry.network
                    );


                  updates[column] =
                    audience;


                  /*
                   * Mise à jour de l'objet local
                   * pour recalculer audience_max.
                   */

                  profile[column] =
                    audience;


                  pulseOK++;

                  profileHadSuccess =
                    true;


                } catch (error) {

                  pulseCache.set(
                    urlKey,
                    {

                      success: false,

                      error:
                        error.message

                    }
                  );


                  pulseErrors++;


                  console.log(
                    `  → ERREUR : ${error.message}`
                  );

                }


                /*
                 * ≈ 100 requêtes/minute.
                 *
                 * Le délai n'est appliqué qu'après
                 * une véritable requête Pulse.
                 */

                await sleep(
                  PULSE_DELAY_MS
                );

              }


              // --------------------------------------------------------
              // ÉCRITURE SUPABASE
              // --------------------------------------------------------

              if (
                profileHadSuccess
              ) {

                const calculated =
                  calculateAudience(
                    profile
                  );


                updates.audience_max =
                  calculated.max;


                updates.audience_reseau =
                  calculated.network;


                /*
                 * CURSEUR DE ROTATION
                 *
                 * Le profil vient d'être traité.
                 * Il repart donc en fin de file.
                 */

                updates.audience_updated_at =
                  new Date()
                    .toISOString();


                try {

                  await updateProfile(
                    profile.id,
                    updates
                  );


                  profilesUpdated++;

                  processedProfiles.add(
                    profile.id
                  );


                  console.log(
                    "  ✓ Supabase mis à jour"
                  );


                } catch (error) {

                  console.log(
                    `  ✗ Erreur Supabase : ${error.message}`
                  );

                }

              } else {

                console.log(
                  "  → Aucun succès Pulse pour ce profil : Supabase non modifié."
                );

              }

            }


            // ============================================================
            // RAPPORT
            // ============================================================

            const duration =
              Math.round(
                (Date.now() - startedAt) /
                1000
              );


            console.log("");

            console.log(
              "========================================"
            );

            console.log(
              "MISE À JOUR TERMINÉE"
            );

            console.log(
              "========================================"
            );

            console.log(
              `Profils candidats : ${profiles.length}`
            );

            console.log(
              `Profils traités : ${processedProfiles.size}`
            );

            console.log(
              `URLs sélectionnées : ${entries.length}`
            );

            console.log(
              `URLs Pulse distinctes : ${uniqueUrls.size}`
            );

            console.log(
              `URLs partagées économisées : ${entries.length - uniqueUrls.size}`
            );

            console.log(
              `Pulse OK : ${pulseOK}`
            );

            console.log(
              `Pulse erreurs : ${pulseErrors}`
            );

            console.log(
              `Profils Supabase mis à jour : ${profilesUpdated}`
            );

            console.log(
              `Durée : ${duration}s`
            );

            console.log(
              "========================================"
            );

          }


          // ============================================================
          // LANCEMENT
          // ============================================================

          main()
            .catch(
              error => {

                console.error("");

                console.error(
                  "========================================"
                );

                console.error(
                  "ERREUR FATALE"
                );

                console.error(
                  "========================================"
                );

                console.error(
                  error
                );

                console.error(
                  "========================================"
                );

                process.exit(1);

              }
            );

          EOF
