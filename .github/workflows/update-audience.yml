name: Mise à jour audiences réseaux

on:
  schedule:
    # 10 lancements entre 01h07 et 05h37
    # On évite pile le début de l'heure pour limiter les retards GitHub
    - cron: "7,37 1-5 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:

concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:
  update-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Mise à jour des audiences
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          node <<'EOF'

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_SERVICE_ROLE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL) {
            throw new Error("SUPABASE_URL manquant");
          }

          if (!SUPABASE_SERVICE_ROLE_KEY) {
            throw new Error("SUPABASE_SERVICE_ROLE_KEY manquant");
          }

          // ============================================================
          // CONFIGURATION
          // ============================================================

          const PULSE_URL =
            "https://pulse.walls.sh/profile/batch";

          // Pulse : on reste volontairement sous la limite supposée
          const MAX_CALLS_PER_MINUTE = 100;

          // 50 URLs maximum par appel Pulse
          const PULSE_BATCH_SIZE = 50;

          // 400 appels maximum par lancement
          //
          // 400 x 50 = 20 000 URLs maximum
          //
          // Avec 5 réseaux par profil :
          // 20 000 / 5 = 4 000 profils par lancement
          //
          // 10 lancements = jusqu'à ~40 000 profils/nuit
          const MAX_PULSE_CALLS_PER_RUN = 400;

          // 100 appels/minute => 600 ms
          const BASE_DELAY_MS = 600;

          // Taille de la sélection Supabase
          //
          // On récupère davantage de profils que nécessaire pour
          // pouvoir filtrer ceux qui possèdent réellement un réseau.
          const CANDIDATE_LIMIT = 1000;

          // ============================================================
          // OUTILS
          // ============================================================

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          const supabaseHeaders = {
            "apikey": SUPABASE_SERVICE_ROLE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`,
            "Content-Type": "application/json"
          };

          // ============================================================
          // SUPABASE GET
          // ============================================================

          async function supabaseGet(path) {

            const response = await fetch(
              `${SUPABASE_URL}/rest/v1/${path}`,
              {
                method: "GET",
                headers: {
                  ...supabaseHeaders,
                  "Accept": "application/json"
                }
              }
            );

            if (!response.ok) {

              const text = await response.text();

              throw new Error(
                `Supabase GET ${response.status}: ${text}`
              );
            }

            return response.json();
          }

          // ============================================================
          // SUPABASE PATCH
          // ============================================================

          async function supabasePatch(id, values) {

            const response = await fetch(
              `${SUPABASE_URL}/rest/v1/profiles?id=eq.${encodeURIComponent(id)}`,
              {
                method: "PATCH",

                headers: {
                  ...supabaseHeaders,
                  "Prefer": "return=minimal"
                },

                body: JSON.stringify(values)
              }
            );

            if (!response.ok) {

              const text = await response.text();

              throw new Error(
                `Supabase PATCH ${response.status}: ${text}`
              );
            }
          }

          // ============================================================
          // RÉCUPÉRATION DES PROFILS À TRAITER
          // ============================================================
          //
          // PRIORITÉ :
          //
          // 1. audience_updated_at NULL
          //    => nouveaux profils jamais traités
          //
          // 2. profils les plus anciens
          //
          // Ainsi, les profils tournent automatiquement.
          //
          // ============================================================

          async function getProfilesToProcess() {

            const fields = [
              "id",
              "nom",

              "facebook_url",
              "instagram_url",
              "x_url",
              "youtube_url",
              "tiktok_url",

              "facebook_audience",
              "instagram_audience",
              "x_audience",
              "youtube_audience",
              "tiktok_audience",

              "audience_max",
              "audience_reseau",
              "audience_updated_at"
            ].join(",");

            const path =
              `profiles?select=${fields}` +
              `&order=audience_updated_at.asc.nullsfirst,id.asc` +
              `&limit=${CANDIDATE_LIMIT}`;

            const candidates = await supabaseGet(path);

            console.log(
              `Profils candidats récupérés : ${candidates.length}`
            );

            // ----------------------------------------------------------
            // On ne garde que les profils possédant au moins
            // un réseau social.
            // ----------------------------------------------------------

            const profiles = candidates.filter(profile => {

              return [
                profile.facebook_url,
                profile.instagram_url,
                profile.x_url,
                profile.youtube_url,
                profile.tiktok_url
              ].some(
                url =>
                  typeof url === "string" &&
                  url.trim() !== ""
              );

            });

            console.log(
              `Profils avec au moins un réseau : ${profiles.length}`
            );

            return profiles;
          }

          // ============================================================
          // CHOIX DU CHAMP SUPABASE
          // ============================================================

          function audienceField(platform) {

            switch (platform) {

              case "facebook":
                return "facebook_audience";

              case "instagram":
                return "instagram_audience";

              case "x":
              case "twitter":
                return "x_audience";

              case "youtube":
                return "youtube_audience";

              case "tiktok":
                return "tiktok_audience";

              default:
                return null;
            }
          }

          // ============================================================
          // NORMALISATION FOLLOWERS
          // ============================================================

          function normalizeFollowers(value) {

            if (
              value === null ||
              value === undefined ||
              value === ""
            ) {
              return null;
            }

            const number = Number(value);

            if (
              !Number.isFinite(number) ||
              number < 0
            ) {
              return null;
            }

            return Math.round(number);
          }

          // ============================================================
          // ERREURS QUI AUTORISENT UNE SUPPRESSION
          // ============================================================
          //
          // IMPORTANT :
          //
          // Une erreur temporaire NE SUPPRIME PAS l'ancien nombre.
          //
          // On efface uniquement lorsqu'on a une indication
          // explicite que le compte n'existe plus.
          //
          // ============================================================

          function shouldClearAudience(item) {

            if (!item || !item.error) {
              return false;
            }

            const error =
              String(item.error).toLowerCase();

            return [
              "not_found",
              "deleted",
              "suspended"
            ].includes(error);
          }

          // ============================================================
          // CALCUL DU MAXIMUM
          // ============================================================

          function calculateMaximum(profile) {

            const values = [

              {
                network: "Facebook",
                value: profile.facebook_audience
              },

              {
                network: "Instagram",
                value: profile.instagram_audience
              },

              {
                network: "X",
                value: profile.x_audience
              },

              {
                network: "YouTube",
                value: profile.youtube_audience
              },

              {
                network: "TikTok",
                value: profile.tiktok_audience
              }

            ];

            const valid = values
              .filter(
                x =>
                  Number.isFinite(Number(x.value))
              )
              .map(
                x => ({
                  network: x.network,
                  value: Number(x.value)
                })
              );

            if (!valid.length) {

              return {
                max: null,
                network: null
              };
            }

            valid.sort(
              (a, b) => b.value - a.value
            );

            return {
              max: valid[0].value,
              network: valid[0].network
            };
          }

          // ============================================================
          // APPEL PULSE
          // ============================================================

          async function pulseBatch(urls, attempt = 1) {

            const params = new URLSearchParams();

            for (const url of urls) {
              params.append("url", url);
            }

            const response = await fetch(
              `${PULSE_URL}?${params.toString()}`,
              {
                method: "GET",

                headers: {
                  "Accept": "application/json",

                  "User-Agent":
                    "Avant-Garde-Audience-Bot/1.0"
                }
              }
            );

            // ----------------------------------------------------------
            // RATE LIMIT
            // ----------------------------------------------------------

            if (response.status === 429) {

              if (attempt >= 5) {

                throw new Error(
                  "Pulse : trop de 429 après 5 tentatives"
                );
              }

              const retryAfter =
                Number(
                  response.headers.get("Retry-After")
                ) || 10;

              console.log(
                `Pulse 429 → attente ${retryAfter}s`
              );

              await sleep(
                (retryAfter + 1) * 1000
              );

              return pulseBatch(
                urls,
                attempt + 1
              );
            }

            // ----------------------------------------------------------
            // ERREURS SERVEUR
            // ----------------------------------------------------------

            if (
              [500, 502, 503, 504]
                .includes(response.status)
            ) {

              if (attempt >= 5) {

                throw new Error(
                  `Pulse ${response.status} après 5 tentatives`
                );
              }

              const delay =
                Math.min(
                  30000,
                  2000 * attempt
                );

              console.log(
                `Pulse ${response.status} → retry dans ${delay}ms`
              );

              await sleep(delay);

              return pulseBatch(
                urls,
                attempt + 1
              );
            }

            // ----------------------------------------------------------
            // AUTRE ERREUR HTTP
            // ----------------------------------------------------------

            const text =
              await response.text();

            if (!response.ok) {

              throw new Error(
                `Pulse HTTP ${response.status}: ${text}`
              );
            }

            // ----------------------------------------------------------
            // JSON
            // ----------------------------------------------------------

            let data;

            try {

              data = JSON.parse(text);

            } catch {

              throw new Error(
                "Pulse réponse JSON invalide : " +
                text.slice(0, 500)
              );
            }

            // ----------------------------------------------------------
            // FORMATS ACCEPTÉS
            // ----------------------------------------------------------

            if (Array.isArray(data)) {
              return data;
            }

            if (Array.isArray(data.results)) {
              return data.results;
            }

            if (Array.isArray(data.profiles)) {
              return data.profiles;
            }

            throw new Error(
              "Format Pulse inattendu"
            );
          }

          // ============================================================
          // MAIN
          // ============================================================

          async function main() {

            console.log("");
            console.log(
              "========================================"
            );
            console.log(
              "AVANT-GARDE — UPDATE AUDIENCE ROTATIF"
            );
            console.log(
              "========================================"
            );
            console.log("");

            const startTime = Date.now();

            // ----------------------------------------------------------
            // 1. PROFILS
            // ----------------------------------------------------------

            const profiles =
              await getProfilesToProcess();

            console.log("");

            if (!profiles.length) {

              console.log(
                "Aucun profil à traiter."
              );

              console.log(
                "========================================"
              );

              return;
            }

            console.log(
              `PROFILS SÉLECTIONNÉS : ${profiles.length}`
            );

            // ----------------------------------------------------------
            // 2. CONSTRUCTION DES URLS
            // ----------------------------------------------------------

            const urlEntries = [];

            for (const profile of profiles) {

              const networks = [

                [
                  "facebook",
                  profile.facebook_url
                ],

                [
                  "instagram",
                  profile.instagram_url
                ],

                [
                  "x",
                  profile.x_url
                ],

                [
                  "youtube",
                  profile.youtube_url
                ],

                [
                  "tiktok",
                  profile.tiktok_url
                ]

              ];

              for (
                const [network, url]
                of networks
              ) {

                if (
                  typeof url !== "string" ||
                  !url.trim()
                ) {
                  continue;
                }

                urlEntries.push({

                  profileId: profile.id,

                  profileName:
                    profile.nom,

                  network,

                  url:
                    url.trim()
                });
              }
            }

            console.log(
              `URLS RÉSEAUX DISPONIBLES : ${urlEntries.length}`
            );

            // ----------------------------------------------------------
            // 3. LIMITATION DU TRAVAIL PAR LANCEMENT
            // ----------------------------------------------------------

            const maxUrlsThisRun =
              MAX_PULSE_CALLS_PER_RUN *
              PULSE_BATCH_SIZE;

            const selectedUrls =
              urlEntries.slice(
                0,
                maxUrlsThisRun
              );

            console.log(
              `URLS TRAITÉES CE LANCEMENT : ${selectedUrls.length}`
            );

            // ----------------------------------------------------------
            // 4. LOTS DE 50
            // ----------------------------------------------------------

            const batches = [];

            for (
              let i = 0;
              i < selectedUrls.length;
              i += PULSE_BATCH_SIZE
            ) {

              batches.push(
                selectedUrls.slice(
                  i,
                  i + PULSE_BATCH_SIZE
                )
              );
            }

            console.log(
              `LOTS PULSE : ${batches.length}`
            );

            // ----------------------------------------------------------
            // 5. STATISTIQUES
            // ----------------------------------------------------------

            let pulseSuccess = 0;
            let pulseErrors = 0;
            let supabaseUpdates = 0;

            // ----------------------------------------------------------
            // 6. TRAITEMENT DES LOTS
            // ----------------------------------------------------------

            for (
              let batchIndex = 0;
              batchIndex < batches.length;
              batchIndex++
            ) {

              const batch =
                batches[batchIndex];

              console.log("");

              console.log(
                `----- LOT ${batchIndex + 1}/${batches.length} -----`
              );

              console.log(
                `URLs : ${batch.length}`
              );

              const urls =
                batch.map(
                  item => item.url
                );

              let results;

              try {

                results =
                  await pulseBatch(urls);

              } catch (error) {

                console.error(
                  "ERREUR PULSE :",
                  error.message
                );

                pulseErrors +=
                  batch.length;

                await sleep(
                  BASE_DELAY_MS
                );

                continue;
              }

              // --------------------------------------------------------
              // MAP DES RÉSULTATS
              // --------------------------------------------------------

              const resultMap =
                new Map();

              for (
                const result of results
              ) {

                if (
                  result &&
                  typeof result.url === "string"
                ) {

                  resultMap.set(
                    result.url,
                    result
                  );
                }
              }

              // --------------------------------------------------------
              // UPDATES PAR PROFIL
              // --------------------------------------------------------

              const updatesByProfile =
                new Map();

              for (
                const entry of batch
              ) {

                const result =
                  resultMap.get(
                    entry.url
                  );

                // ------------------------------------------------------
                // PAS DE RÉSULTAT
                // ------------------------------------------------------

                if (!result) {

                  console.log(
                    `Aucun résultat Pulse : ${entry.url}`
                  );

                  pulseErrors++;

                  continue;
                }

                // ------------------------------------------------------
                // CHAMP SUPABASE
                // ------------------------------------------------------

                const field =
                  audienceField(
                    result.platform ||
                    entry.network
                  );

                if (!field) {

                  console.log(
                    `Plateforme inconnue : ${result.platform}`
                  );

                  pulseErrors++;

                  continue;
                }

                // ------------------------------------------------------
                // ERREUR PULSE
                // ------------------------------------------------------

                if (result.error) {

                  console.log(
                    `[${entry.network}] ${entry.profileName} → ${result.error}`
                  );

                  if (
                    shouldClearAudience(result)
                  ) {

                    if (
                      !updatesByProfile.has(
                        entry.profileId
                      )
                    ) {

                      updatesByProfile.set(
                        entry.profileId,
                        {
                          profile:
                            profiles.find(
                              p =>
                                p.id ===
                                entry.profileId
                            ),

                          values: {}
                        }
                      );
                    }

                    updatesByProfile
                      .get(
                        entry.profileId
                      )
                      .values[field] = null;
                  }

                  pulseErrors++;

                  continue;
                }

                // ------------------------------------------------------
                // FOLLOWERS
                // ------------------------------------------------------

                const followers =
                  normalizeFollowers(
                    result.followers
                  );

                if (
                  followers === null
                ) {

                  console.log(
                    `[${entry.network}] ${entry.profileName} → followers absent`
                  );

                  pulseErrors++;

                  continue;
                }

                console.log(
                  `[${entry.network}] ${entry.profileName} → ${followers}`
                );

                if (
                  !updatesByProfile.has(
                    entry.profileId
                  )
                ) {

                  updatesByProfile.set(
                    entry.profileId,
                    {
                      profile:
                        profiles.find(
                          p =>
                            p.id ===
                            entry.profileId
                        ),

                      values: {}
                    }
                  );
                }

                updatesByProfile
                  .get(
                    entry.profileId
                  )
                  .values[field] =
                    followers;

                pulseSuccess++;
              }

              // --------------------------------------------------------
              // 7. ÉCRITURE SUPABASE
              // --------------------------------------------------------

              for (
                const [
                  profileId,
                  update
                ]
                of updatesByProfile
              ) {

                const profile =
                  update.profile;

                if (!profile) {
                  continue;
                }

                // ------------------------------------------------------
                // Fusion ancienne + nouvelle valeur
                // ------------------------------------------------------

                const merged = {

                  facebook_audience:
                    profile.facebook_audience,

                  instagram_audience:
                    profile.instagram_audience,

                  x_audience:
                    profile.x_audience,

                  youtube_audience:
                    profile.youtube_audience,

                  tiktok_audience:
                    profile.tiktok_audience,

                  ...update.values
                };

                // ------------------------------------------------------
                // MAXIMUM
                // ------------------------------------------------------

                const maximum =
                  calculateMaximum(
                    merged
                  );

                // ------------------------------------------------------
                // DONNÉES À ÉCRIRE
                // ------------------------------------------------------

                const values = {

                  ...update.values,

                  audience_max:
                    maximum.max,

                  audience_reseau:
                    maximum.network,

                  audience_updated_at:
                    new Date().toISOString()
                };

                try {

                  await supabasePatch(
                    profileId,
                    values
                  );

                  supabaseUpdates++;

                } catch (error) {

                  console.error(
                    `Supabase erreur profil ${profileId}:`,
                    error.message
                  );
                }
              }

              // --------------------------------------------------------
              // PAUSE ENTRE LOTS
              // --------------------------------------------------------

              if (
                batchIndex <
                batches.length - 1
              ) {

                await sleep(
                  BASE_DELAY_MS
                );
              }
            }

            // ----------------------------------------------------------
            // 8. FIN
            // ----------------------------------------------------------

            const duration =
              Math.round(
                (Date.now() - startTime) /
                1000
              );

            console.log("");

            console.log(
              "========================================"
            );

            console.log(
              "MISE À JOUR TERMINÉE"
            );

            console.log(
              "========================================"
            );

            console.log(
              `Profils candidats : ${profiles.length}`
            );

            console.log(
              `URLs disponibles : ${urlEntries.length}`
            );

            console.log(
              `URLs traitées : ${selectedUrls.length}`
            );

            console.log(
              `Lots Pulse : ${batches.length}`
            );

            console.log(
              `Résultats Pulse OK : ${pulseSuccess}`
            );

            console.log(
              `Erreurs Pulse : ${pulseErrors}`
            );

            console.log(
              `Profils Supabase mis à jour : ${supabaseUpdates}`
            );

            console.log(
              `Durée : ${duration}s`
            );

            console.log(
              "========================================"
            );

          }

          // ============================================================
          // LANCEMENT
          // ============================================================

          main().catch(error => {

            console.error("");

            console.error(
              "========================================"
            );

            console.error(
              "ERREUR FATALE"
            );

            console.error(
              "========================================"
            );

            console.error(error);

            console.error(
              "========================================"
            );

            process.exit(1);
          });

          EOF
