name: Mise à jour audiences réseaux

on:
  schedule:
    # 20 passages entre 01h00 et 05h47
    - cron: "2,17,32,47 1-5 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:

concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:

  update-audience:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update audiences

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          node <<'EOF'

          const https = require("https");


          // ============================================================
          // CONFIGURATION
          // ============================================================

          const SUPABASE_URL =
            process.env.SUPABASE_URL;

          const SUPABASE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL) {
            throw new Error(
              "SUPABASE_URL manquant"
            );
          }

          if (!SUPABASE_KEY) {
            throw new Error(
              "SUPABASE_SERVICE_ROLE_KEY manquant"
            );
          }


          // Pulse
          const PULSE_URL =
            "https://pulse.walls.sh/profile?url=";


          // ------------------------------------------------------------
          // LIMITES
          // ------------------------------------------------------------

          /*
           * Pulse autorise actuellement 120 appels/minute
           * sur le niveau gratuit.
           *
           * On vise volontairement une cadence inférieure
           * pour garder une marge.
           */

          const MAX_CALLS_PER_MINUTE = 120;

          const PULSE_DELAY_MS = 700;


          /*
           * Maximum d'URLs distinctes pouvant être traitées
           * par lancement.
           */

          const MAX_URLS_PER_RUN = 1000;


          /*
           * Nombre de profils candidats récupérés dans Supabase.
           */

          const CANDIDATE_PROFILES = 1500;


          /*
           * Nombre maximum de tentatives pour les erreurs
           * réellement récupérables.
           */

          const MAX_RETRIES = 3;


          /*
           * Timeout d'une requête Pulse.
           */

          const PULSE_TIMEOUT_MS = 15000;


          /*
           * Attente minimale avant retry réseau / 502.
           */

          const RETRY_BASE_DELAY_MS = 2000;


          /*
           * Sécurité supplémentaire après un 429 lorsque
           * Pulse ne fournit pas de Retry-After exploitable.
           */

          const RATE_LIMIT_FALLBACK_MS = 10000;


          // ============================================================
          // OUTILS
          // ============================================================

          function sleep(ms) {

            return new Promise(
              resolve => setTimeout(resolve, ms)
            );

          }


          function normalizeUrl(url) {

            if (!url) {
              return null;
            }

            const value =
              String(url).trim();

            if (!value) {
              return null;
            }

            return value;

          }


          /*
           * Normalisation destinée à identifier deux fois la même URL.
           *
           * IMPORTANT :
           *
           * Cela ne modifie PAS l'URL enregistrée dans Supabase.
           *
           * Cela sert uniquement à éviter d'interroger Pulse deux fois
           * lorsque plusieurs profils utilisent exactement le même
           * compte social.
           */

          function urlKey(url) {

            if (!url) {
              return null;
            }

            try {

              const parsed =
                new URL(url.trim());

              parsed.hash = "";

              /*
               * Les URLs de profils n'ont normalement pas besoin
               * de slash final pour être distinguées.
               */

              let pathname =
                parsed.pathname.replace(
                  /\/+$/,
                  ""
                );

              if (!pathname) {
                pathname = "/";
              }

              return (
                parsed.protocol.toLowerCase() +
                "//" +
                parsed.hostname.toLowerCase() +
                pathname +
                (parsed.search || "")
              );

            } catch {

              return url
                .trim()
                .toLowerCase()
                .replace(/\/+$/, "");

            }

          }


          function detectNetwork(url) {

            const value =
              url.toLowerCase();

            if (
              value.includes("facebook.com") ||
              value.includes("fb.com")
            ) {

              return "facebook";

            }


            if (
              value.includes("instagram.com")
            ) {

              return "instagram";

            }


            if (
              value.includes("twitter.com") ||
              value.includes("x.com")
            ) {

              return "x";

            }


            if (
              value.includes("youtube.com") ||
              value.includes("youtu.be")
            ) {

              return "youtube";

            }


            if (
              value.includes("tiktok.com")
            ) {

              return "tiktok";

            }


            return null;

          }


          function audienceColumn(network) {

            return `${network}_audience`;

          }


          // ============================================================
          // SUPABASE REQUEST
          // ============================================================

          function supabaseRequest(
            path,
            options = {}
          ) {

            return new Promise(
              (resolve, reject) => {

                const url =
                  new URL(
                    path,
                    SUPABASE_URL
                  );


                const request =
                  https.request(
                    url,
                    {

                      method:
                        options.method || "GET",

                      headers: {

                        "apikey":
                          SUPABASE_KEY,

                        "Authorization":
                          `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                          "application/json",

                        ...(options.headers || {})

                      }

                    },

                    response => {

                      let body = "";

                      response.on(
                        "data",
                        chunk => {

                          body += chunk;

                        }
                      );


                      response.on(
                        "end",
                        () => {

                          let data = null;


                          try {

                            data =
                              body
                                ? JSON.parse(body)
                                : null;

                          } catch {

                            data = body;

                          }


                          if (
                            response.statusCode >= 200 &&
                            response.statusCode < 300
                          ) {

                            resolve({

                              status:
                                response.statusCode,

                              data

                            });

                          } else {

                            reject(
                              new Error(
                                `Supabase HTTP ${response.statusCode}: ${body}`
                              )
                            );

                          }

                        }
                      );

                    }

                  );


                request.on(
                  "error",
                  reject
                );


                if (options.body) {

                  request.write(
                    options.body
                  );

                }


                request.end();

              }
            );

          }


          // ============================================================
          // PULSE — ANALYSE DES HEADERS
          // ============================================================

          function getHeader(
            headers,
            name
          ) {

            if (!headers) {
              return null;
            }


            const value =
              headers[name.toLowerCase()];


            if (
              Array.isArray(value)
            ) {

              return value[0];

            }


            return value ?? null;

          }


          function retryAfterMs(
            headers
          ) {

            const retryAfter =
              getHeader(
                headers,
                "retry-after"
              );


            if (retryAfter) {

              const seconds =
                Number(
                  retryAfter
                );


              if (
                Number.isFinite(seconds) &&
                seconds >= 0
              ) {

                return (
                  Math.ceil(seconds * 1000) +
                  500
                );

              }


              const date =
                Date.parse(
                  retryAfter
                );


              if (
                Number.isFinite(date)
              ) {

                const delay =
                  date -
                  Date.now() +
                  500;


                if (delay > 0) {
                  return delay;
                }

              }

            }


            const reset =
              getHeader(
                headers,
                "ratelimit-reset"
              );


            if (reset) {

              const seconds =
                Number(
                  reset
                );


              if (
                Number.isFinite(seconds) &&
                seconds >= 0
              ) {

                return (
                  Math.ceil(seconds * 1000) +
                  1000
                );

              }

            }


            return RATE_LIMIT_FALLBACK_MS;

          }


          // ============================================================
          // PULSE
          // ============================================================

          async function pulseRequest(
            socialUrl
          ) {

            const requestUrl =
              PULSE_URL +
              encodeURIComponent(
                socialUrl
              );


            let lastError = null;


            for (
              let attempt = 1;
              attempt <= MAX_RETRIES;
              attempt++
            ) {

              try {

                const result =
                  await new Promise(
                    (resolve, reject) => {

                      const request =
                        https.get(
                          requestUrl,
                          {

                            headers: {

                              "User-Agent":
                                "Avant-Garde-Audience-Updater/1.0",

                              "Accept":
                                "application/json,text/plain,*/*"

                            }

                          },

                          response => {

                            let data = "";

                            response.on(
                              "data",
                              chunk => {

                                data += chunk;

                              }
                            );


                            response.on(
                              "end",
                              () => {

                                const status =
                                  response.statusCode;


                                /*
                                 * SUCCÈS
                                 */

                                if (
                                  status >= 200 &&
                                  status < 300
                                ) {

                                  resolve({

                                    status,

                                    body: data,

                                    headers:
                                      response.headers

                                  });

                                  return;

                                }


                                /*
                                 * ERREUR AVEC INFORMATIONS
                                 * DE RATE LIMIT
                                 */

                                const error =
                                  new Error(
                                    `Pulse HTTP ${status}`
                                  );


                                error.status =
                                  status;


                                error.headers =
                                  response.headers;


                                reject(
                                  error
                                );

                              }
                            );

                          }

                        );


                      request.setTimeout(
                        PULSE_TIMEOUT_MS,
                        () => {

                          const error =
                            new Error(
                              "Pulse timeout"
                            );


                          error.retryable =
                            true;


                          request.destroy(
                            error
                          );

                        }
                      );


                      request.on(
                        "error",
                        reject
                      );

                    }
                  );


                return parsePulseAudience(
                  result.body
                );


              } catch (error) {

                lastError = error;


                const status =
                  error.status;


                /*
                 * ------------------------------------------------------
                 * 422
                 * ------------------------------------------------------
                 *
                 * Instagram login_required notamment.
                 *
                 * Ce n'est PAS une erreur temporaire.
                 *
                 * On ne recommence donc PAS trois fois.
                 */

                if (
                  status === 422
                ) {

                  console.log(
                    `      Pulse ${status} : ${error.message}`
                  );

                  throw error;

                }


                /*
                 * ------------------------------------------------------
                 * 400 / 404
                 * ------------------------------------------------------
                 *
                 * URL invalide, compte supprimé, privé, etc.
                 *
                 * Pas de retry.
                 */

                if (
                  status === 400 ||
                  status === 404
                ) {

                  console.log(
                    `      Pulse ${status} : ${error.message}`
                  );

                  throw error;

                }


                /*
                 * ------------------------------------------------------
                 * 429
                 * ------------------------------------------------------
                 *
                 * On respecte Retry-After / RateLimit-Reset.
                 */

                if (
                  status === 429
                ) {

                  const wait =
                    retryAfterMs(
                      error.headers
                    );


                  console.log(
                    `      Pulse HTTP 429 — attente ${Math.ceil(wait / 1000)}s avant retry`
                  );


                  if (
                    attempt < MAX_RETRIES
                  ) {

                    await sleep(
                      wait
                    );

                    continue;

                  }


                  throw error;

                }


                /*
                 * ------------------------------------------------------
                 * 502 / réseau / timeout
                 * ------------------------------------------------------
                 *
                 * Erreurs susceptibles d'être temporaires.
                 */

                if (
                  attempt < MAX_RETRIES
                ) {

                  const wait =
                    RETRY_BASE_DELAY_MS *
                    attempt;


                  console.log(
                    `      Tentative ${attempt}/${MAX_RETRIES} : ${error.message} — retry dans ${Math.ceil(wait / 1000)}s`
                  );


                  await sleep(
                    wait
                  );


                  continue;

                }

              }

            }


            throw lastError;

          }


          // ============================================================
          // EXTRACTION FOLLOWERS
          // ============================================================

          function parsePulseAudience(
            body
          ) {

            let data = null;


            try {

              data =
                JSON.parse(body);

            } catch {

              data = null;

            }


            function numberValue(
              value
            ) {

              if (
                typeof value === "number" &&
                Number.isFinite(value)
              ) {

                return Math.round(
                  value
                );

              }


              if (
                typeof value === "string"
              ) {

                const cleaned =
                  value.replace(
                    /[^\d]/g,
                    ""
                  );


                if (cleaned) {

                  return Number(
                    cleaned
                  );

                }

              }


              return null;

            }


            if (data) {

              const candidates = [

                data.followers,
                data.followerCount,
                data.followersCount,
                data.subscribers,
                data.subscriberCount,
                data.audience,
                data.count,

                data.data?.followers,
                data.data?.followerCount,
                data.data?.followersCount,
                data.data?.subscribers,
                data.data?.subscriberCount,
                data.data?.audience,
                data.data?.count,

                data.profile?.followers,
                data.profile?.followerCount,
                data.profile?.followersCount,
                data.profile?.subscribers,
                data.profile?.subscriberCount

              ];


              for (
                const candidate
                of candidates
              ) {

                const number =
                  numberValue(
                    candidate
                  );


                if (
                  number !== null &&
                  number >= 0
                ) {

                  return number;

                }

              }

            }


            /*
             * Dernier recours :
             * recherche textuelle.
             */

            const text =
              String(body);


            const patterns = [

              /"followers"\s*:\s*([0-9]+)/i,

              /"followerCount"\s*:\s*([0-9]+)/i,

              /"followersCount"\s*:\s*([0-9]+)/i,

              /"subscribers"\s*:\s*([0-9]+)/i,

              /"subscriberCount"\s*:\s*([0-9]+)/i,

              /"audience"\s*:\s*([0-9]+)/i,

              /"count"\s*:\s*([0-9]+)/i

            ];


            for (
              const pattern
              of patterns
            ) {

              const match =
                text.match(
                  pattern
                );


              if (match) {

                const number =
                  Number(
                    match[1]
                  );


                if (
                  Number.isFinite(number)
                ) {

                  return number;

                }

              }

            }


            throw new Error(
              "Audience introuvable dans la réponse Pulse"
            );

          }


          // ============================================================
          // RÉCUPÉRATION DES PROFILS
          // ============================================================

          async function getProfiles() {

            const fields = [

              "id",
              "nom",

              "facebook_url",
              "instagram_url",
              "x_url",
              "youtube_url",
              "tiktok_url",

              "facebook_audience",
              "instagram_audience",
              "x_audience",
              "youtube_audience",
              "tiktok_audience",

              "audience_max",
              "audience_reseau",
              "audience_updated_at"

            ].join(",");


            const path =
              `${SUPABASE_URL}/rest/v1/profiles` +
              `?select=${encodeURIComponent(fields)}` +
              `&order=audience_updated_at.asc.nullsfirst,id.asc` +
              `&limit=${CANDIDATE_PROFILES}`;


            const result =
              await supabaseRequest(
                path
              );


            return result.data || [];

          }


          // ============================================================
          // CALCUL MAXIMUM
          // ============================================================

          function calculateAudience(
            profile
          ) {

            const networks = [

              {
                name: "facebook",
                value:
                  profile.facebook_audience
              },

              {
                name: "instagram",
                value:
                  profile.instagram_audience
              },

              {
                name: "x",
                value:
                  profile.x_audience
              },

              {
                name: "youtube",
                value:
                  profile.youtube_audience
              },

              {
                name: "tiktok",
                value:
                  profile.tiktok_audience
              }

            ];


            let max = 0;

            let network = null;


            for (
              const item
              of networks
            ) {

              const value =
                Number(
                  item.value
                );


              if (
                Number.isFinite(value) &&
                value > max
              ) {

                max = value;

                network =
                  item.name;

              }

            }


            return {

              max,

              network

            };

          }


          // ============================================================
          // UPDATE SUPABASE
          // ============================================================

          async function updateProfile(
            profileId,
            values
          ) {

            const path =
              `${SUPABASE_URL}/rest/v1/rpc/update_profile_audiences`;


            await supabaseRequest(
              path,
              {

                method:
                  "POST",

                headers: {

                  "Prefer":
                    "return=minimal"

                },

                body:
                  JSON.stringify({

                    p_profile_id:
                      profileId,

                    p_facebook_audience:
                      values.facebook_audience ?? null,

                    p_instagram_audience:
                      values.instagram_audience ?? null,

                    p_x_audience:
                      values.x_audience ?? null,

                    p_youtube_audience:
                      values.youtube_audience ?? null,

                    p_tiktok_audience:
                      values.tiktok_audience ?? null,

                    p_audience_max:
                      values.audience_max ?? null,

                    p_audience_reseau:
                      values.audience_reseau ?? null,

                    p_audience_updated_at:
                      values.audience_updated_at ?? null

                  })

              }

            );

          }


          // ============================================================
          // MAIN
          // ============================================================

          async function main() {

            const startedAt =
              Date.now();


            console.log("");

            console.log(
              "========================================"
            );

            console.log(
              "AVANT-GARDE — UPDATE AUDIENCE"
            );

            console.log(
              "========================================"
            );

            console.log(
              `Limite Pulse : ${MAX_CALLS_PER_MINUTE}/min`
            );

            console.log(
              `Cadence cible : ~${Math.round(60000 / PULSE_DELAY_MS)}/min`
            );

            console.log(
              `Budget URLs distinctes : ${MAX_URLS_PER_RUN}`
            );


            // ----------------------------------------------------------
            // PROFILS
            // ----------------------------------------------------------

            const profiles =
              await getProfiles();


            console.log(
              `Profils candidats : ${profiles.length}`
            );


            if (!profiles.length) {

              console.log(
                "Aucun profil à traiter."
              );

              return;

            }


            // ----------------------------------------------------------
            // CONSTRUCTION DES ENTRÉES
            // ----------------------------------------------------------

            const entries = [];


            for (
              const profile
              of profiles
            ) {

              const networks = [

                {
                  network:
                    "facebook",

                  url:
                    profile.facebook_url

                },

                {
                  network:
                    "instagram",

                  url:
                    profile.instagram_url

                },

                {
                  network:
                    "x",

                  url:
                    profile.x_url

                },

                {
                  network:
                    "youtube",

                  url:
                    profile.youtube_url

                },

                {
                  network:
                    "tiktok",

                  url:
                    profile.tiktok_url

                }

              ];


              const profileEntries = [];


              for (
                const item
                of networks
              ) {

                const url =
                  normalizeUrl(
                    item.url
                  );


                if (!url) {
                  continue;
                }


                const detected =
                  detectNetwork(
                    url
                  );


                if (!detected) {
                  continue;
                }


                profileEntries.push({

                  profile,

                  network:
                    detected,

                  url,

                  urlKey:
                    urlKey(url)

                });

              }


              /*
               * On conserve toujours tous les réseaux
               * d'un même profil.
               *
               * Les doublons entre profils restent parfaitement
               * autorisés.
               */

              if (
                entries.length +
                profileEntries.length
                <= MAX_URLS_PER_RUN
              ) {

                entries.push(
                  ...profileEntries
                );

              } else {

                break;

              }

            }


            console.log(
              `URLs sélectionnées : ${entries.length}`
            );


            if (!entries.length) {

              console.log(
                "Aucune URL sociale exploitable."
              );

              return;

            }


            // ----------------------------------------------------------
            // REGROUPEMENT DES URL
            // ----------------------------------------------------------

            /*
             * Une même URL peut appartenir à plusieurs profils.
             *
             * Exemple :
             *
             * Avant-garde → X = @moncompte
             * Lex          → X = @moncompte
             *
             * Pulse ne doit être appelé qu'une seule fois.
             *
             * Le résultat sera ensuite appliqué aux deux profils.
             */

            const urlGroups =
              new Map();


            for (
              const entry
              of entries
            ) {

              if (
                !urlGroups.has(
                  entry.urlKey
                )
              ) {

                urlGroups.set(
                  entry.urlKey,
                  {

                    url:
                      entry.url,

                    network:
                      entry.network,

                    entries: []

                  }
                );

              }


              urlGroups
                .get(
                  entry.urlKey
                )
                .entries
                .push(
                  entry
                );

            }


            const uniqueUrls =
              Array.from(
                urlGroups.values()
              );


            console.log(
              `URLs Pulse distinctes : ${uniqueUrls.length}`
            );


            const duplicateCount =
              entries.length -
              uniqueUrls.length;


            if (
              duplicateCount > 0
            ) {

              console.log(
                `URLs partagées entre profils : ${duplicateCount}`
              );

            }


            // ----------------------------------------------------------
            // STATISTIQUES
            // ----------------------------------------------------------

            let pulseOK = 0;

            let pulseErrors = 0;

            let profilesUpdated = 0;


            // ----------------------------------------------------------
            // RÉSULTATS PAR URL
            // ----------------------------------------------------------

            /*
             * Les résultats Pulse sont stockés une seule fois
             * puis réutilisés pour tous les profils concernés.
             */

            const pulseResults =
              new Map();


            // ----------------------------------------------------------
            // INTERROGATION PULSE
            // ----------------------------------------------------------

            for (
              let index = 0;
              index < uniqueUrls.length;
              index++
            ) {

              const group =
                uniqueUrls[index];


              console.log("");

              console.log(
                `[Pulse ${index + 1}/${uniqueUrls.length}] [${group.network}] ${group.url}`
              );


              try {

                const audience =
                  await pulseRequest(
                    group.url
                  );


                console.log(
                  `  → ${audience}`
                );


                pulseResults.set(
                  group.urlKey,
                  {

                    success:
                      true,

                    audience

                  }
                );


                pulseOK++;

              } catch (error) {

                pulseErrors++;


                console.log(
                  `  → ERREUR : ${error.message}`
                );


                pulseResults.set(
                  group.urlKey,
                  {

                    success:
                      false,

                    error:
                      error.message,

                    status:
                      error.status || null

                  }
                );

              }


              /*
               * Pause entre deux URLs DISTINCTES.
               *
               * Une URL partagée par 10 profils n'entraîne donc
               * toujours qu'une seule requête Pulse.
               */

              if (
                index <
                uniqueUrls.length - 1
              ) {

                await sleep(
                  PULSE_DELAY_MS
                );

              }

            }


            // ----------------------------------------------------------
            // PRÉPARATION DES MISES À JOUR PAR PROFIL
            // ----------------------------------------------------------

            const profileUpdates =
              new Map();


            for (
              const profile
              of profiles
            ) {

              profileUpdates.set(

                profile.id,

                {

                  profile,

                  updates: {},

                  successCount: 0

                }

              );

            }


            /*
             * On distribue maintenant les résultats Pulse
             * à TOUS les profils qui possèdent l'URL.
             */

            for (
              const group
              of uniqueUrls
            ) {

              const result =
                pulseResults.get(
                  group.urlKey
                );


              if (
                !result ||
                !result.success
              ) {

                continue;

              }


              for (
                const entry
                of group.entries
              ) {

                const state =
                  profileUpdates.get(
                    entry.profile.id
                  );


                if (!state) {
                  continue;
                }


                const column =
                  audienceColumn(
                    entry.network
                  );


                state.updates[column] =
                  result.audience;


                /*
                 * Mise à jour de l'objet local pour permettre
                 * le calcul du nouveau maximum.
                 */

                state.profile[column] =
                  result.audience;


                state.successCount++;

              }

            }


            // ----------------------------------------------------------
            // ÉCRITURE SUPABASE PAR PROFIL
            // ----------------------------------------------------------

            for (
              const state
              of profileUpdates.values()
            ) {

              const profile =
                state.profile;


              /*
               * Un profil n'est considéré comme traité que si
               * au moins une de ses URLs a obtenu un résultat.
               */

              if (
                state.successCount === 0
              ) {

                continue;

              }


              console.log("");

              console.log(
                `----- ${profile.nom || profile.id} -----`
              );


              /*
               * Affichage des résultats réellement appliqués.
               */

              for (
                const [column, value]
                of Object.entries(
                  state.updates
                )
              ) {

                console.log(
                  `  ${column} → ${value}`
                );

              }


              const calculated =
                calculateAudience(
                  profile
                );


              state.updates.audience_max =
                calculated.max;


              state.updates.audience_reseau =
                calculated.network;


              /*
               * Le profil vient d'être traité.
               * Il repart donc en fin de file.
               */

              state.updates.audience_updated_at =
                new Date()
                  .toISOString();


              try {

                await updateProfile(
                  profile.id,
                  state.updates
                );


                profilesUpdated++;


                console.log(
                  "  ✓ Supabase mis à jour"
                );

              } catch (error) {

                console.log(
                  `  ✗ Erreur Supabase : ${error.message}`
                );

              }

            }


            // ============================================================
            // RAPPORT
            // ============================================================

            const duration =
              Math.round(
                (Date.now() - startedAt) /
                1000
              );


            console.log("");

            console.log(
              "========================================"
            );

            console.log(
              "MISE À JOUR TERMINÉE"
            );

            console.log(
              "========================================"
            );

            console.log(
              `Profils candidats : ${profiles.length}`
            );

            console.log(
              `Profils sélectionnés : ${new Set(
                entries.map(
                  entry => entry.profile.id
                )
              ).size}`
            );

            console.log(
              `URLs sélectionnées : ${entries.length}`
            );

            console.log(
              `URLs Pulse distinctes : ${uniqueUrls.length}`
            );

            console.log(
              `URLs partagées économisées : ${duplicateCount}`
            );

            console.log(
              `Pulse OK : ${pulseOK}`
            );

            console.log(
              `Pulse erreurs : ${pulseErrors}`
            );

            console.log(
              `Profils Supabase mis à jour : ${profilesUpdated}`
            );

            console.log(
              `Durée : ${duration}s`
            );

            console.log(
              "========================================"
            );

          }


          // ============================================================
          // LANCEMENT
          // ============================================================

          main()
            .catch(
              error => {

                console.error("");

                console.error(
                  "========================================"
                );

                console.error(
                  "ERREUR FATALE"
                );

                console.error(
                  "========================================"
                );

                console.error(
                  error
                );

                console.error(
                  "========================================"
                );

                process.exit(1);

              }
            );

          EOF

