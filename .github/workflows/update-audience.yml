name: Mise à jour audiences réseaux

on:
  schedule:
    - cron: "2,17,32,47 1-5 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

concurrency:
  group: update-audience
  cancel-in-progress: false

jobs:
  update-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update audiences
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          node <<'EOF'

          const https = require("https");

          console.log("");
          console.log("========================================");
          console.log("AVANT-GARDE — UPDATE AUDIENCE");
          console.log("========================================");
          console.log("");

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_SERVICE_ROLE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL) {
            throw new Error("SUPABASE_URL manquant.");
          }

          if (!SUPABASE_SERVICE_ROLE_KEY) {
            throw new Error("SUPABASE_SERVICE_ROLE_KEY manquant.");
          }

          const PULSE_URL =
            "https://pulse.walls.sh/profile?url=";

          const MAX_CALLS_PER_MINUTE = 120;
          const PULSE_DELAY_MS = 600;

          const MAX_URLS_PER_RUN = 1000;
          const CANDIDATE_PROFILES = 1500;

          const MAX_RETRIES = 3;
          const PULSE_TIMEOUT_MS = 15000;

          console.log(
            `Limite Pulse : ${MAX_CALLS_PER_MINUTE}/min`
          );

          console.log(
            `Budget URLs : ${MAX_URLS_PER_RUN}`
          );

          /*
           * ---------------------------------------------------------
           * UTILITAIRES
           * ---------------------------------------------------------
           */

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          function detectNetwork(url) {
            if (!url) return null;

            const value = String(url).trim().toLowerCase();

            if (
              value.includes("facebook.com") ||
              value.includes("fb.com")
            ) {
              return "facebook";
            }

            if (
              value.includes("instagram.com")
            ) {
              return "instagram";
            }

            if (
              value.includes("twitter.com") ||
              value.includes("x.com")
            ) {
              return "x";
            }

            if (
              value.includes("youtube.com") ||
              value.includes("youtu.be")
            ) {
              return "youtube";
            }

            if (
              value.includes("tiktok.com")
            ) {
              return "tiktok";
            }

            return null;
          }

          function normaliserUrl(url) {
            if (!url) return "";

            return String(url)
              .trim()
              .replace(/\/+$/, "");
          }

          function parsePulseAudience(data) {
            if (!data) return null;

            const candidats = [
              data.followers,
              data.followerCount,
              data.followersCount,
              data.subscribers,
              data.subscriberCount,
              data.audience,
              data.count,

              data.data?.followers,
              data.data?.followerCount,
              data.data?.followersCount,
              data.data?.subscribers,
              data.data?.subscriberCount,
              data.data?.audience,
              data.data?.count,

              data.profile?.followers,
              data.profile?.followerCount,
              data.profile?.followersCount,
              data.profile?.subscribers,
              data.profile?.subscriberCount,
              data.profile?.audience,
              data.profile?.count
            ];

            for (const valeur of candidats) {
              if (
                valeur !== undefined &&
                valeur !== null
              ) {
                const nombre = parseAudienceNumber(valeur);

                if (nombre !== null) {
                  return nombre;
                }
              }
            }

            return null;
          }

          function parseAudienceNumber(value) {
            if (
              typeof value === "number" &&
              Number.isFinite(value) &&
              value >= 0
            ) {
              return Math.round(value);
            }

            if (
              typeof value !== "string"
            ) {
              return null;
            }

            let texte = value.trim();

            if (!texte) {
              return null;
            }

            /*
             * On accepte par exemple :
             * 566
             * 2 000 000
             * 2,000,000
             * 2.000.000
             *
             * On retire tout sauf les chiffres.
             */

            texte = texte.replace(/[^\d]/g, "");

            if (!texte) {
              return null;
            }

            const nombre = Number(texte);

            if (
              !Number.isFinite(nombre) ||
              nombre < 0
            ) {
              return null;
            }

            return Math.round(nombre);
          }

          /*
           * ---------------------------------------------------------
           * REQUÊTES HTTP
           * ---------------------------------------------------------
           */

          function httpsRequest(
            url,
            options = {},
            body = null,
            timeoutMs = 20000
          ) {
            return new Promise((resolve, reject) => {

              const parsed = new URL(url);

              const requestOptions = {
                hostname: parsed.hostname,
                port: parsed.port || 443,
                path:
                  parsed.pathname +
                  parsed.search,
                method: options.method || "GET",
                headers: options.headers || {},
                timeout: timeoutMs
              };

              const req = https.request(
                requestOptions,
                res => {

                  let data = "";

                  res.on(
                    "data",
                    chunk => {
                      data += chunk;
                    }
                  );

                  res.on(
                    "end",
                    () => {

                      resolve({
                        status: res.statusCode,
                        headers: res.headers,
                        body: data
                      });

                    }
                  );

                }
              );

              req.on(
                "timeout",
                () => {
                  req.destroy(
                    new Error(
                      `HTTP timeout après ${timeoutMs} ms`
                    )
                  );
                }
              );

              req.on(
                "error",
                reject
              );

              if (body !== null) {
                req.write(body);
              }

              req.end();
            });
          }

          async function supabaseRequest(
            path,
            options = {}
          ) {

            const url =
              `${SUPABASE_URL}${path}`;

            const headers = {
              "apikey":
                SUPABASE_SERVICE_ROLE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`,

              "Content-Type":
                "application/json",

              ...(options.headers || {})
            };

            const response =
              await httpsRequest(
                url,
                {
                  method:
                    options.method || "GET",
                  headers
                },
                options.body || null,
                30000
              );

            if (
              response.status < 200 ||
              response.status >= 300
            ) {

              throw new Error(
                `Supabase HTTP ${response.status}: ${response.body}`
              );

            }

            if (!response.body) {
              return null;
            }

            try {
              return JSON.parse(
                response.body
              );
            } catch {
              return response.body;
            }
          }

          /*
           * ---------------------------------------------------------
           * PULSE
           * ---------------------------------------------------------
           */

          async function getPulseAudience(url) {

            const encodedUrl =
              encodeURIComponent(url);

            const endpoint =
              `${PULSE_URL}${encodedUrl}`;

            let lastError = null;

            for (
              let attempt = 1;
              attempt <= MAX_RETRIES;
              attempt++
            ) {

              try {

                console.log(
                  `  Tentative ${attempt}/${MAX_RETRIES} : ${url}`
                );

                const response =
                  await httpsRequest(
                    endpoint,
                    {
                      method: "GET",
                      headers: {
                        "Accept":
                          "application/json"
                      }
                    },
                    null,
                    PULSE_TIMEOUT_MS
                  );

                if (
                  response.status < 200 ||
                  response.status >= 300
                ) {

                  throw new Error(
                    `Pulse HTTP ${response.status}`
                  );

                }

                let data;

                try {
                  data =
                    JSON.parse(
                      response.body
                    );
                } catch {

                  throw new Error(
                    "Réponse Pulse invalide."
                  );

                }

                const audience =
                  parsePulseAudience(data);

                if (audience === null) {

                  throw new Error(
                    "Audience introuvable dans la réponse Pulse."
                  );

                }

                return audience;

              } catch (error) {

                lastError = error;

                if (
                  attempt < MAX_RETRIES
                ) {
                  await sleep(
                    PULSE_DELAY_MS
                  );
                }

              }
            }

            throw lastError ||
              new Error(
                "Erreur Pulse inconnue."
              );
          }

          /*
           * ---------------------------------------------------------
           * PROFILS SUPABASE
           * ---------------------------------------------------------
           */

          async function getProfiles() {

            const columns = [
              "id",
              "nom",
              "facebook_url",
              "instagram_url",
              "x_url",
              "youtube_url",
              "tiktok_url",
              "facebook_audience",
              "instagram_audience",
              "x_audience",
              "youtube_audience",
              "tiktok_audience",
              "audience_max",
              "audience_reseau",
              "audience_updated_at"
            ].join(",");

            const path =
              `/rest/v1/profiles` +
              `?select=${encodeURIComponent(columns)}` +
              `&anonyme=eq.false` +
              `&order=audience_updated_at.asc.nullsfirst,id.asc` +
              `&limit=${CANDIDATE_PROFILES}`;

            return await supabaseRequest(
              path
            );
          }

          /*
           * ---------------------------------------------------------
           * MISE À JOUR VIA RPC
           *
           * IMPORTANT :
           * On n'utilise plus PATCH /profiles.
           *
           * Le trigger protect_team_profile_update()
           * autorise la modification lorsque la fonction RPC
           * active le contexte avantgarde.audience_updater.
           * ---------------------------------------------------------
           */

          async function updateProfileAudiences(
            profileId,
            values
          ) {

            const path =
              "/rest/v1/rpc/update_profile_audiences";

            const body = {
              p_profile_id:
                profileId,

              p_facebook_audience:
                values.facebook_audience,

              p_instagram_audience:
                values.instagram_audience,

              p_x_audience:
                values.x_audience,

              p_youtube_audience:
                values.youtube_audience,

              p_tiktok_audience:
                values.tiktok_audience,

              p_audience_max:
                values.audience_max,

              p_audience_reseau:
                values.audience_reseau,

              p_audience_updated_at:
                values.audience_updated_at
            };

            await supabaseRequest(
              path,
              {
                method: "POST",
                headers: {
                  "Prefer":
                    "return=minimal"
                },
                body:
                  JSON.stringify(body)
              }
            );
          }

          /*
           * ---------------------------------------------------------
           * CALCUL AUDIENCE MAX
           * ---------------------------------------------------------
           */

          function calculerAudienceMax(
            profile
          ) {

            const reseaux = [
              {
                nom: "Facebook",
                valeur:
                  Number(
                    profile.facebook_audience || 0
                  )
              },

              {
                nom: "Instagram",
                valeur:
                  Number(
                    profile.instagram_audience || 0
                  )
              },

              {
                nom: "X",
                valeur:
                  Number(
                    profile.x_audience || 0
                  )
              },

              {
                nom: "YouTube",
                valeur:
                  Number(
                    profile.youtube_audience || 0
                  )
              },

              {
                nom: "TikTok",
                valeur:
                  Number(
                    profile.tiktok_audience || 0
                  )
              }
            ];

            reseaux.sort(
              (a, b) =>
                b.valeur - a.valeur
            );

            return {
              max:
                reseaux[0]?.valeur || 0,

              reseau:
                reseaux[0]?.nom || null
            };
          }

          /*
           * ---------------------------------------------------------
           * DÉBUT DU TRAITEMENT
           * ---------------------------------------------------------
           */

          const startTime =
            Date.now();

          const profiles =
            await getProfiles();

          console.log(
            `Profils candidats : ${profiles.length}`
          );

          /*
           * Création de la liste des URLs.
           *
           * Une même URL peut appartenir à plusieurs profils.
           *
           * Exemple :
           *
           * Test → Facebook A
           * Lex  → Facebook A
           *
           * Pulse ne sera appelé qu'une seule fois.
           */

          const entries = [];

          for (const profile of profiles) {

            const reseaux = [
              {
                network: "facebook",
                url:
                  profile.facebook_url
              },

              {
                network: "instagram",
                url:
                  profile.instagram_url
              },

              {
                network: "x",
                url:
                  profile.x_url
              },

              {
                network: "youtube",
                url:
                  profile.youtube_url
              },

              {
                network: "tiktok",
                url:
                  profile.tiktok_url
              }
            ];

            for (const item of reseaux) {

              const url =
                normaliserUrl(item.url);

              if (!url) {
                continue;
              }

              const detected =
                detectNetwork(url);

              if (!detected) {
                console.log(
                  `URL ignorée — réseau inconnu : ${url}`
                );

                continue;
              }

              entries.push({
                profile,
                network: detected,
                url
              });
            }
          }

          /*
           * ---------------------------------------------------------
           * DÉDUPLICATION DES URLs
           * ---------------------------------------------------------
           */

          const uniqueUrls =
            new Map();

          for (const entry of entries) {

            if (
              !uniqueUrls.has(entry.url)
            ) {
              uniqueUrls.set(
                entry.url,
                []
              );
            }

            uniqueUrls
              .get(entry.url)
              .push(entry);
          }

          /*
           * On respecte le budget global.
           */

          const selectedUrls =
            Array.from(
              uniqueUrls.keys()
            ).slice(
              0,
              MAX_URLS_PER_RUN
            );

          console.log(
            `URLs sélectionnées : ${entries.length}`
          );

          console.log(
            `URLs uniques Pulse : ${selectedUrls.length}`
          );

          /*
           * Profils réellement concernés.
           */

          const selectedProfileIds =
            new Set();

          for (const url of selectedUrls) {

            for (
              const entry of
              uniqueUrls.get(url)
            ) {

              selectedProfileIds.add(
                entry.profile.id
              );

            }
          }

          console.log(
            `Profils réellement traités : ${selectedProfileIds.size}`
          );

          /*
           * ---------------------------------------------------------
           * RÉSULTATS PULSE
           * ---------------------------------------------------------
           */

          const pulseResults =
            new Map();

          let pulseOk = 0;
          let pulseErrors = 0;
          let pulseCalls = 0;

          for (
            const url of selectedUrls
          ) {

            const entriesForUrl =
              uniqueUrls.get(url);

            const network =
              entriesForUrl[0]?.network ||
              detectNetwork(url);

            console.log("");
            console.log(
              `[${network}] ${url}`
            );

            pulseCalls++;

            try {

              const audience =
                await getPulseAudience(
                  url
                );

              pulseResults.set(
                url,
                audience
              );

              pulseOk++;

              console.log(
                `  → ${audience}`
              );

            } catch (error) {

              pulseErrors++;

              console.log(
                `  → ERREUR : ${error.message}`
              );

            }

            /*
             * Petite temporisation entre les URLs.
             */

            if (
              pulseCalls <
              selectedUrls.length
            ) {
              await sleep(
                PULSE_DELAY_MS
              );
            }
          }

          /*
           * ---------------------------------------------------------
           * APPLICATION DES RÉSULTATS AUX PROFILS
           * ---------------------------------------------------------
           */

          const profileResults =
            new Map();

          for (const profile of profiles) {

            profileResults.set(
              profile.id,
              {
                facebook_audience:
                  profile.facebook_audience,

                instagram_audience:
                  profile.instagram_audience,

                x_audience:
                  profile.x_audience,

                youtube_audience:
                  profile.youtube_audience,

                tiktok_audience:
                  profile.tiktok_audience,

                audience_max:
                  profile.audience_max,

                audience_reseau:
                  profile.audience_reseau,

                audience_updated_at:
                  profile.audience_updated_at,

                hasUpdate: false
              }
            );
          }

          /*
           * On applique chaque résultat Pulse
           * à TOUS les profils qui utilisent cette URL.
           */

          for (
            const url of selectedUrls
          ) {

            if (
              !pulseResults.has(url)
            ) {
              continue;
            }

            const audience =
              pulseResults.get(url);

            const entriesForUrl =
              uniqueUrls.get(url);

            for (
              const entry of
              entriesForUrl
            ) {

              const result =
                profileResults.get(
                  entry.profile.id
                );

              if (!result) {
                continue;
              }

              switch (entry.network) {

                case "facebook":
                  result.facebook_audience =
                    audience;
                  break;

                case "instagram":
                  result.instagram_audience =
                    audience;
                  break;

                case "x":
                  result.x_audience =
                    audience;
                  break;

                case "youtube":
                  result.youtube_audience =
                    audience;
                  break;

                case "tiktok":
                  result.tiktok_audience =
                    audience;
                  break;
              }

              result.hasUpdate = true;
            }
          }

          /*
           * ---------------------------------------------------------
           * ENREGISTREMENT SUPABASE VIA RPC
           * ---------------------------------------------------------
           */

          let profilesUpdated = 0;
          let profilesErrors = 0;

          for (const profile of profiles) {

            const result =
              profileResults.get(
                profile.id
              );

            if (
              !result ||
              !result.hasUpdate
            ) {
              continue;
            }

            const tempProfile = {
              facebook_audience:
                result.facebook_audience,

              instagram_audience:
                result.instagram_audience,

              x_audience:
                result.x_audience,

              youtube_audience:
                result.youtube_audience,

              tiktok_audience:
                result.tiktok_audience
            };

            const max =
              calculerAudienceMax(
                tempProfile
              );

            result.audience_max =
              max.max;

            result.audience_reseau =
              max.reseau;

            result.audience_updated_at =
              new Date().toISOString();

            console.log("");
            console.log(
              `----- ${profile.nom || profile.id} -----`
            );

            console.log(
              `  Audience max : ${result.audience_max}`
            );

            console.log(
              `  Réseau max : ${result.audience_reseau}`
            );

            try {

              await updateProfileAudiences(
                profile.id,
                result
              );

              profilesUpdated++;

              console.log(
                "  ✓ Profil mis à jour via RPC"
              );

            } catch (error) {

              profilesErrors++;

              console.log(
                `  ✗ Erreur Supabase : ${error.message}`
              );

            }
          }

          /*
           * ---------------------------------------------------------
           * FIN
           * ---------------------------------------------------------
           */

          const duration =
            Math.round(
              (Date.now() - startTime) /
              1000
            );

          console.log("");
          console.log(
            "========================================"
          );
          console.log(
            "MISE À JOUR TERMINÉE"
          );
          console.log(
            "========================================"
          );

          console.log(
            `Profils candidats : ${profiles.length}`
          );

          console.log(
            `Profils traités : ${selectedProfileIds.size}`
          );

          console.log(
            `URLs Pulse uniques : ${selectedUrls.length}`
          );

          console.log(
            `Pulse OK : ${pulseOk}`
          );

          console.log(
            `Pulse erreurs : ${pulseErrors}`
          );

          console.log(
            `Profils Supabase mis à jour : ${profilesUpdated}`
          );

          console.log(
            `Erreurs Supabase : ${profilesErrors}`
          );

          console.log(
            `Durée : ${duration}s`
          );

          console.log(
            "========================================"
          );

          /*
           * Si Pulse fonctionne mais qu'une écriture Supabase
           * échoue, le workflow reste néanmoins visible dans les logs.
           *
           * On fait échouer le workflow uniquement si TOUTES
           * les mises à jour Supabase prévues ont échoué.
           */

          const profilesToUpdate =
            Array.from(
              profileResults.values()
            ).filter(
              result => result.hasUpdate
            ).length;

          if (
            profilesToUpdate > 0 &&
            profilesUpdated === 0
          ) {
            throw new Error(
              "Aucun profil n'a pu être mis à jour dans Supabase."
            );
          }

          EOF
