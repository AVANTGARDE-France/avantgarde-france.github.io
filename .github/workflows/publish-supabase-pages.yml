name: Publication automatique Supabase

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


concurrency:
  group: publication-supabase
  cancel-in-progress: true


permissions:
  contents: write


jobs:

  publish:

    name: Publier les pages Supabase

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v5


      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      - name: Générer les pages HTML
        run: node scripts/publish-supabase-pages.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}


      - name: Publier les modifications
        run: |

          git config user.name "avant-garde-bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifeste.html inspirations.html

          if git diff --cached --quiet; then

            echo "Aucune modification à publier."

            exit 0

          fi

          git commit -m "chore: synchronisation Supabase"

          git push
