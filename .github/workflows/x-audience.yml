name: Mise à jour audience X

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"

jobs:
  update-x:
    runs-on: ubuntu-latest

    steps:

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Mise à jour des audiences X
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          node <<'EOF'

          const SUPABASE_URL =
            process.env.SUPABASE_URL;

          const SUPABASE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;


          async function supabaseFetch(path, options = {}) {

            const response = await fetch(
              SUPABASE_URL + path,
              {
                ...options,

                headers: {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Content-Type": "application/json",

                  ...(options.headers || {})
                }
              }
            );

            const text = await response.text();

            let data;

            try {
              data = text ? JSON.parse(text) : null;
            } catch {
              data = text;
            }

            if (!response.ok) {
              throw new Error(
                `Supabase ${response.status}: ${text}`
              );
            }

            return data;
          }


          function extraireUsername(url) {

            try {

              const u = new URL(url);

              let username =
                u.pathname
                  .split("/")
                  .filter(Boolean)[0];

              if (!username) {
                return null;
              }

              return username
                .replace(/^@/, "")
                .trim();

            } catch {

              return null;

            }
          }


          function nombreValide(nombre) {

            if (
              typeof nombre !== "number" ||
              !Number.isFinite(nombre) ||
              nombre < 0
            ) {
              return null;
            }

            return Math.round(nombre);
          }


          async function recupererProfilX(username) {

            const url =
              "https://pulse.walls.sh/profile?url=" +
              encodeURIComponent(
                "https://x.com/" + username
              );

            console.log(
              "Requête :",
              url
            );


            const response =
              await fetch(
                url,
                {
                  headers: {
                    "Accept": "application/json",
                    "User-Agent":
                      "Avant-Garde-Audience-Bot/1.0"
                  }
                }
              );


            const texte =
              await response.text();


            console.log(
              "HTTP Pulse :",
              response.status
            );


            if (!response.ok) {

              throw new Error(
                `Pulse HTTP ${response.status}: ${texte}`
              );

            }


            let data;

            try {

              data =
                JSON.parse(texte);

            } catch {

              throw new Error(
                "Réponse Pulse non JSON."
              );

            }


            return data;

          }


          function recalculerAudienceMax(profil) {

            const valeurs = [

              {
                reseau: "Facebook",
                valeur: profil.facebook_audience
              },

              {
                reseau: "Instagram",
                valeur: profil.instagram_audience
              },

              {
                reseau: "X",
                valeur: profil.x_audience
              },

              {
                reseau: "YouTube",
                valeur: profil.youtube_audience
              },

              {
                reseau: "TikTok",
                valeur: profil.tiktok_audience
              }

            ].filter(
              x =>
                typeof x.valeur === "number" &&
                Number.isFinite(x.valeur)
            );


            if (!valeurs.length) {

              return {
                audience_max: null,
                audience_reseau: null
              };

            }


            valeurs.sort(
              (a, b) =>
                b.valeur - a.valeur
            );


            return {
              audience_max:
                valeurs[0].valeur,

              audience_reseau:
                valeurs[0].reseau
            };

          }


          (async () => {

            if (
              !SUPABASE_URL ||
              !SUPABASE_KEY
            ) {

              throw new Error(
                "SUPABASE_URL ou SUPABASE_SERVICE_ROLE_KEY manquant."
              );

            }


            console.log(
              "Récupération des profils..."
            );


            const profils =
              await supabaseFetch(
                "/rest/v1/profiles" +
                "?select=id,nom,x_url,facebook_audience,instagram_audience,x_audience,youtube_audience,tiktok_audience" +
                "&x_url=not.is.null"
              );


            console.log(
              "Profils X :",
              profils.length
            );


            for (
              const profil of profils
            ) {

              console.log("");
              console.log(
                "================================"
              );


              console.log(
                "Profil :",
                profil.nom
              );


              console.log(
                "URL :",
                profil.x_url
              );


              const username =
                extraireUsername(
                  profil.x_url
                );


              if (!username) {

                console.log(
                  "Username X impossible à déterminer."
                );

                continue;

              }


              console.log(
                "Username X :",
                username
              );


              try {

                const data =
                  await recupererProfilX(
                    username
                  );


                console.log(
                  "Réponse :",
                  JSON.stringify(
                    data,
                    null,
                    2
                  )
                );


                const audience =
                  nombreValide(
                    data.followers
                  );


                if (
                  audience === null
                ) {

                  console.log(
                    "Audience X non trouvée."
                  );

                  /*
                   * IMPORTANT :
                   * On ne modifie PAS l'ancienne valeur
                   * en cas d'erreur ou de donnée absente.
                   */

                  continue;

                }


                console.log(
                  "Audience X trouvée :",
                  audience
                );


                await supabaseFetch(
                  "/rest/v1/profiles?id=eq." +
                  profil.id,
                  {
                    method: "PATCH",

                    body:
                      JSON.stringify({
                        x_audience:
                          audience,

                        audience_updated_at:
                          new Date()
                            .toISOString()
                      })
                  }
                );


                console.log(
                  "Audience X enregistrée :",
                  audience
                );


                /*
                 * Recalcul de l'audience maximale.
                 */

                const profilActualise =
                  await supabaseFetch(
                    "/rest/v1/profiles" +
                    "?select=facebook_audience,instagram_audience,x_audience,youtube_audience,tiktok_audience" +
                    "&id=eq." +
                    profil.id
                  );


                if (
                  profilActualise.length
                ) {

                  const max =
                    recalculerAudienceMax(
                      profilActualise[0]
                    );


                  await supabaseFetch(
                    "/rest/v1/profiles?id=eq." +
                    profil.id,
                    {
                      method: "PATCH",

                      body:
                        JSON.stringify({
                          audience_max:
                            max.audience_max,

                          audience_reseau:
                            max.audience_reseau
                        })
                    }
                  );


                  console.log(
                    "Audience maximale :",
                    max.audience_max,
                    "(" +
                    max.audience_reseau +
                    ")"
                  );

                }


              } catch (error) {

                console.log(
                  "Erreur X :",
                  error.message
                );

                /*
                 * IMPORTANT :
                 * aucune modification de la valeur
                 * existante en cas d'erreur.
                 */

              }

            }


            console.log("");
            console.log(
              "================================"
            );

            console.log(
              "MISE À JOUR X TERMINÉE"
            );

          })();

          EOF
