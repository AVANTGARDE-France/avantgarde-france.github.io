name: Mise à jour audience TikTok

on:
  workflow_dispatch:

  schedule:
    - cron: "00 4 * * *"

jobs:
  update-tiktok:
    runs-on: ubuntu-latest

    steps:

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Mise à jour des audiences TikTok
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          node <<'EOF'

          const SUPABASE_URL =
            process.env.SUPABASE_URL;

          const SUPABASE_KEY =
            process.env.SUPABASE_SERVICE_ROLE_KEY;


          async function supabaseFetch(path, options = {}) {

            const response = await fetch(
              SUPABASE_URL + path,
              {
                ...options,

                headers: {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Content-Type": "application/json",

                  ...(options.headers || {})
                }
              }
            );


            const text =
              await response.text();


            let data = null;


            try {

              data =
                text
                  ? JSON.parse(text)
                  : null;

            } catch {

              data = text;

            }


            if (!response.ok) {

              throw new Error(
                `Supabase ${response.status}: ${text}`
              );

            }


            return data;

          }


          function nombreValide(nombre) {

            if (
              typeof nombre !== "number" ||
              !Number.isFinite(nombre) ||
              nombre < 0
            ) {

              return null;

            }


            return Math.round(nombre);

          }


          async function recupererProfilTikTok(
            urlTikTok
          ) {

            const url =
              "https://pulse.walls.sh/profile?url=" +
              encodeURIComponent(
                urlTikTok
              );


            console.log(
              "Requête :",
              url
            );


            const response =
              await fetch(
                url,
                {
                  headers: {
                    "Accept":
                      "application/json",

                    "User-Agent":
                      "Avant-Garde-Audience-Bot/1.0"
                  }
                }
              );


            const texte =
              await response.text();


            console.log(
              "HTTP Pulse :",
              response.status
            );


            if (!response.ok) {

              throw new Error(
                `Pulse HTTP ${response.status}: ${texte}`
              );

            }


            let data;


            try {

              data =
                JSON.parse(
                  texte
                );

            } catch {

              throw new Error(
                "Réponse Pulse non JSON."
              );

            }


            return data;

          }


          function recalculerAudienceMax(
            profil
          ) {

            const valeurs = [

              {
                reseau:
                  "Facebook",

                valeur:
                  profil.facebook_audience
              },

              {
                reseau:
                  "Instagram",

                valeur:
                  profil.instagram_audience
              },

              {
                reseau:
                  "X",

                valeur:
                  profil.x_audience
              },

              {
                reseau:
                  "YouTube",

                valeur:
                  profil.youtube_audience
              },

              {
                reseau:
                  "TikTok",

                valeur:
                  profil.tiktok_audience
              }

            ].filter(
              x =>
                typeof x.valeur === "number" &&
                Number.isFinite(x.valeur)
            );


            if (
              valeurs.length === 0
            ) {

              return {
                audience_max:
                  null,

                audience_reseau:
                  null
              };

            }


            valeurs.sort(
              (a, b) =>
                b.valeur -
                a.valeur
            );


            return {

              audience_max:
                valeurs[0].valeur,

              audience_reseau:
                valeurs[0].reseau

            };

          }


          function compteIntrouvable(
            data
          ) {

            if (!data) {

              return true;

            }


            const erreur =
              String(
                data.error ||
                ""
              ).toLowerCase();


            return [
              "not_found",
              "content_unavailable"
            ].includes(
              erreur
            );

          }


          (async () => {

            if (
              !SUPABASE_URL ||
              !SUPABASE_KEY
            ) {

              throw new Error(
                "SUPABASE_URL ou SUPABASE_SERVICE_ROLE_KEY manquant."
              );

            }


            console.log(
              "Récupération des profils..."
            );


            const profils =
              await supabaseFetch(
                "/rest/v1/profiles" +
                "?select=id,nom,tiktok_url,facebook_audience,instagram_audience,x_audience,youtube_audience,tiktok_audience" +
                "&tiktok_url=not.is.null"
              );


            console.log(
              "Profils TikTok :",
              profils.length
            );


            for (
              const profil
              of profils
            ) {

              console.log("");

              console.log(
                "================================"
              );


              console.log(
                "Profil :",
                profil.nom
              );


              console.log(
                "URL :",
                profil.tiktok_url
              );


              try {

                const data =
                  await recupererProfilTikTok(
                    profil.tiktok_url
                  );


                console.log(
                  "Réponse :",
                  JSON.stringify(
                    data,
                    null,
                    2
                  )
                );


                /*
                 * Compte supprimé / inexistant.
                 * On ne conserve pas une ancienne
                 * valeur devenue obsolète.
                 */

                if (
                  compteIntrouvable(
                    data
                  )
                ) {

                  await supabaseFetch(
                    "/rest/v1/profiles?id=eq." +
                    profil.id,
                    {

                      method:
                        "PATCH",

                      body:
                        JSON.stringify({

                          tiktok_audience:
                            null,

                          audience_updated_at:
                            new Date()
                              .toISOString()

                        })

                    }
                  );


                  console.log(
                    "Compte TikTok introuvable : audience supprimée."
                  );


                  continue;

                }


                /*
                 * Récupération du nombre
                 * d'abonnés.
                 */

                const audience =
                  nombreValide(
                    data.followers
                  );


                if (
                  audience === null
                ) {

                  console.log(
                    "Audience TikTok non trouvée."
                  );


                  /*
                   * Erreur ou donnée absente :
                   * ancienne valeur conservée.
                   */

                  continue;

                }


                console.log(
                  "Audience TikTok trouvée :",
                  audience
                );


                /*
                 * Enregistrement de la nouvelle
                 * audience.
                 */

                await supabaseFetch(
                  "/rest/v1/profiles?id=eq." +
                  profil.id,
                  {

                    method:
                      "PATCH",

                    body:
                      JSON.stringify({

                        tiktok_audience:
                          audience,

                        audience_updated_at:
                          new Date()
                            .toISOString()

                      })

                  }
                );


                console.log(
                  "Audience TikTok enregistrée :",
                  audience
                );


                /*
                 * Relecture des audiences
                 * des cinq réseaux.
                 */

                const profilActualise =
                  await supabaseFetch(
                    "/rest/v1/profiles" +
                    "?select=facebook_audience,instagram_audience,x_audience,youtube_audience,tiktok_audience" +
                    "&id=eq." +
                    profil.id
                  );


                if (
                  profilActualise.length
                ) {

                  const max =
                    recalculerAudienceMax(
                      profilActualise[0]
                    );


                  await supabaseFetch(
                    "/rest/v1/profiles?id=eq." +
                    profil.id,
                    {

                      method:
                        "PATCH",

                      body:
                        JSON.stringify({

                          audience_max:
                            max.audience_max,

                          audience_reseau:
                            max.audience_reseau

                        })

                    }
                  );


                  console.log(
                    "Audience maximale :",
                    max.audience_max,

                    "(" +
                    max.audience_reseau +
                    ")"
                  );

                }


              } catch (error) {

                console.log(
                  "Erreur TikTok :",
                  error.message
                );


                /*
                 * Erreur technique :
                 * on conserve l'ancienne valeur.
                 */

              }

            }


            console.log("");

            console.log(
              "================================"
            );


            console.log(
              "MISE À JOUR TIKTOK TERMINÉE"
            );

          })();

          EOF
